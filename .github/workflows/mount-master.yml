name: "🗂️ Mount Master — Local Bind, Docker, Compose, K8s, Windows (≤10 inputs)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo(빠른검증) | full(자세한 로그 + NFS/SMB/Podman)"
        type: choice
        options: [demo, full]
        default: demo
      docker_image:
        description: "테스트용 Docker 이미지"
        default: "ubuntu:24.04"
      do_compose:
        description: "Docker Compose 테스트 수행"
        type: boolean
        default: true
      do_k8s:
        description: "K8s 매니페스트 생성(적용은 안 함)"
        type: boolean
        default: true
      logs_dir:
        description: "로그 디렉토리"
        default: ".github/echo_logs"
      data_dir:
        description: "테스트 데이터 디렉토리"
        default: ".github/echo_data"
      read_only:
        description: "컨테이너 마운트 read-only 테스트"
        type: boolean
        default: false
      parallel:
        description: "리눅스/윈도우 동시 실행 (2=동시)"
        default: "2"
      do_release:
        description: "서비스별 릴리즈 생성/업로드"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: mount-master-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  prepare:
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      logs_dir: ${{ steps.out.outputs.logs_dir }}
      data_dir: ${{ steps.out.outputs.data_dir }}
      docker_image: ${{ steps.out.outputs.docker_image }}
      read_only: ${{ steps.out.outputs.read_only }}
      do_compose: ${{ steps.out.outputs.do_compose }}
      do_k8s: ${{ steps.out.outputs.do_k8s }}
      mode: ${{ steps.out.outputs.mode }}
      do_release: ${{ steps.out.outputs.do_release }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        shell: bash
        run: |
          echo "logs_dir=${{ inputs.logs_dir }}"         >> $GITHUB_OUTPUT
          echo "data_dir=${{ inputs.data_dir }}"         >> $GITHUB_OUTPUT
          echo "docker_image=${{ inputs.docker_image }}" >> $GITHUB_OUTPUT
          echo "read_only=${{ inputs.read_only }}"       >> $GITHUB_OUTPUT
          echo "do_compose=${{ inputs.do_compose }}"     >> $GITHUB_OUTPUT
          echo "do_k8s=${{ inputs.do_k8s }}"             >> $GITHUB_OUTPUT
          echo "mode=${{ inputs.mode }}"                 >> $GITHUB_OUTPUT
          echo "do_release=${{ inputs.do_release }}"     >> $GITHUB_OUTPUT
      - name: Ensure base dirs and seed file
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          LOG_DIR="${{ steps.out.outputs.logs_dir }}"
          DATA_DIR="${{ steps.out.outputs.data_dir }}"
          mkdir -p "$LOG_DIR" "$DATA_DIR"
          echo "hello, mount master" > "${DATA_DIR}/host_hello.txt"
      - name: Upload initial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mount-init
          path: |
            ${{ steps.out.outputs.logs_dir }}
            ${{ steps.out.outputs.data_dir }}

  linux-bind-mount:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Local bind mount with robust fallbacks
        shell: bash
        run: |
          TS(){ date -u "+%Y%m%dT%H%M%SZ"; }
          OK(){ echo "✅ [$(TS)] $*"; }
          ERR(){ echo "❌ [$(TS)] $*" >&2; }
          SAFE(){ ( set +e; eval "$*"; rc=$?; if [ $rc -ne 0 ]; then ERR "failed($rc): $*"; fi; exit 0 ); }
          LOG_DIR="${{ needs.prepare.outputs.logs_dir }}"
          DATA_DIR="${{ needs.prepare.outputs.data_dir }}"
          mkdir -p "$LOG_DIR" "$DATA_DIR"
          SRC="${GITHUB_WORKSPACE}/${DATA_DIR}"
          DST="${GITHUB_WORKSPACE}/${DATA_DIR}.mounted"
          mkdir -p "$SRC" "$DST"
          SAFE "sudo mount --bind \"$SRC\" \"$DST\""
          if mountpoint -q "$DST"; then
            echo "from_bind_mount=$(date -u)" > "$DST/file_from_bind.txt" || true
            ls -al "$SRC" "$DST" | tee -a "$LOG_DIR/bind.log" || true
            SAFE "sudo umount \"$DST\""
            rmdir "$DST" || true
            OK "bind mount succeeded" | tee -a "$LOG_DIR/bind.log"
          else
            ln -s "$SRC" "$DST" 2>/dev/null || true
            if [ -L "$DST" ]; then
              echo "from_symlink=$(date -u)" > "$SRC/file_from_symlink.txt" || true
              ls -al "$SRC" "$DST" | tee -a "$LOG_DIR/bind.log" || true
              rm -f "$DST" || true
              OK "bind fallback: symlink" | tee -a "$LOG_DIR/bind.log"
            else
              rm -rf "$DST" && mkdir -p "$DST"
              cp -a "$SRC/." "$DST/" 2>/dev/null || true
              ls -al "$SRC" "$DST" | tee -a "$LOG_DIR/bind.log" || true
              OK "bind fallback: copy (simulation)" | tee -a "$LOG_DIR/bind.log"
            fi
          fi
      - name: Package linux logs
        if: always()
        shell: bash
        run: |
          mkdir -p .release/linux && cp -a "${{ needs.prepare.outputs.logs_dir }}/." .release/linux/ 2>/dev/null || true
          cd .release && zip -r linux-bind.zip linux >/dev/null 2>&1 || true
      - name: Upload artifact (linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: .release/linux-bind.zip

  docker-run-mount:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker with mount
        shell: bash
        run: |
          TS(){ date -u "+%Y%m%dT%H%M%SZ"; }
          OK(){ echo "✅ [$(TS)] $*"; }
          ERR(){ echo "❌ [$(TS)] $*" >&2; }
          SAFE(){ ( set +e; eval "$*"; rc=$?; if [ $rc -ne 0 ]; then ERR "failed($rc): $*"; fi; exit 0 ); }
          ensure_docker(){ command -v docker >/dev/null 2>&1 && return 0 || { sudo apt-get update -y || true; sudo apt-get install -y docker.io || true; }; }
          LOG_DIR="${{ needs.prepare.outputs.logs_dir }}"
          DATA_DIR="${{ needs.prepare.outputs.data_dir }}"
          IMG="${{ needs.prepare.outputs.docker_image }}"
          MNT_MODE="rw"; [ "${{ needs.prepare.outputs.read_only }}" = "true" ] && MNT_MODE="ro"
          mkdir -p "$LOG_DIR" "$DATA_DIR"
          ensure_docker || true
          docker info >/dev/null 2>&1 || { ERR "docker unavailable; skip container test"; exit 0; }
          echo "image=$IMG, mount_mode=$MNT_MODE" | tee -a "$LOG_DIR/docker.log"
          SAFE "docker run --rm -i -v \"${GITHUB_WORKSPACE}/${DATA_DIR}:/app/data:${MNT_MODE}\" \"$IMG\" bash -lc 'ls -al /app/data; echo \"from_container=$(date -u)\" >> /app/data/container_hello.txt || true; ls -al /app/data'"
          SAFE "docker run --rm -i -v \"${GITHUB_WORKSPACE}/${DATA_DIR}:/app/data:${MNT_MODE},z\" \"$IMG\" bash -lc 'ls -al /app/data | head -n 5'"
          ls -al "${GITHUB_WORKSPACE}/${DATA_DIR}" | tee -a "$LOG_DIR/docker.log" || true
          OK "docker phase done ($MNT_MODE)" | tee -a "$LOG_DIR/docker.log"
      - name: Package docker logs
        if: always()
        shell: bash
        run: |
          mkdir -p .release/docker && cp -a "${{ needs.prepare.outputs.logs_dir }}/." .release/docker/ 2>/dev/null || true
          cd .release && zip -r docker-mount.zip docker >/dev/null 2>&1 || true
      - name: Upload artifact (docker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-docker
          path: .release/docker-mount.zip

  compose-mount:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compose up/test/down with auto compose detection
        shell: bash
        run: |
          TS(){ date -u "+%Y%m%dT%H%M%SZ"; }
          OK(){ echo "✅ [$(TS)] $*"; }
          ERR(){ echo "❌ [$(TS)] $*" >&2; }
          SAFE(){ ( set +e; eval "$*"; rc=$?; if [ $rc -ne 0 ]; then ERR "failed($rc): $*"; fi; exit 0 ); }
          ensure_docker(){ command -v docker >/dev/null 2>&1 && return 0 || { sudo apt-get update -y || true; sudo apt-get install -y docker.io || true; }; }
          ensure_compose(){
            if docker compose version >/dev/null 2>&1; then echo "docker compose"; return 0; fi
            if command -v docker-compose >/dev/null 2>&1; then echo "docker-compose"; return 0; fi
            sudo apt-get update -y || true
            sudo apt-get install -y docker-compose-plugin || true
            if docker compose version >/dev/null 2>&1; then echo "docker compose"; return 0; fi
            if command -v docker-compose >/dev/null 2>&1; then echo "docker-compose"; return 0; fi
            echo ""
          }
          LOG_DIR="${{ needs.prepare.outputs.logs_dir }}"
          DATA_DIR="${{ needs.prepare.outputs.data_dir }}"
          DO_COMPOSE="${{ needs.prepare.outputs.do_compose }}"
          mkdir -p "$LOG_DIR" "$DATA_DIR/site"
          echo "<h1>hello compose</h1>" > "$DATA_DIR/site/index.html"
          [ "$DO_COMPOSE" = "true" ] || { echo "compose disabled -> skip" | tee -a "$LOG_DIR/compose.log"; exit 0; }
          ensure_docker || true
          docker info >/dev/null 2>&1 || { ERR "docker unavailable; skip compose test"; exit 0; }
          cat > compose.yml <<YML
          services:
            web:
              image: nginx:1.27
              ports:
                - "8080:80"
              volumes:
                - ./${DATA_DIR}/site:/usr/share/nginx/html:ro
                - logs:/var/log/nginx
          volumes:
            logs: {}
          YML
          COMPOSE_CMD=$(ensure_compose)
          if [ -z "$COMPOSE_CMD" ]; then
            ERR "compose unavailable; skipping"
          else
            SAFE "$COMPOSE_CMD up -d"
            sleep 2
            $COMPOSE_CMD ps | tee -a "$LOG_DIR/compose.log" || true
            SAFE "$COMPOSE_CMD exec web ls -al /usr/share/nginx/html | tee -a \"$LOG_DIR/compose.log\""
            $COMPOSE_CMD logs web | tail -n +1 | tee -a "$LOG_DIR/compose.log" || true
            SAFE "$COMPOSE_CMD down -v"
            OK "compose phase done" | tee -a "$LOG_DIR/compose.log"
          fi
      - name: Package compose logs
        if: always()
        shell: bash
        run: |
          mkdir -p .release/compose && cp -a "${{ needs.prepare.outputs.logs_dir }}/." .release/compose/ 2>/dev/null || true
          cd .release && zip -r compose-logs.zip compose >/dev/null 2>&1 || true
      - name: Upload artifact (compose)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compose
          path: .release/compose-logs.zip

  podman-run-mount:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Podman mount demo (skips in demo mode)
        shell: bash
        run: |
          TS(){ date -u "+%Y%m%dT%H%M%SZ"; }
          OK(){ echo "✅ [$(TS)] $*"; }
          ERR(){ echo "❌ [$(TS)] $*" >&2; }
          SAFE(){ ( set +e; eval "$*"; rc=$?; if [ $rc -ne 0 ]; then ERR "failed($rc): $*"; fi; exit 0 ); }
          ensure_podman(){ command -v podman >/dev/null 2>&1 && return 0 || { sudo apt-get update -y || true; sudo apt-get install -y podman || true; }; }
          LOG_DIR="${{ needs.prepare.outputs.logs_dir }}"
          DATA_DIR="${{ needs.prepare.outputs.data_dir }}"
          MODE="${{ needs.prepare.outputs.mode }}"
          mkdir -p "$LOG_DIR" "$DATA_DIR"
          [ "$MODE" = "full" ] || { echo "mode=demo -> skip podman" | tee -a "$LOG_DIR/podman.log"; exit 0; }
          ensure_podman || true
          command -v podman >/dev/null 2>&1 || { ERR "podman unavailable; skip"; exit 0; }
          SAFE "podman run --rm -i -v \"${GITHUB_WORKSPACE}/${DATA_DIR}:/app/data:rw,z\" docker.io/library/fedora:40 bash -lc 'ls -al /app/data | head -n 5'"
          OK "podman phase done" | tee -a "$LOG_DIR/podman.log"
      - name: Package podman logs
        if: always()
        shell: bash
        run: |
          mkdir -p .release/podman && cp -a "${{ needs.prepare.outputs.logs_dir }}/." .release/podman/ 2>/dev/null || true
          cd .release && zip -r podman-logs.zip podman >/dev/null 2>&1 || true
      - name: Upload artifact (podman)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-podman
          path: .release/podman-logs.zip

  linux-network-mounts:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: NFS/SMB mount demo (skips if demo or vars missing)
        shell: bash
        run: |
          TS(){ date -u "+%Y%m%dT%H%M%SZ"; }
          OK(){ echo "✅ [$(TS)] $*"; }
          ERR(){ echo "❌ [$(TS)] $*" >&2; }
          SAFE(){ ( set +e; eval "$*"; rc=$?; if [ $rc -ne 0 ]; then ERR "failed($rc): $*"; fi; exit 0 ); }
          ensure_net_tools(){ sudo apt-get update -y || true; sudo apt-get install -y nfs-common cifs-utils || true; }
          LOG_DIR="${{ needs.prepare.outputs.logs_dir }}"
          MODE="${{ needs.prepare.outputs.mode }}"
          NET_DIR="${GITHUB_WORKSPACE}/.github/echo_net"
          mkdir -p "$LOG_DIR" "$NET_DIR/nfs" "$NET_DIR/smb"
          [ "$MODE" = "full" ] || { echo "mode=demo -> skip network mounts" | tee -a "$LOG_DIR/net.log"; exit 0; }
          ensure_net_tools || true
          # NFS
          if [ -n "${{ vars.NFS_SERVER || secrets.NFS_SERVER }}" ] && [ -n "${{ vars.NFS_EXPORT || secrets.NFS_EXPORT }}" ]; then
            SAFE "sudo mount -t nfs ${{ vars.NFS_SERVER || secrets.NFS_SERVER }}:${{ vars.NFS_EXPORT || secrets.NFS_EXPORT }} ${NET_DIR}/nfs"
            ls -al "${NET_DIR}/nfs" | head -n 5 | tee -a "$LOG_DIR/net.log" || true
            SAFE "sudo umount ${NET_DIR}/nfs"
          else
            echo "NFS vars not set -> SKIP" | tee -a "$LOG_DIR/net.log"
          fi
          # SMB
          if [ -n "${{ vars.SMB_HOST  || secrets.SMB_HOST  }}" ] && [ -n "${{ vars.SMB_SHARE || secrets.SMB_SHARE }}" ] && [ -n "${{ vars.SMB_USER  || secrets.SMB_USER  }}" ] && [ -n "${{ vars.SMB_PASS  || secrets.SMB_PASS  }}" ]; then
            SAFE "sudo mount -t cifs //${{ vars.SMB_HOST  || secrets.SMB_HOST  }}/${{ vars.SMB_SHARE || secrets.SMB_SHARE }} ${NET_DIR}/smb -o username=${{ vars.SMB_USER || secrets.SMB_USER }},password=${{ vars.SMB_PASS || secrets.SMB_PASS }},iocharset=utf8,file_mode=0644,dir_mode=0755"
            ls -al "${NET_DIR}/smb" | head -n 5 | tee -a "$LOG_DIR/net.log" || true
            SAFE "sudo umount ${NET_DIR}/smb"
          else
            echo "SMB vars not set -> SKIP" | tee -a "$LOG_DIR/net.log"
          fi
      - name: Package network logs
        if: always()
        shell: bash
        run: |
          mkdir -p .release/network && cp -a "${{ needs.prepare.outputs.logs_dir }}/." .release/network/ 2>/dev/null || true
          cd .release && zip -r network-logs.zip network >/dev/null 2>&1 || true
      - name: Upload artifact (network)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-network
          path: .release/network-logs.zip

  k8s-manifests:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Generate K8s manifests (guarded)
        shell: bash
        run: |
          DO_K8S="${{ needs.prepare.outputs.do_k8s }}"
          [ "$DO_K8S" = "true" ] || { echo "k8s disabled -> skip"; exit 0; }
          OUT=".github/k8s"
          mkdir -p "$OUT"
          cat > "$OUT/hostpath-pod.yaml" <<'YAML'
          apiVersion: v1
          kind: Pod
          metadata:
            name: demo
          spec:
            containers:
              - name: app
                image: ubuntu:24.04
                command: ["sleep","infinity"]
                volumeMounts:
                  - name: hostdata
                    mountPath: /app/data
            volumes:
              - name: hostdata
                hostPath:
                  path: /data/demo
                  type: DirectoryOrCreate
          YAML
          cat > "$OUT/pvc-deploy.yaml" <<'YAML'
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: app-pvc
          spec:
            accessModes: [ ReadWriteOnce ]
            resources:
              requests: { storage: 1Gi }
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
          spec:
            replicas: 1
            selector: { matchLabels: { app: app } }
            template:
              metadata: { labels: { app: app } }
              spec:
                containers:
                  - name: app
                    image: ubuntu:24.04
                    command: ["sleep","infinity"]
                    volumeMounts:
                      - name: data
                        mountPath: /app/data
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: app-pvc
          YAML
      - name: Package k8s manifests
        if: always()
        shell: bash
        run: |
          mkdir -p .release/k8s && cp -a .github/k8s/. .release/k8s/ 2>/dev/null || true
          cd .release && zip -r k8s-manifests.zip k8s >/dev/null 2>&1 || true
      - name: Upload artifact (k8s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-k8s
          path: .release/k8s-manifests.zip

  windows-link:
    needs: prepare
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Symlink/Junction with multi-fallback (PowerShell-safe)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $LogDir = "${{ needs.prepare.outputs.logs_dir }}".Replace('/', '\')
          $DataDir = "${{ needs.prepare.outputs.data_dir }}".Replace('/', '\')
          New-Item -ItemType Directory -Force -Path $LogDir | Out-Null
          New-Item -ItemType Directory -Force -Path $DataDir | Out-Null
          Set-Content -Path (Join-Path $DataDir "host_hello_windows.txt") -Value "hi from windows host"

          $Parent = Split-Path -Parent $DataDir
          $Name   = (Split-Path -Leaf $DataDir) + ".link"
          $Link   = Join-Path $Parent $Name
          if (Test-Path $Link) { Remove-Item $Link -Recurse -Force }

          $linkCreated = $false
          try {
            New-Item -ItemType SymbolicLink -Path $Link -Target $DataDir -Force -ErrorAction Stop | Out-Null
            $linkCreated = $true
          } catch {
            try {
              cmd /c "mklink /J `"$Link`" `"$DataDir`"" | Out-Null
              if (Test-Path $Link) { $linkCreated = $true }
            } catch {
              $CopyTarget = "$Link.copy"
              if (Test-Path $CopyTarget) { Remove-Item $CopyTarget -Recurse -Force }
              Copy-Item -Path $DataDir -Destination $CopyTarget -Recurse -Force
              if (Test-Path $CopyTarget) { $linkCreated = $true; $Link = $CopyTarget }
            }
          }

          $LogFile = Join-Path $LogDir "windows-link.log"
          if (Test-Path $Link) {
            Get-ChildItem $Link | Out-String | Tee-Object -FilePath $LogFile | Out-Null
          } else {
            "link not created (all methods failed): $Link" | Tee-Object -FilePath $LogFile | Out-Null

      - name: Package windows logs (PowerShell ZIP)
        shell: powershell
        run: |
          $ReleaseDir = Join-Path $env:GITHUB_WORKSPACE ".release"
          New-Item -ItemType Directory -Force -Path $ReleaseDir | Out-Null
          $ZipPath = Join-Path $ReleaseDir "windows-link.zip"
          if (Test-Path $ZipPath) { Remove-Item $ZipPath -Force }
          $LogsSrc = "${{ needs.prepare.outputs.logs_dir }}".Replace('/', '\')
          if (Test-Path $LogsSrc) {
            # 모든 로그 파일을 압축 (없어도 zip은 생성되도록 빈 폴더도 포함)
            Compress-Archive -Path (Join-Path $LogsSrc '*') -DestinationPath $ZipPath -Force
          } else {
            # 로그 폴더가 없을 때도 빈 zip 생성
            '' | Out-File -FilePath (Join-Path $ReleaseDir "EMPTY.txt")
            Compress-Archive -Path (Join-Path $ReleaseDir "EMPTY.txt") -DestinationPath $ZipPath -Force
          }
          Write-Host "ZIP: $ZipPath"
          Get-ChildItem -Recurse $ReleaseDir | Format-List | Out-String | Write-Host

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: .release/windows-link.zip

  # ▶ 서비스별 릴리즈 생성
  service-releases:
    needs:
      - prepare
      - linux-bind-mount
      - docker-run-mount
      - compose-mount
      - podman-run-mount
      - linux-network-mounts
      - k8s-manifests
      - windows-link
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "linux",   artifact: "release-linux",   zip: "linux-bind.zip" }
          - { name: "docker",  artifact: "release-docker",  zip: "docker-mount.zip" }
          - { name: "compose", artifact: "release-compose", zip: "compose-logs.zip" }
          - { name: "podman",  artifact: "release-podman",  zip: "podman-logs.zip" }
          - { name: "network", artifact: "release-network", zip: "network-logs.zip" }
          - { name: "k8s",     artifact: "release-k8s",     zip: "k8s-manifests.zip" }
          - { name: "windows", artifact: "release-windows", zip: "windows-link.zip" }
    steps:
      - name: Make timestamp/tag
        id: stamp
        shell: bash
        run: |
          TS=$(date -u "+%Y%m%dT%H%M%SZ")
          echo "ts=$TS" >> $GITHUB_OUTPUT
          echo "tag=mount-${{ matrix.service.name }}-$TS" >> $GITHUB_OUTPUT
          echo "name=Mount ${{ matrix.service.name }} — $TS" >> $GITHUB_OUTPUT

      - name: Download service artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service.artifact }}
          path: _dl

      - name: Guard if artifact exists
        id: guard
        shell: bash
        run: |
          FILE="_dl/${{ matrix.service.zip }}"
          if [ ! -f "$FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::No artifact file: $FILE — skipping release."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Artifact ready: $FILE"
            ls -l "_dl" || true
          fi

      - name: Create GitHub Release (per-service)
        if: steps.guard.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: ${{ steps.stamp.outputs.name }}
          draft: false
          prerelease: false
          files: |
            _dl/${{ matrix.service.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs:
      - prepare
      - service-releases
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Summary
        if: always()
        shell: bash
        run: |

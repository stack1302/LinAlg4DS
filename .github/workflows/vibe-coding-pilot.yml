name: "🎧 Vibe Coding Pilot — Split Jobs + TimeGuard + No-Skip + Always-Continue"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 표기용(동작엔 영향 없음)"
        type: choice
        options: [full, lite]
        default: full
      framework:
        type: choice
        default: "fastapi"
        options: ["fastapi", "springboot", "node-express"]
      dirs_root:
        default: ".github/echo_dirs"
      dirs_count:
        default: "50"
      files_root:
        default: ".github/echo_files"
      files_count:
        default: "80"
      install_servers:
        description: "서버 설치를 원치 않으면 false (스킵 대신 noop 메시지)"
        type: boolean
        default: true
      auto_commit:
        type: boolean
        default: false
      force_success_message:
        type: boolean
        default: true
      do_release:
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  security-events: write
  packages: write

concurrency:
  group: vibe-coding-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ARTIFACT_DIR: .github/artifacts
  GATHER_DIR: .github/artifacts/gather
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"

  BULK_GLOBS: ".github/echo_files/*.txt docs/**/*.md README.md"
  REPLACE_FROM: "echo-file"
  REPLACE_TO:   "vibe-file"
  APPEND_LINE:  "# appended-by-workflow"
  RENAME_PREFIX: "bulk_"
  RENAME_SUFFIX: ""
  DUPLICATE_COPIES: "2"
  CHMOD_MODE: "644"
  APACHE_PORT: "8080"

  DO_SNAP_REFRESH: "false"
  DO_LANG_UPGRADE: "true"
  PY_UPGRADE_STRATEGY: "uv"
  NPM_AUDIT_FIX: "true"
  MVN_USE_LATEST: "true"

  NPM_PUBLISH: "false"
  NPM_DIRS: "nodeapp"
  NPM_REGISTRY_URL: "https://registry.npmjs.org"
  PYPI_PUBLISH: "false"
  PYPI_DIRS: "app"
  MVN_PUBLISH: "false"
  MVN_DIRS: "demo"
  MVN_DIST_URL: "https://maven.pkg.github.com/${{ github.repository }}"
  MVN_SERVER_ID: "github"

  DO_DB_MIGRATE: "false"
  DB_MIGRATOR: "flyway"

jobs:
  prep:
    name: "1) Prep & Scaffold (No heredoc / Always-Continue)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      framework: ${{ steps.cfg.outputs.framework }}
      dirs_root: ${{ steps.cfg.outputs.dirs_root }}
      files_root: ${{ steps.cfg.outputs.files_root }}
      install_servers: ${{ steps.cfg.outputs.install_servers }}
      mode: ${{ steps.cfg.outputs.mode }}
      auto_commit: ${{ steps.cfg.outputs.auto_commit }}
      force_success: ${{ steps.cfg.outputs.force_success }}
      files_count: ${{ steps.cfg.outputs.files_count }}
      dirs_count: ${{ steps.cfg.outputs.dirs_count }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Resolve inputs (no-skip policy)
        id: cfg
        shell: bash
        run: |
          set -Eeuo pipefail
          mode="${{ github.event.inputs.mode || 'full' }}"
          framework="${{ github.event.inputs.framework || 'fastapi' }}"
          dirs_root="${{ github.event.inputs.dirs_root || '.github/echo_dirs' }}"
          files_root="${{ github.event.inputs.files_root || '.github/echo_files' }}"
          dirs_count="${{ github.event.inputs.dirs_count || '50' }}"
          files_count="${{ github.event.inputs.files_count || '80' }}"
          install_servers="${{ github.event.inputs.install_servers || 'true' }}"
          auto_commit="${{ github.event.inputs.auto_commit || 'false' }}"
          force_success="${{ github.event.inputs.force_success_message || 'true' }}"
          {
            echo "mode=$mode"
            echo "framework=$framework"
            echo "dirs_root=$dirs_root"
            echo "files_root=$files_root"
            echo "dirs_count=$dirs_count"
            echo "files_count=$files_count"
            echo "install_servers=$install_servers"
            echo "auto_commit=$auto_commit"
            echo "force_success=$force_success"
          } >> "$GITHUB_OUTPUT"

      - name: System utils (jq/zip/rsync/curl/lsof)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y jq zip rsync curl lsof || true
          echo "utils installed (or already present)"

      - name: Directories & Files
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ECHO_OK="${ECHO_OK:-✅}"; ECHO_WARN="${ECHO_WARN:-⚠️}"; ECHO_FAIL="${ECHO_FAIL:-❌}"
          LOG_DIR="${LOG_DIR:-.github/echo_logs}"; mkdir -p "$LOG_DIR"
          LOG_FILE="${LOG_DIR}/vibe-$(date +%Y%m%d%H%M%S).log"
          FAIL_COUNT_FILE="${LOG_DIR}/.fail.count"; [ -f "$FAIL_COUNT_FILE" ] || echo 0 > "$FAIL_COUNT_FILE"
          echoe(){ printf '%s %s\n' "$ECHO_OK" "$*" | tee -a "$LOG_FILE"; }
          faile(){ printf '%s %s (rc=%s)\n' "$ECHO_FAIL" "$1" "${2:-1}" | tee -a "$LOG_FILE"; }
          inc_fail(){ n=$(cat "$FAIL_COUNT_FILE"); n=$((n+1)); echo "$n" > "$FAIL_COUNT_FILE"; }
          safe_run(){ local cmd="$*"; echoe "▶ ${cmd}"; bash -lc "$cmd"; rc=$?; [ $rc -ne 0 ] && faile "FAILED: $cmd" $rc && inc_fail; }
          summarize(){ n=$(cat "$FAIL_COUNT_FILE"); echoe "단계 완료 (실패 ${n}건, 계속 진행)"; }
          safe_run "mkdir -p '${{ steps.cfg.outputs.dirs_root }}' '${{ steps.cfg.outputs.files_root }}' app tests docs/adr docs/api"
          i=1; while [ $i -le "${{ steps.cfg.outputs.dirs_count }}" ]; do d=$(printf '%s/d%04d' "${{ steps.cfg.outputs.dirs_root }}" "$i"); safe_run "mkdir -p \"$d\""; i=$((i+1)); done
          i=1; while [ $i -le "${{ steps.cfg.outputs.files_count }}" ]; do f=$(printf '%s/file%04d.txt' "${{ steps.cfg.outputs.files_root }}" "$i"); safe_run "printf '%s %s\n' \"echo-file-$i\" \"$(date -Iseconds)\" > \"$f\""; i=$((i+1)); done
          safe_run "printf '# Vibe Coding Pilot\n- Created: %s\n' \"$(date -Iseconds)\" > README.md"
          safe_run "printf '# ADR-0001: Adopt Vibe Coding\n- Status: Accepted\n' > docs/adr/0001-adopt-vibe-coding.md"
          safe_run "printf '# API Notes\n- /health\n- /items/{id}\n' > docs/api/openapi-notes.md"
          summarize

      - name: Scaffold (FastAPI | Spring | Node) — no heredoc
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ECHO_OK="${ECHO_OK:-✅}"; ECHO_FAIL="${ECHO_FAIL:-❌}"
          LOG_DIR="${LOG_DIR:-.github/echo_logs}"; mkdir -p "$LOG_DIR"
          LOG_FILE="${LOG_DIR}/vibe-$(date +%Y%m%d%H%M%S).log"
          FAIL_COUNT_FILE="${LOG_DIR}/.fail.count"; [ -f "$FAIL_COUNT_FILE" ] || echo 0 > "$FAIL_COUNT_FILE"
          echoe(){ printf '%s %s\n' "$ECHO_OK" "$*" | tee -a "$LOG_FILE"; }
          faile(){ printf '%s %s (rc=%s)\n' "$ECHO_FAIL" "$1" "${2:-1}" | tee -a "$LOG_FILE"; }
          inc_fail(){ n=$(cat "$FAIL_COUNT_FILE"); n=$((n+1)); echo "$n" > "$FAIL_COUNT_FILE"; }
          safe_run(){ local cmd="$*"; echoe "▶ ${cmd}"; bash -lc "$cmd"; rc=$?; [ $rc -ne 0 ] && faile "FAILED: $cmd" $rc && inc_fail; }
          summarize(){ n=$(cat "$FAIL_COUNT_FILE"); echoe "단계 완료 (실패 ${n}건, 계속 진행)"; }
          fw="${{ steps.cfg.outputs.framework }}"
          if [ "$fw" = "fastapi" ]; then
            safe_run "python -m venv .venv && . .venv/bin/activate && pip -q install --upgrade pip fastapi uvicorn[standard] pytest httpx"
            safe_run "mkdir -p app tests"
            printf '%s\n' 'from fastapi import FastAPI' 'app = FastAPI()' '@app.get("/health")' 'def h(): return {"status":"ok"}' > app/main.py
            printf '%s\n' 'from fastapi.testclient import TestClient' 'from app.main import app' 'c=TestClient(app)' 'def test_health(): assert c.get("/health").json()["status"]=="ok"' > tests/test_app.py
          elif [ "$fw" = "springboot" ]; then
            safe_run "sudo apt-get update -y && sudo apt-get install -y maven default-jdk-headless"
            safe_run "mkdir -p demo && cd demo && mvn -q -B archetype:generate -DgroupId=com.example -DartifactId=demo -DarchetypeArtifactId=maven-archetype-quickstart -DarchetypeVersion=1.5"
            safe_run "sed -i 's/junit:junit:4.11/junit:junit:4.13.2/' demo/pom.xml || true"
          else
            safe_run "mkdir -p nodeapp"
            printf '%s\n' \
              'const e=require("express");const a=e();' \
              'a.get("/health",(_,r)=>r.json({status:"ok"}));' \
              'a.get("/items/:id",(q,r)=>r.json({id:+q.params.id,name:`item-${q.params.id}`}));' \
              'a.listen(3000,()=>console.log("up"));' > nodeapp/index.js
            safe_run "cd nodeapp && npm init -y && npm i express"
            jq '.scripts.start="node index.js" | .name="vibe-nodeapp" | .version="0.0.1"' nodeapp/package.json > nodeapp/package.tmp && mv nodeapp/package.tmp nodeapp/package.json || true
            printf '%s\n' 'registry=https://registry.npmjs.org' 'always-auth=false' > nodeapp/.npmrc
          fi
          summarize

      - name: Cache setup
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.m2/repository
          key: vibe-${{ runner.os }}-${{ hashFiles('**/requirements*.txt','**/pyproject.toml','**/package*.json','**/pom.xml') }}
          restore-keys: |
            vibe-${{ runner.os }}-

      - name: Smoke (quick) — always continue
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ECHO_OK="${ECHO_OK:-✅}"; ECHO_FAIL="${ECHO_FAIL:-❌}"
          LOG_DIR="${LOG_DIR:-.github/echo_logs}"; mkdir -p "$LOG_DIR"
          LOG_FILE="${LOG_DIR}/vibe-$(date +%Y%m%d%H%M%S).log"
          echoe(){ printf '%s %s\n' "$ECHO_OK" "$*" | tee -a "$LOG_FILE"; }
          safe(){ bash -lc "$1"; [ $? -eq 0 ] && echoe "$1 OK" || echo "⚠️ $1 failed (but continuing)"; }
          fw="${{ steps.cfg.outputs.framework }}"
          case "$fw" in
            fastapi) safe ". .venv/bin/activate && uvicorn app.main:app --host 127.0.0.1 --port 8000 &"; sleep 2; safe "curl -fsS 127.0.0.1:8000/health"; safe "lsof -ti:8000 | xargs -r kill" ;;
            node-express) safe "node nodeapp/index.js &"; sleep 2; safe "curl -fsS 127.0.0.1:3000/health"; safe "lsof -ti:3000 | xargs -r kill" ;;
            *) echo "spring demo 는 빌드 스킵(성공 처리)";;
          esac

  services_db:
    name: "2) Services & DB (No-Skip / Always-Continue)"
    runs-on: ubuntu-24.04
    needs: [prep]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install services
        shell: bash
        continue-on-error: true
        run: |
          set +e
          if [ "${{ needs.prep.outputs.install_servers }}" != "true" ] && [ "${{ needs.prep.outputs.install_servers }}" != "True" ]; then
            echo "⚠️ install_servers=false → 설치는 생략(NOOP)하지만 단계는 성공으로 진행"; exit 0; fi
          export DEBIAN_FRONTEND=noninteractive
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
          sudo dpkg --configure -a || true
          sudo apt-get update -y
          sudo apt-get install -y nginx apache2 redis-server postgresql postgresql-contrib curl lsof || true
          echo "Services installed (or already present)"

      - name: Start & check services
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo 'OK NGINX' | sudo tee /var/www/html/index.html >/dev/null || true
          sudo systemctl enable --now nginx || sudo service nginx start || true
          sudo systemctl enable --now apache2 || sudo service apache2 start || true
          sudo systemctl enable --now redis-server || sudo service redis-server start || true
          sudo systemctl enable --now postgresql || sudo service postgresql start || true
          curl -fsS 127.0.0.1/ | head -n1 || echo "⚠️ nginx check failed (continue)"

      - name: Apache change port & verify
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo sed -i 's/^Listen 80$/Listen '"${APACHE_PORT}"'/' /etc/apache2/ports.conf || true
          sudo sed -i 's@<VirtualHost \*:80>@<VirtualHost *:'"${APACHE_PORT}"'>@' /etc/apache2/sites-available/000-default.conf || true
          sudo systemctl restart apache2 || true
          curl -fsS 127.0.0.1:${APACHE_PORT}/ | head -n2 || echo "⚠️ apache check failed (continue)"

      - name: PostgreSQL init/seed/verify/dump
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo -u postgres psql -c "CREATE DATABASE vibe_db;" || true
          printf '%s\n' '\c vibe_db' \
                         'CREATE TABLE IF NOT EXISTS items(id serial primary key, name text);' \
                         "INSERT INTO items(name) VALUES ('hello'),('world') ON CONFLICT DO NOTHING;" > /tmp/seed.sql
          sudo -u postgres psql -f /tmp/seed.sql || true
          printf '%s\n' '\c vibe_db' 'SELECT COUNT(*) FROM items;' > /tmp/test.sql
          sudo -u postgres psql -f /tmp/test.sql | tee ${LOG_DIR}/pg_test.txt || true
          sudo -u postgres pg_dump -Fc -d vibe_db -f ${ARTIFACT_DIR}/vibe_db.dump || true
          echo "DB ready (or continued after soft errors)"

  finalize:
    name: "3) Bulk/Sec/Docs/Deps/Publish/Gather (No-Skip / Always-Continue)"
    runs-on: ubuntu-24.04
    needs: [prep, services_db]
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bulk modify
        shell: bash
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob globstar
          GLOBS="${BULK_GLOBS}"
          FILES=(); for g in ${GLOBS}; do for f in $g; do [ -f "$f" ] && FILES+=("$f"); done; done
          if [ ${#FILES[@]} -eq 0 ]; then echo "⚠️ 대상 없음 (continue)"; else
            for f in "${FILES[@]}"; do
              [ -n "${REPLACE_FROM}" ] && sed -i "s/${REPLACE_FROM//\//\\/}/${REPLACE_TO//\//\\/}/g" "$f" || true
              [ -n "${APPEND_LINE}" ] && printf '%s\n' "${APPEND_LINE}" >> "$f" || true
              dir=$(dirname "$f"); base=$(basename "$f"); name="${base%.*}"; ext="${base##*.}"; dot="."
              [ "$base" = "$ext" ] && dot=""
              new="${dir}/${RENAME_PREFIX}${name}${RENAME_SUFFIX}${dot}${ext}"
              if [ -n "${RENAME_PREFIX}${RENAME_SUFFIX}" ]; then mv -f "$f" "$new"; f="$new"; fi
              if [ "${DUPLICATE_COPIES:-0}" -gt 0 ]; then i=1; while [ $i -le "${DUPLICATE_COPIES}" ]; do cp -f "$f" "${f%.*}_copy${i}${dot}${ext}"; i=$((i+1)); done; fi
            done
            find . -type f -not -path './.git/*' -exec chmod ${CHMOD_MODE} {} + || true
            find . -type d -not -path './.git/*' -exec chmod 755 {} + || true
          fi
          git status --porcelain | tee ${LOG_DIR}/bulk_changes.txt || true
          echo "Bulk modify done (soft errors tolerated)"

      - name: SBOM (Syft)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin || true
          syft dir:. -o cyclonedx-json > ${ARTIFACT_DIR}/sbom.json || syft packages dir:. -o cyclonedx-json > ${ARTIFACT_DIR}/sbom.json || true
          echo "SBOM generated (or continued after soft errors)"

      - name: Vulnerability scan (Trivy + pip-audit)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || true
          trivy fs --scanners vuln,secret,misconfig --timeout 5m --no-progress --ignore-unfixed -f json -o ${ARTIFACT_DIR}/trivy.json . || true
          python3 -m pip -q install -U pip-audit || true
          pip-audit -f json -o ${ARTIFACT_DIR}/pip-audit.json || true
          echo "Security scans done (soft errors tolerated)"

      - name: Docs pack
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p docs/adr docs/api || true
          zip -qr ${ARTIFACT_DIR}/docs.zip docs || true
          echo "Docs zipped (soft errors tolerated)"

      - name: Language deps upgrade
        shell: bash
        continue-on-error: true
        run: |
          set +e
          if [ "${DO_LANG_UPGRADE}" = "true" ]; then
            python3 -m pip -q install -U uv || true
            shopt -s globstar nullglob
            for req in **/requirements*.txt; do uv pip compile --upgrade "$req" -o "$req" || true; uv pip sync "$req" || true; done
            npm i -g npm-check-updates || true
            for d in $(ls -d */ 2>/dev/null); do
              [ -f "$d/package.json" ] || continue
              ncu -u "$d/package.json" || true
              npm --prefix "$d" install || true
              [ "$NPM_AUDIT_FIX" = "true" ] && npm --prefix "$d" audit fix || true
            done
            sudo apt-get update -y && sudo apt-get install -y maven default-jdk-headless || true
            for pom in **/pom.xml; do
              mvn -q -f "$pom" versions:use-latest-releases -DgenerateBackupPoms=false || true
              mvn -q -f "$pom" -DskipTests verify || true
            done
          else
            echo "DO_LANG_UPGRADE=false → 업그레이드 noop (continue)"
          fi
          echo "Deps upgrade stage completed (soft errors tolerated)"

      - name: Gather artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibe-artifacts
          path: |
            .github/echo_logs/**
            .github/artifacts/**
            ${{ needs.prep.outputs.dirs_root }}/**
            ${{ needs.prep.outputs.files_root }}/**
            app/**
            docs/**
            nodeapp/**
            demo/**
            README.md
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: true

      - name: Release/Publish (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.do_release == 'true' || github.event.inputs.do_release == true) }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "릴리즈/퍼블리시는 별도 분리 권장 — 여기서는 성공 메시지만 남기고 통과"

      - name: Auto-commit (optional)
        if: ${{ needs.prep.outputs.auto_commit == 'true' || needs.prep.outputs.auto_commit == 'True' }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(vibe): bulk & artifacts [skip ci]" || true
          git push || true
          echo "Auto-commit attempted (soft errors tolerated)"

      - name: ✅ Always-success banner
        if: ${{ needs.prep.outputs.force_success == 'true' || needs.prep.outputs.force_success == 'True' }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "## ✅ 전체 파이프라인 완료 (No-Skip / Always-Continue)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 모드: ${{ needs.prep.outputs.mode }} / 프레임워크: ${{ needs.prep.outputs.framework }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 디렉토리/파일: ${{ needs.prep.outputs.dirs_root }} (x${{ needs.prep.outputs.dirs_count }}), ${{ needs.prep.outputs.files_root }} (x${{ needs.prep.outputs.files_count }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- 서버 설치 플래그: ${{ needs.prep.outputs.install_servers }} (false면 단계는 실행되나 설치는 noop)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 아티팩트: vibe-artifacts" >> "$GITHUB_STEP_SUMMARY"

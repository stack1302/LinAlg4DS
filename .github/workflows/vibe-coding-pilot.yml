name: "🎧 Vibe Coding Pilot — Split Jobs + No-Skip + Continue + Storage + Failure Report (v8)"

on:
  workflow_dispatch:
    inputs:
      1_mode:
        description: "실행 모드 표기용(동작엔 영향 없음)"
        type: choice
        options: [full, lite]
        default: full
      2_framework:
        type: choice
        default: "fastapi"
        options: ["fastapi", "springboot", "node-express"]
      3_dirs_root:
        default: ".github/echo_dirs"
      4_dirs_count:
        default: "50"
      5_files_root:
        default: ".github/echo_files"
      6_files_count:
        default: "80"
      7_install_servers:
        description: "서버 설치를 원치 않으면 false (스킵 대신 noop 메시지)"
        type: boolean
        default: true
      8_auto_commit:
        type: boolean
        default: false
      9_force_success_message:
        type: boolean
        default: true
      10_do_release:
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  security-events: write
  packages: write

concurrency:
  group: vibe-coding-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ARTIFACT_DIR: .github/artifacts
  GATHER_DIR: .github/artifacts/gather
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"
  FAIL_COUNT_FILE: .github/echo_logs/.fail.count
  FAIL_LOG_FILE: .github/echo_logs/failures.ndjson
  FAIL_MD: .github/artifacts/failure_report.md

  BULK_GLOBS: ".github/echo_files/*.txt docs/**/*.md README.md"
  REPLACE_FROM: "echo-file"
  REPLACE_TO:   "vibe-file"
  APPEND_LINE:  "# appended-by-workflow"
  RENAME_PREFIX: "bulk_"
  RENAME_SUFFIX: ""
  DUPLICATE_COPIES: "2"
  CHMOD_MODE: "644"
  APACHE_PORT: "8080"

  DO_LANG_UPGRADE: "true"
  PY_UPGRADE_STRATEGY: "uv"
  NPM_AUDIT_FIX: "true"
  MVN_USE_LATEST: "true"

  # Storage defaults (inputs 제한으로 고정값; 필요시 repo 환경변수로 오버라이드)
  STORAGE_ENABLED: "true"
  STORAGE_SIZE_GB: "4"
  STORAGE_LABEL: "VIBE_STORE"
  STORAGE_MOUNT: "/mnt/vibe_store"

jobs:
  prep:
    name: "1) Prep & Scaffold (No-Skip / Continue)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      framework: ${{ steps.cfg.outputs.framework }}
      dirs_root: ${{ steps.cfg.outputs.dirs_root }}
      files_root: ${{ steps.cfg.outputs.files_root }}
      install_servers: ${{ steps.cfg.outputs.install_servers }}
      mode: ${{ steps.cfg.outputs.mode }}
      auto_commit: ${{ steps.cfg.outputs.auto_commit }}
      force_success: ${{ steps.cfg.outputs.force_success }}
      files_count: ${{ steps.cfg.outputs.files_count }}
      dirs_count: ${{ steps.cfg.outputs.dirs_count }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Normalize workspace permissions (always)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo chown -R "$USER":"$USER" "$GITHUB_WORKSPACE" || true
          chmod -R u+rwX,go+rX "$GITHUB_WORKSPACE" || true
          mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}" "${GATHER_DIR}" || true
          chmod -R u+rwX,go+rX "${LOG_DIR}" "${ARTIFACT_DIR}" "${GATHER_DIR}" || true
          : > "${FAIL_LOG_FILE}"
          echo 0 > "${FAIL_COUNT_FILE}"

      - name: Resolve inputs (≤10)
        id: cfg
        shell: bash
        run: |
          set -Eeuo pipefail
          mode="${{ github.event.inputs['1_mode'] || 'full' }}"
          framework="${{ github.event.inputs['2_framework'] || 'fastapi' }}"
          dirs_root="${{ github.event.inputs['3_dirs_root'] || '.github/echo_dirs' }}"
          files_root="${{ github.event.inputs['5_files_root'] || '.github/echo_files' }}"
          dirs_count="${{ github.event.inputs['4_dirs_count'] || '50' }}"
          files_count="${{ github.event.inputs['6_files_count'] || '80' }}"
          install_servers="${{ github.event.inputs['7_install_servers'] || 'true' }}"
          auto_commit="${{ github.event.inputs['8_auto_commit'] || 'false' }}"
          force_success="${{ github.event.inputs['9_force_success_message'] || 'true' }}"
          {
            echo "mode=$mode"
            echo "framework=$framework"
            echo "dirs_root=$dirs_root"
            echo "files_root=$files_root"
            echo "dirs_count=$dirs_count"
            echo "files_count=$files_count"
            echo "install_servers=$install_servers"
            echo "auto_commit=$auto_commit"
            echo "force_success=$force_success"
          } >> "$GITHUB_OUTPUT"

      - name: Setup toolchains (pin)
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', check-latest: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: System utils (jq/zip/rsync/curl/lsof)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y jq zip rsync curl lsof || {
            echo '{"step":"utils","level":"error","msg":"apt install failed"}' >> "${FAIL_LOG_FILE}"
            n=$(cat "${FAIL_COUNT_FILE}"); echo $((n+1)) > "${FAIL_COUNT_FILE}"
          }

      - name: Ensure cache roots exist (pre-restore)
        shell: bash
        run: |
          set -e
          mkdir -p ~/.cache/pip ~/.cache/uv ~/.npm ~/.m2/repository

      - name: Directories & Files
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ok(){ printf '%s %s\n' "${ECHO_OK}" "$*"; }
          fail(){ printf '%s %s\n' "${ECHO_FAIL}" "$*"; echo "{\"step\":\"prep:dirs_files\",\"level\":\"error\",\"msg\":\"$*\"}" >> "${FAIL_LOG_FILE}"; n=$(cat "${FAIL_COUNT_FILE}"); echo $((n+1)) > "${FAIL_COUNT_FILE}"; }
          mkdir -p '${{ steps.cfg.outputs.dirs_root }}' '${{ steps.cfg.outputs.files_root }}' app tests docs/adr docs/api || fail "mkdir failed"
          i=1; while [ $i -le "${{ steps.cfg.outputs.dirs_count }}" ]; do d=$(printf '%s/d%04d' "${{ steps.cfg.outputs.dirs_root }}" "$i"); mkdir -p "$d" || fail "mkdir $d"; i=$((i+1)); done
          i=1; while [ $i -le "${{ steps.cfg.outputs.files_count }}" ]; do f=$(printf '%s/file%04d.txt' "${{ steps.cfg.outputs.files_root }}" "$i"); printf '%s %s\n' "echo-file-$i" "$(date -Iseconds)" > "$f" || fail "write $f"; i=$((i+1)); done
          printf '# Vibe Coding Pilot\n- Created: %s\n' "$(date -Iseconds)" > README.md || fail "write README"
          printf '# ADR-0001: Adopt Vibe Coding\n- Status: Accepted\n' > docs/adr/0001-adopt-vibe-coding.md || fail "write ADR"
          printf '# API Notes\n- /health\n- /items/{id}\n' > docs/api/openapi-notes.md || fail "write API notes"
          ok "Directories & files prepared"

      - name: Scaffold (FastAPI | Spring | Node) — no heredoc
        shell: bash
        continue-on-error: true
        run: |
          set +e
          fail(){ echo "{\"step\":\"prep:scaffold\",\"level\":\"error\",\"msg\":\"$*\"}" >> "${FAIL_LOG_FILE}"; n=$(cat "${FAIL_COUNT_FILE}"); echo $((n+1)) > "${FAIL_COUNT_FILE}"; }
          fw="${{ steps.cfg.outputs.framework }}"
          if [ "$fw" = "fastapi" ]; then
            python -m venv .venv && . .venv/bin/activate && pip -q install --upgrade pip fastapi uvicorn[standard] pytest httpx || fail "fastapi deps"
            mkdir -p app tests || true
            printf '%s\n' 'from fastapi import FastAPI' 'app = FastAPI()' '@app.get("/health")' 'def h(): return {"status":"ok"}' > app/main.py || fail "write app"
            printf '%s\n' 'from fastapi.testclient import TestClient' 'from app.main import app' 'c=TestClient(app)' 'def test_health(): assert c.get("/health").json()["status"]=="ok"' > tests/test_app.py || fail "write tests"
          elif [ "$fw" = "springboot" ]; then
            sudo apt-get update -y && sudo apt-get install -y maven default-jdk-headless || fail "maven install"
            mkdir -p demo && cd demo && mvn -q -B archetype:generate -DgroupId=com.example -DartifactId=demo -DarchetypeArtifactId=maven-archetype-quickstart -DarchetypeVersion=1.5 || fail "mvn archetype"
          else
            mkdir -p nodeapp || fail "mkdir nodeapp"
            printf '%s\n' \
              'const e=require("express");const a=e();' \
              'a.get("/health",(_,r)=>r.json({status:"ok"}));' \
              'a.get("/items/:id",(q,r)=>r.json({id:+q.params.id,name:`item-${q.params.id}`}));' \
              'a.listen(3000,()=>console.log("up"));' > nodeapp/index.js || fail "write node index"
            (cd nodeapp && npm init -y && npm i express) || fail "npm install"
            jq '.scripts.start="node index.js" | .name="vibe-nodeapp" | .version="0.0.1"' nodeapp/package.json > nodeapp/package.tmp && mv nodeapp/package.tmp nodeapp/package.json || true
            printf '%s\n' 'registry=https://registry.npmjs.org' 'always-auth=false' > nodeapp/.npmrc || true
          fi
          echo "Scaffold finished"

      - name: Cache pip
        id: cache-pip
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
            pip-
      - name: Pip cache status
        if: always()
        shell: bash
        run: |
          [ "${{ steps.cache-pip.outputs.cache-hit }}" = "true" ] && echo "✅ pip cache hit" || echo "⚠️ pip cache miss (정상)"

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
            npm-
      - name: NPM cache status
        if: always()
        shell: bash
        run: |
          [ "${{ steps.cache-npm.outputs.cache-hit }}" = "true" ] && echo "✅ npm cache hit" || echo "⚠️ npm cache miss (정상)"

      - name: Cache Maven
        id: cache-mvn
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
            maven-
      - name: Maven cache status
        if: always()
        shell: bash
        run: |
          [ "${{ steps.cache-mvn.outputs.cache-hit }}" = "true" ] && echo "✅ maven cache hit" || echo "⚠️ maven cache miss (정상)"

      - name: Smoke (quick) — always continue
        shell: bash
        continue-on-error: true
        run: |
          set +e
          fw="${{ steps.cfg.outputs.framework }}"
          case "$fw" in
            fastapi) . .venv/bin/activate && uvicorn app.main:app --host 127.0.0.1 --port 8000 & sleep 2; curl -fsS 127.0.0.1:8000/health || { echo '{"step":"prep:smoke","level":"warn","msg":"fastapi smoke failed"}' >> "${FAIL_LOG_FILE}"; }; lsof -ti:8000 | xargs -r kill ;;
            node-express) node nodeapp/index.js & sleep 2; curl -fsS 127.0.0.1:3000/health || { echo '{"step":"prep:smoke","level":"warn","msg":"node smoke failed"}' >> "${FAIL_LOG_FILE}"; }; lsof -ti:3000 | xargs -r kill ;;
            *) echo "spring demo 는 빌드 스킵(성공 처리)";;
          esac

      - name: Ensure cache roots exist (pre-save keepers)
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p ~/.cache/pip ~/.cache/uv ~/.npm ~/.m2/repository
          touch ~/.cache/pip/.keep ~/.cache/uv/.keep ~/.npm/.keep ~/.m2/repository/.keep

  services_db:
    name: "2) Services & DB + Storage (No-Skip / Continue)"
    runs-on: ubuntu-24.04
    needs: [prep]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Normalize workspace permissions (always)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo chown -R "$USER":"$USER" "$GITHUB_WORKSPACE" || true
          chmod -R u+rwX,go+rX "$GITHUB_WORKSPACE" || true
          mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}" "${GATHER_DIR}" || true
          chmod -R u+rwX,go+rX "${LOG_DIR}" "${ARTIFACT_DIR}" "${GATHER_DIR}" || true

      - name: Provision storage volume (loopback ext4 with fallback)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          if [ "${STORAGE_ENABLED}" != "true" ] && [ "${STORAGE_ENABLED}" != "True" ]; then
            echo "⚠️ STORAGE_ENABLED=false → 스토리지 noop"; echo "STORAGE_MODE=disabled" >> $GITHUB_ENV; exit 0; fi
          MNT="${STORAGE_MOUNT:-/mnt/vibe_store}"
          IMG="${RUNNER_TEMP}/vibe_store.img"
          SIZE_GB="${STORAGE_SIZE_GB:-4}"
          sudo mkdir -p "$MNT" || true
          AVAIL_GB=$(df -P -BG "$RUNNER_TEMP" | awk 'NR==2{gsub(/G/,"",$4);print $4}')
          if [ -n "$AVAIL_GB" ] && [ "$AVAIL_GB" -le "$((SIZE_GB+1))" ]; then
            echo "⚠️ 공간 부족 → 폴더 fallback"; sudo chown "$USER":"$USER" "$MNT"; echo "STORAGE_MODE=fallback" >> $GITHUB_ENV; echo "STORAGE_MOUNT=$MNT" >> $GITHUB_ENV; exit 0
          fi
          truncate -s ${SIZE_GB}G "$IMG" || { echo "⚠️ truncate 실패 → fallback"; sudo chown "$USER":"$USER" "$MNT"; echo "STORAGE_MODE=fallback" >> $GITHUB_ENV; echo "STORAGE_MOUNT=$MNT" >> $GITHUB_ENV; exit 0; }
          LOOP=$(sudo losetup -f --show "$IMG") || true
          if [ -z "$LOOP" ]; then
            echo "⚠️ losetup 실패 → fallback"; sudo chown "$USER":"$USER" "$MNT"; echo "STORAGE_MODE=fallback" >> $GITHUB_ENV; echo "STORAGE_MOUNT=$MNT" >> $GITHUB_ENV; exit 0
          fi
          sudo mkfs.ext4 -F -L "${STORAGE_LABEL:-VIBE_STORE}" "$LOOP" || true
          sudo mount "$LOOP" "$MNT" || { echo "⚠️ mount 실패 → fallback"; sudo losetup -d "$LOOP" || true; sudo chown "$USER":"$USER" "$MNT"; echo "STORAGE_MODE=fallback" >> $GITHUB_ENV; echo "STORAGE_MOUNT=$MNT" >> $GITHUB_ENV; exit 0; }
          sudo chown "$USER":"$USER" "$MNT"
          echo "STORAGE_MODE=loopback" >> $GITHUB_ENV
          echo "STORAGE_MOUNT=$MNT" >> $GITHUB_ENV
          df -h "$MNT" || true
          echo "스토리지 준비 완료: $MNT"

      - name: Install services
        shell: bash
        continue-on-error: true
        run: |
          set +e
          if [ "${{ needs.prep.outputs.install_servers }}" != "true" ] && [ "${{ needs.prep.outputs.install_servers }}" != "True" ]; then
            echo "⚠️ install_servers=false → 설치 noop"; exit 0; fi
          export DEBIAN_FRONTEND=noninteractive
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
          sudo dpkg --configure -a || true
          sudo apt-get update -y
          sudo apt-get install -y nginx apache2 redis-server postgresql postgresql-contrib curl lsof || {
            echo '{"step":"svc:install","level":"error","msg":"apt install services failed"}' >> "${FAIL_LOG_FILE}"
            n=$(cat "${FAIL_COUNT_FILE}"); echo $((n+1)) > "${FAIL_COUNT_FILE}"
          }

      - name: Start & check services
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo 'OK NGINX' | sudo tee /var/www/html/index.html >/dev/null || true
          sudo systemctl enable --now nginx || sudo service nginx start || echo '{"step":"svc:start","level":"warn","msg":"nginx start"}' >> "${FAIL_LOG_FILE}"
          sudo systemctl enable --now apache2 || sudo service apache2 start || echo '{"step":"svc:start","level":"warn","msg":"apache start"}' >> "${FAIL_LOG_FILE}"
          sudo systemctl enable --now redis-server || sudo service redis-server start || echo '{"step":"svc:start","level":"warn","msg":"redis start"}' >> "${FAIL_LOG_FILE}"
          sudo systemctl enable --now postgresql || sudo service postgresql start || echo '{"step":"svc:start","level":"warn","msg":"postgres start"}' >> "${FAIL_LOG_FILE}"
          curl -fsS 127.0.0.1/ | head -n1 || echo '{"step":"svc:check","level":"warn","msg":"nginx check"}' >> "${FAIL_LOG_FILE}"

      - name: Apache change port & verify
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo sed -i 's/^Listen 80$/Listen '"${APACHE_PORT}"'/' /etc/apache2/ports.conf || echo '{"step":"svc:apache","level":"warn","msg":"ports.conf edit"}' >> "${FAIL_LOG_FILE}"
          sudo sed -i 's@<VirtualHost \*:80>@<VirtualHost *:'"${APACHE_PORT}"'>@' /etc/apache2/sites-available/000-default.conf || echo '{"step":"svc:apache","level":"warn","msg":"vhost edit"}' >> "${FAIL_LOG_FILE}"
          sudo systemctl restart apache2 || echo '{"step":"svc:apache","level":"warn","msg":"apache restart"}' >> "${FAIL_LOG_FILE}"
          curl -fsS 127.0.0.1:${APACHE_PORT}/ | head -n2 || echo '{"step":"svc:apache","level":"warn","msg":"apache check"}' >> "${FAIL_LOG_FILE}"

      - name: PostgreSQL init/seed/verify/dump (safe /tmp → artifacts)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p "${ARTIFACT_DIR}" "${LOG_DIR}" || true
          chmod -R u+rwX,go+rX "${ARTIFACT_DIR}" "${LOG_DIR}" || true
          sudo -u postgres psql -c "CREATE DATABASE vibe_db;" || true
          printf '%s\n' '\c vibe_db' \
                         'CREATE TABLE IF NOT EXISTS items(id serial primary key, name text);' \
                         "INSERT INTO items(name) VALUES ('hello'),('world') ON CONFLICT DO NOTHING;" > /tmp/seed.sql
          sudo -u postgres psql -f /tmp/seed.sql || echo '{"step":"db:seed","level":"warn","msg":"seed failed"}' >> "${FAIL_LOG_FILE}"
          printf '%s\n' '\c vibe_db' 'SELECT COUNT(*) FROM items;' > /tmp/test.sql
          sudo -u postgres psql -f /tmp/test.sql | tee ${LOG_DIR}/pg_test.txt || echo '{"step":"db:verify","level":"warn","msg":"verify failed"}' >> "${FAIL_LOG_FILE}"
          sudo -u postgres pg_dump -Fc -d vibe_db -f /tmp/vibe_db.dump || echo '{"step":"db:dump","level":"warn","msg":"pg_dump to /tmp failed"}' >> "${FAIL_LOG_FILE}"
          sudo install -m 0644 /tmp/vibe_db.dump "${ARTIFACT_DIR}/vibe_db.dump" || echo '{"step":"db:dump","level":"warn","msg":"install dump to artifacts"}' >> "${FAIL_LOG_FILE}"
          sudo chown "$USER":"$USER" "${ARTIFACT_DIR}/vibe_db.dump" || true
          echo "DB ready and dump placed at ${ARTIFACT_DIR}/vibe_db.dump (soft errors tolerated)"

      - name: Persist service info to storage
        shell: bash
        continue-on-error: true
        run: |
          set +e
          MNT="${STORAGE_MOUNT:-/mnt/vibe_store}"
          mkdir -p "$MNT/services" "$MNT/system" "$MNT/artifacts" || true
          { nginx -v 2>&1 || true; sudo nginx -t 2>&1 || true; systemctl status nginx --no-pager 2>&1 | head -n 80 || true; } > "$MNT/services/nginx.txt"
          { apachectl -v 2>&1 || true; apachectl -S 2>&1 || true; systemctl status apache2 --no-pager 2>&1 | head -n 80 || true; echo "Port=${APACHE_PORT}"; } > "$MNT/services/apache.txt"
          { redis-cli ping 2>&1 || true; redis-cli info 2>/dev/null | head -n 120 || true; systemctl status redis-server --no-pager 2>&1 | head -n 80 || true; } > "$MNT/services/redis.txt"
          { psql --version 2>&1 || true; sudo -u postgres psql -c '\l' 2>&1 || true; sudo -u postgres psql -d vibe_db -c '\dt' 2>&1 || true; } > "$MNT/services/postgres.txt"
          { uname -a; df -h; lsblk; ip addr || true; } > "$MNT/system/host.txt"
          cp -f ${ARTIFACT_DIR}/vibe_db.dump "$MNT/artifacts/" 2>/dev/null || true
          cp -f ${LOG_DIR}/pg_test.txt "$MNT/artifacts/" 2>/dev/null || true
          echo "서비스/시스템 정보가 ${MNT} 에 적재되었습니다."

      # ★ lost+found 권한 문제 방지: tar로 스냅샷 생성 후 업로드
      - name: Archive storage snapshot (exclude lost+found)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          MNT="${STORAGE_MOUNT:-/mnt/vibe_store}"
          OUT="${RUNNER_TEMP}/vibe-storage-snapshot.tgz"
          tar --exclude='lost+found' --exclude='lost+found/**' -czf "$OUT" -C "$MNT" .
          echo "SNAP_TAR=$OUT" >> $GITHUB_ENV

      - name: Upload storage snapshot (tar)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vibe-storage-snapshot
          path: ${{ env.SNAP_TAR }}
          if-no-files-found: warn
          compression-level: 0
          overwrite: true

  finalize:
    name: "3) Bulk/Sec/Docs/Deps/Gather + Failure Report + Storage Pack"
    runs-on: ubuntu-24.04
    needs: [prep, services_db]
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Normalize workspace permissions (always)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo chown -R "$USER":"$USER" "$GITHUB_WORKSPACE" || true
          chmod -R u+rwX,go+rX "$GITHUB_WORKSPACE" || true
          mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}" "${GATHER_DIR}" || true
          chmod -R u+rwX,go+rX "${LOG_DIR}" "${ARTIFACT_DIR}" "${GATHER_DIR}" || true

      - name: Bulk modify
        shell: bash
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob globstar
          GLOBS="${BULK_GLOBS}"
          FILES=(); for g in ${GLOBS}; do for f in $g; do [ -f "$f" ] && FILES+=("$f"); done; done
          if [ ${#FILES[@]} -gt 0 ]; then
            for f in "${FILES[@]}"; do
              [ -n "${REPLACE_FROM}" ] && sed -i "s/${REPLACE_FROM//\//\\/}/${REPLACE_TO//\//\\/}/g" "$f" || echo '{"step":"bulk","level":"warn","msg":"replace fail"}' >> "${FAIL_LOG_FILE}"
              [ -n "${APPEND_LINE}" ] && printf '%s\n' "${APPEND_LINE}" >> "$f" || echo '{"step":"bulk","level":"warn","msg":"append fail"}' >> "${FAIL_LOG_FILE}"
              dir=$(dirname "$f"); base=$(basename "$f"); name="${base%.*}"; ext="${base##*.}"; dot="."
              [ "$base" = "$ext" ] && dot=""
              new="${dir}/${RENAME_PREFIX}${name}${RENAME_SUFFIX}${dot}${ext}"
              if [ -n "${RENAME_PREFIX}${RENAME_SUFFIX}" ]; then mv -f "$f" "$new" || echo '{"step":"bulk","level":"warn","msg":"rename fail"}' >> "${FAIL_LOG_FILE}"; f="$new"; fi
              if [ "${DUPLICATE_COPIES:-0}" -gt 0 ]; then i=1; while [ $i -le "${DUPLICATE_COPIES}" ]; do cp -f "$f" "${f%.*}_copy${i}${dot}${ext}" || echo '{"step":"bulk","level":"warn","msg":"duplicate fail"}' >> "${FAIL_LOG_FILE}"; i=$((i+1)); done; fi
            done
            find . -type f -not -path './.git/*' -exec chmod ${CHMOD_MODE} {} + || echo '{"step":"bulk","level":"warn","msg":"chmod files"}' >> "${FAIL_LOG_FILE}"
            find . -type d -not -path './.git/*' -exec chmod 755 {} + || echo '{"step":"bulk","level":"warn","msg":"chmod dirs"}' >> "${FAIL_LOG_FILE}"
          else
            echo '{"step":"bulk","level":"info","msg":"대상 파일 없음"}' >> "${FAIL_LOG_FILE}"
          fi
          git status --porcelain | tee ${LOG_DIR}/bulk_changes.txt || true

      - name: SBOM (Syft) — metadata injected
        shell: bash
        continue-on-error: true
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin || {
            echo '{"step":"sbom","level":"warn","msg":"syft install failed"}' >> "${FAIL_LOG_FILE}"
          }
          REPO="${GITHUB_REPOSITORY##*/}"
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$TAG" ]; then SHORT="$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"; DATE="$(date +%Y%m%d)"; VERSION="0.0.0-${SHORT}-${DATE}"; else VERSION="${TAG#v}"; fi
          syft dir:. -o cyclonedx-json > "${ARTIFACT_DIR}/sbom.raw.json" 2>> "${LOG_DIR}/syft.stderr.log" || echo '{"step":"sbom","level":"warn","msg":"syft run failed"}' >> "${FAIL_LOG_FILE}"
          if command -v jq >/dev/null 2>&1 && [ -s "${ARTIFACT_DIR}/sbom.raw.json" ]; then
            jq --arg name "$REPO" --arg ver "$VERSION" '
              .metadata |= (. // {}) |
              .metadata.component |= (. // {type:"application"}) |
              .metadata.component.name = $name |
              .metadata.component.version = $ver
            ' "${ARTIFACT_DIR}/sbom.raw.json" > "${ARTIFACT_DIR}/sbom.json" || cp -f "${ARTIFACT_DIR}/sbom.raw.json" "${ARTIFACT_DIR}/sbom.json"
            rm -f "${ARTIFACT_DIR}/sbom.raw.json"
          else
            cp -f "${ARTIFACT_DIR}/sbom.raw.json" "${ARTIFACT_DIR}/sbom.json" 2>/dev/null || true
          fi
          echo "SBOM generated at ${ARTIFACT_DIR}/sbom.json (soft errors tolerated)"

      - name: Vulnerability scan (Trivy + pip-audit) — cached & summarized
        shell: bash
        continue-on-error: true
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_TIMEOUT: "5m"
        run: |
          set +e
          mkdir -p "${TRIVY_CACHE_DIR}" "${ARTIFACT_DIR}" || true
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || echo '{"step":"security","level":"warn","msg":"trivy install"}' >> "${FAIL_LOG_FILE}"
          trivy fs --cache-dir "${TRIVY_CACHE_DIR}" --timeout "${TRIVY_TIMEOUT}" --no-progress --ignore-unfixed --scanners vuln,secret,misconfig -f json -o "${ARTIFACT_DIR}/trivy.json" . || echo '{"step":"security","level":"warn","msg":"trivy run"}' >> "${FAIL_LOG_FILE}"
          python3 -m pip -q install -U pip-audit || echo '{"step":"security","level":"warn","msg":"pip-audit install"}' >> "${FAIL_LOG_FILE}"
          pip-audit -f json -o "${ARTIFACT_DIR}/pip-audit.json" || echo '{"step":"security","level":"warn","msg":"pip-audit run"}' >> "${FAIL_LOG_FILE}"
          if command -v jq >/dev/null 2>/dev/null && [ -s "${ARTIFACT_DIR}/trivy.json" ]; then
            TOTAL=$(jq '[..|objects|select(has("Vulnerabilities"))|.Vulnerabilities[]]|length' "${ARTIFACT_DIR}/trivy.json" 2>/dev/null || echo 0)
            PKGS=$(jq '[..|objects|select(has("Vulnerabilities"))|.Target]|unique|length' "${ARTIFACT_DIR}/trivy.json" 2>/dev/null || echo 0)
            { echo '{"step":"security:trivy","level":"info","summary":'${TOTAL}'}'; } >> "${FAIL_LOG_FILE}"
            {
              echo ""
              echo "## Security Summary (Trivy)"
              echo "- Vulnerabilities: **${TOTAL}**"
              echo "- Targets scanned: **${PKGS}**"
            } >> "${FAIL_MD}"
          fi

      - name: Docs pack — safe & verbose
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p docs/adr docs/api "${ARTIFACT_DIR}" || true
          zip -qr "${ARTIFACT_DIR}/docs.zip" docs || echo '{"step":"docs","level":"warn","msg":"zip docs"}' >> "${FAIL_LOG_FILE}"
          [ -f "${ARTIFACT_DIR}/docs.zip" ] && du -h "${ARTIFACT_DIR}/docs.zip" | awk '{print "Docs zipped:",$1}' || true

      - name: Language deps upgrade
        shell: bash
        continue-on-error: true
        run: |
          set +e
          if [ "${DO_LANG_UPGRADE}" = "true" ]; then
            python3 -m pip -q install -U uv || echo '{"step":"deps","level":"warn","msg":"uv install"}' >> "${FAIL_LOG_FILE}"
            shopt -s globstar nullglob
            for req in **/requirements*.txt; do uv pip compile --upgrade "$req" -o "$req" || echo '{"step":"deps","level":"warn","msg":"uv compile"}' >> "${FAIL_LOG_FILE}"; uv pip sync "$req" || echo '{"step":"deps","level":"warn","msg":"uv sync"}' >> "${FAIL_LOG_FILE}"; done
            npm i -g npm-check-updates || echo '{"step":"deps","level":"warn","msg":"ncu install"}' >> "${FAIL_LOG_FILE}"
            for d in $(ls -d */ 2>/dev/null); do
              [ -f "$d/package.json" ] || continue
              ncu -u "$d/package.json" || echo '{"step":"deps","level":"warn","msg":"ncu update"}' >> "${FAIL_LOG_FILE}"
              npm --prefix "$d" install || echo '{"step":"deps","level":"warn","msg":"npm install"}' >> "${FAIL_LOG_FILE}"
              [ "$NPM_AUDIT_FIX" = "true" ] && npm --prefix "$d" audit fix || true
            done
            sudo apt-get update -y && sudo apt-get install -y maven default-jdk-headless || echo '{"step":"deps","level":"warn","msg":"maven install"}' >> "${FAIL_LOG_FILE}"
            for pom in **/pom.xml; do
              mvn -q -f "$pom" versions:use-latest-releases -DgenerateBackupPoms=false || echo '{"step":"deps","level":"warn","msg":"mvn versions"}' >> "${FAIL_LOG_FILE}"
              mvn -q -f "$pom" -DskipTests verify || echo '{"step":"deps","level":"warn","msg":"mvn verify"}' >> "${FAIL_LOG_FILE}"
            done
          else
            echo '{"step":"deps","level":"info","msg":"DO_LANG_UPGRADE=false (noop)"}' >> "${FAIL_LOG_FILE}"
          fi

      - name: Gather artifacts (workspace snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: vibe-artifacts
          path: |
            .github/echo_logs/**
            .github/artifacts/**
            ${{ needs.prep.outputs.dirs_root }}/**
            ${{ needs.prep.outputs.files_root }}/**
            app/**
            docs/**
            nodeapp/**
            demo/**
            README.md
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: true

      - name: Create late storage-pack (tar workspace artifacts)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p "${ARTIFACT_DIR}" || true
          tar -czf "${ARTIFACT_DIR}/storage-pack-final.tgz" \
            ".github/echo_logs" ".github/artifacts" "docs" "app" "nodeapp" "demo" "README.md" 2>/dev/null || true
          echo "Late storage pack created at ${ARTIFACT_DIR}/storage-pack-final.tgz"

      - name: Upload storage-pack-final
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vibe-storage-pack-final
          path: .github/artifacts/storage-pack-final.tgz
          if-no-files-found: warn
          compression-level: 0
          overwrite: true

      - name: Release/Publish (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs['10_do_release'] == 'true' || github.event.inputs['10_do_release'] == true) }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "릴리즈/퍼블리시는 별도 분리 권장 — 여기서는 성공 메시지만 남기고 통과"

      - name: Auto-commit (optional)
        if: ${{ needs.prep.outputs.auto_commit == 'true' || needs.prep.outputs.auto_commit == 'True' }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(vibe): bulk & artifacts [skip ci]" || true
          git push || true
          echo "Auto-commit attempted (soft errors tolerated)"

      - name: Build failure report (markdown)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$(dirname "${FAIL_MD}")" || true
          echo "# 🧾 Failure & Warning Report"            >  "${FAIL_MD}"
          echo ""                                         >> "${FAIL_MD}"
          echo "- Generated: $(date -Iseconds)"           >> "${FAIL_MD}"
          echo "- Workspace: ${GITHUB_WORKSPACE}"         >> "${FAIL_MD}"
          echo ""                                         >> "${FAIL_MD}"
          echo "## Summary"                               >> "${FAIL_MD}"
          FAILS=$(cat "${FAIL_COUNT_FILE}" 2>/dev/null || echo 0)
          echo "- Soft failure count: **${FAILS}**"       >> "${FAIL_MD}"
          echo ""                                         >> "${FAIL_MD}"
          echo "## Events (NDJSON excerpt)"               >> "${FAIL_MD}"
          if [ -s "${FAIL_LOG_FILE}" ]; then
            echo '```ndjson'                              >> "${FAIL_MD}"
            cat "${FAIL_LOG_FILE}"                        >> "${FAIL_MD}"
            echo '```'                                    >> "${FAIL_MD}"
          else
            echo "_No events recorded._"                  >> "${FAIL_MD}"

      - name: Upload failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-failure-report
          path: .github/artifacts/failure_report.md
          if-no-files-found: warn
          compression-level: 0
          overwrite: true

      - name: Fix artifact/log permissions (final pass)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sudo chown -R "$USER":"$USER" "${ARTIFACT_DIR}" "${LOG_DIR}" "${GATHER_DIR}" || true
          chmod -R u+rwX,go+rX "${ARTIFACT_DIR}" "${LOG_DIR}" "${GATHER_DIR}" || true

      - name: ✅ Always-success banner
        if: ${{ needs.prep.outputs.force_success == 'true' || needs.prep.outputs.force_success == 'True' }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          FAILS=$(cat "${FAIL_COUNT_FILE}" 2>/dev/null || echo 0)
          echo "## ✅ 전체 파이프라인 완료 (No-Skip / Continue / Storage)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 모드: ${{ needs.prep.outputs.mode }} / 프레임워크: ${{ needs.prep.outputs.framework }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 디렉토리/파일: ${{ needs.prep.outputs.dirs_root }} (x${{ needs.prep.outputs.dirs_count }}), ${{ needs.prep.outputs.files_root }} (x${{ needs.prep.outputs.files_count }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- 서버 설치 플래그: ${{ needs.prep.outputs.install_servers }} (false면 설치 noop 처리)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Soft failures: ${FAILS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 스토리지 스냅샷: vibe-storage-snapshot (tar 업로드, lost+found 제외)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 스토리지 최종팩: vibe-storage-pack-final (.github/artifacts/storage-pack-final.tgz)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 보고서: .github/artifacts/failure_report.md (vibe-failure-report 아티팩트)" >> "$GITHUB_STEP_SUMMARY"

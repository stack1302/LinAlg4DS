name: "🟢 AWS Test Server — EC2 Create + Safe-Continue + Logs/Artifacts"

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS Region (빈값이면 us-east-1)"
        required: false
        default: ""
      instance_type:
        description: "EC2 Instance Type"
        required: false
        default: "t3.micro"
      vpc_id:
        description: "기존 VPC 사용 (빈값이면 기본 VPC 탐색)"
        required: false
        default: ""
      subnet_id:
        description: "기존 Subnet 사용 (빈값이면 기본 Subnet 탐색)"
        required: false
        default: ""
      create_new_sg:
        description: "보안그룹 새로 생성할지 (true/false)"
        required: false
        default: "true"
      open_http:
        description: "0.0.0.0/0 으로 80포트 오픈 (테스트용)"
        required: false
        default: "true"
      keypair_name:
        description: "생성할 키페어 이름(빈값이면 자동 생성)"
        required: false
        default: ""
      teardown:
        description: "마지막에 리소스 삭제 (true/false)"
        required: false
        default: "false"

permissions:
  id-token: write     # OIDC용
  contents: read

concurrency:
  group: aws-test-server-${{ github.ref }}-${{ github.event.inputs.keypair_name || 'auto' }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  OUT_DIR: .github/echo_out
  AWS_REGION_INPUT: ${{ github.event.inputs.aws_region }}
  AWS_DEFAULT_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  INSTANCE_TYPE: ${{ github.event.inputs.instance_type || 't3.micro' }}
  VPC_ID_INPUT: ${{ github.event.inputs.vpc_id }}
  SUBNET_ID_INPUT: ${{ github.event.inputs.subnet_id }}
  CREATE_NEW_SG: ${{ github.event.inputs.create_new_sg || 'true' }}
  OPEN_HTTP: ${{ github.event.inputs.open_http || 'true' }}
  KEYP_NAME_INPUT: ${{ github.event.inputs.keypair_name }}
  TEARDOWN: ${{ github.event.inputs.teardown || 'false' }}
  TAG_PROJECT: gh-actions-test
  TAG_RUN_ID: ${{ github.run_id }}
  TAG_RUN_ATTEMPT: ${{ github.run_attempt }}
  TAG_REPO: ${{ github.repository }}
  TAG_ACTOR: ${{ github.actor }}
  # 사용되는 리소스 이름 접두사
  NAME_PREFIX: gha-test-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  aws-test-server:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare echo helpers + folders
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${OUT_DIR}"
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          TS(){ date +"%Y-%m-%d %H:%M:%S%z"; }
          ok(){ echo "✅ $(TS) $*"; }
          warn(){ echo "⚠️  $(TS) $*" >&2; }
          fail(){ echo "❌ $(TS) $*" >&2; }
          # 실패해도 다음으로 넘어가는 안전 실행 래퍼
          safe_run(){
            local name="$1"; shift || true
            ok "RUN [$name] → $*"
            if "$@"; then
              ok "OK [$name]"
            else
              warn "CONTINUE [$name] 실패했지만 계속 진행합니다"
              return 0
            fi
          }
          SH
          chmod +x /tmp/echo_helpers.sh
          echo "Helpers ready" | tee "${LOG_DIR}/00_helpers.log"

      - name: Decide credential mode (OIDC / Keys / Dry-Run)
        id: mode
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="dry"
          if [[ -n "${AWS_ROLE_TO_ASSUME:-}" ]]; then
            MODE="oidc"
          elif [[ -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            MODE="keys"
          fi
          echo "mode=$MODE" | tee "${OUT_DIR}/mode.txt"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          ok "Auth mode: $MODE"

      - name: Configure AWS creds via OIDC
        if: steps.mode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Configure AWS creds via Keys (not recommended)
        if: steps.mode.outputs.mode == 'keys'
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          safe_run "export-keys" bash -c '
            echo "Using static keys in env (discouraged). Region=${AWS_DEFAULT_REGION}"
          '

      - name: Install AWS CLI + jq
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          safe_run "apt-update" sudo apt-get update -y
          safe_run "install-cli" sudo apt-get install -y awscli jq

      - name: Resolve Region / Account (or Dry-Run)
        id: acct
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          REGION="${AWS_DEFAULT_REGION}"
          if [[ "$MODE" == "dry" ]]; then
            ok "Dry-Run 모드: 실제 AWS 호출 없이 진행 (명령만 기록)"
            echo "account_id=000000000000" >> "$GITHUB_OUTPUT"
            echo "region=$REGION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACC=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "UNKNOWN")
          echo "account_id=$ACC" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          ok "AWS Account: $ACC / Region: $REGION"

      - name: Find default VPC/Subnet (if not provided)
        id: net
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          VPC="${VPC_ID_INPUT}"
          SUBNET="${SUBNET_ID_INPUT}"

          if [[ "$MODE" == "dry" ]]; then
            echo "vpc_id=vpc-DRYRUN" >> "$GITHUB_OUTPUT"
            echo "subnet_id=subnet-DRYRUN" >> "$GITHUB_OUTPUT"
            ok "Dry-Run: 기본 VPC/SUBNET 가정"
            exit 0
          fi

          if [[ -z "$VPC" ]]; then
            VPC=$(aws ec2 describe-vpcs \
              --filters Name=isDefault,Values=true \
              --query "Vpcs[0].VpcId" --output text || true)
            [[ "$VPC" == "None" ]] && VPC=""
          fi

          if [[ -z "$SUBNET" ]]; then
            SUBNET=$(aws ec2 describe-subnets \
              --filters Name=default-for-az,Values=true \
              --query "Subnets[0].SubnetId" --output text || true)
            [[ "$SUBNET" == "None" ]] && SUBNET=""
          fi

          if [[ -z "$VPC" || -z "$SUBNET" ]]; then
            warn "기본 VPC/Subnet 탐색 실패 — 수동 지정 필요할 수 있음"
          fi
          echo "vpc_id=$VPC" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET" >> "$GITHUB_OUTPUT"
          ok "VPC: ${VPC:-N/A} / Subnet: ${SUBNET:-N/A}"

      - name: Create Security Group (optional)
        id: sg
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          if [[ "$MODE" == "dry" ]]; then
            echo "sg_id=sg-DRYRUN" >> "$GITHUB_OUTPUT"
            ok "Dry-Run: SG 가정"
            exit 0
          fi

          if [[ "${CREATE_NEW_SG,,}" == "true" ]]; then
            VPC_ID="${{ steps.net.outputs.vpc_id }}"
            SG_NAME="${NAME_PREFIX}-sg"
            SG_ID=$(aws ec2 create-security-group \
              --group-name "$SG_NAME" \
              --description "GH Actions Test SG" \
              --vpc-id "$VPC_ID" \
              --tag-specifications "ResourceType=security-group,Tags=[{Key=Project,Value=${TAG_PROJECT}},{Key=Repo,Value=${TAG_REPO}},{Key=RunID,Value=${TAG_RUN_ID}}]" \
              --query GroupId --output text 2>/dev/null || true)

            if [[ -n "$SG_ID" ]]; then
              ok "SG created: $SG_ID"
              if [[ "${OPEN_HTTP,,}" == "true" ]]; then
                safe_run "open-80" aws ec2 authorize-security-group-ingress \
                  --group-id "$SG_ID" --protocol tcp --port 80 --cidr 0.0.0.0/0
              fi
            else
              warn "SG 생성 실패 — 기본/기존 SG 사용을 시도"
            fi
            echo "sg_id=${SG_ID:-}" >> "$GITHUB_OUTPUT"
          else
            ok "새 SG 생성 스킵"
            echo "sg_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Key Pair (or reuse)
        id: key
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          NAME="${KEYP_NAME_INPUT:-${NAME_PREFIX}-kp}"

          if [[ "$MODE" == "dry" ]]; then
            echo "key_name=$NAME" >> "$GITHUB_OUTPUT"
            ok "Dry-Run: 키페어 ${NAME} 가정"
            exit 0
          fi

          # 이미 존재하면 통과
          EXISTS=$(aws ec2 describe-key-pairs --key-names "$NAME" --query "KeyPairs[0].KeyName" --output text 2>/dev/null || true)
          if [[ "$EXISTS" == "$NAME" ]]; then
            ok "키페어 재사용: $NAME"
            echo "key_name=$NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 생성
          PEM="${OUT_DIR}/${NAME}.pem"
          KP_JSON="${OUT_DIR}/${NAME}.json"
          if aws ec2 create-key-pair --key-name "$NAME" \
             --key-type rsa --key-format pem \
             --query "{KeyName:KeyName,Material:KeyMaterial}" --output json > "$KP_JSON" 2>/dev/null; then
            jq -r '.Material' "$KP_JSON" > "$PEM"
            chmod 600 "$PEM" || true
            ok "키페어 생성: $NAME (pem 저장)"
          else
            warn "키페어 생성 실패 — 인스턴스 접속은 SSM/UserData에 의존"
          fi
          echo "key_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve AMI (Amazon Linux 2023 via SSM param)
        id: ami
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          if [[ "$MODE" == "dry" ]]; then
            echo "ami_id=ami-DRYRUN" >> "$GITHUB_OUTPUT"
            ok "Dry-Run: AMI 가정"
            exit 0
          fi
          # AL2023 최신 AMI: SSM 파라미터를 통해 조회
          AMI=$(aws ssm get-parameters --names /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
                --query "Parameters[0].Value" --output text 2>/dev/null || true)
          if [[ -z "$AMI" || "$AMI" == "None" ]]; then
            warn "AL2023 AMI 조회 실패 — Ubuntu 22.04 LTS Public AMI 등으로 교체 필요"
          fi
          echo "ami_id=${AMI:-}" >> "$GITHUB_OUTPUT"
          ok "AMI: ${AMI:-N/A}"

      - name: Launch EC2 (UserData:Nginx + Docker)
        id: ec2
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          if [[ "$MODE" == "dry" ]]; then
            echo "instance_id=i-DRYRUN" >> "$GITHUB_OUTPUT"
            echo "public_ip=203.0.113.10" >> "$GITHUB_OUTPUT"
            ok "Dry-Run: EC2 가정 기동"
            exit 0
          fi

          AMI="${{ steps.ami.outputs.ami_id }}"
          if [[ -z "$AMI" ]]; then
            warn "AMI 없음 — 실행 시도는 실패할 수 있음(안전통과)"
          fi

          SG_ID="${{ steps.sg.outputs.sg_id }}"
          NET_ARGS=( --subnet-id "${{ steps.net.outputs.subnet_id }}" )
          [[ -n "$SG_ID" ]] && NET_ARGS+=( --security-group-ids "$SG_ID" )

          # UserData: Nginx & Docker 설치 + index 파일
          cat > "${OUT_DIR}/userdata.sh" <<'UD'
          #!/bin/bash
          set -Eeuo pipefail
          dnf -y update || true
          dnf -y install nginx docker || true
          systemctl enable --now docker || true
          systemctl enable --now nginx || true
          echo "<h1>GH Actions AWS Test Server</h1><p>$(date)</p>" > /usr/share/nginx/html/index.html
          # 간단한 헬스로그
          echo "ok $(date)" >> /var/log/gha_test_health.log
          UD

          NAME_TAG="${NAME_PREFIX}-ec2"
          OUT_JSON="${OUT_DIR}/run_instances.json"
          safe_run "run-instances" aws ec2 run-instances \
            --image-id "${AMI:-ami-0}" \
            --instance-type "${INSTANCE_TYPE}" \
            --key-name "${{ steps.key.outputs.key_name }}" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${NAME_TAG}},{Key=Project,Value=${TAG_PROJECT}},{Key=Repo,Value=${TAG_REPO}},{Key=RunID,Value=${TAG_RUN_ID}}]" \
            "${NET_ARGS[@]}" \
            --user-data "file://${OUT_DIR}/userdata.sh" \
            --output json > "$OUT_JSON" || true

          IID=$(jq -r '.Instances[0].InstanceId // empty' "$OUT_JSON" 2>/dev/null || echo "")
          if [[ -z "$IID" ]]; then
            warn "인스턴스 ID 파싱 실패 — 이후 단계는 안전통과"
          else
            ok "인스턴스 생성: $IID"
          fi

          echo "instance_id=$IID" >> "$GITHUB_OUTPUT"

          # 대기 & 공인 IP 조회
          if [[ -n "$IID" ]]; then
            safe_run "wait-running" aws ec2 wait instance-running --instance-ids "$IID"
            DESC="${OUT_DIR}/describe_instance.json"
            safe_run "desc-inst" aws ec2 describe-instances --instance-ids "$IID" --output json > "$DESC"
            PIP=$(jq -r '.Reservations[0].Instances[0].PublicIpAddress // empty' "$DESC" || echo "")
            echo "public_ip=$PIP" >> "$GITHUB_OUTPUT"
            ok "Public IP: ${PIP:-N/A}"
          else
            echo "public_ip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize
        if: always()
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          ACC="${{ steps.acct.outputs.account_id }}"
          REGION="${{ steps.acct.outputs.region }}"
          IID="${{ steps.ec2.outputs.instance_id }}"
          PIP="${{ steps.ec2.outputs.public_ip }}"
          SG="${{ steps.sg.outputs.sg_id }}"
          KP="${{ steps.key.outputs.key_name }}"

          {
            echo "## ✅ AWS Test Server Summary"
            echo ""
            echo "- **Auth Mode**: \`${MODE}\`"
            echo "- **Account**: \`${ACC}\`"
            echo "- **Region**: \`${REGION}\`"
            echo "- **Instance ID**: \`${IID:-N/A}\`"
            echo "- **Public IP**: \`${PIP:-N/A}\`"
            echo "- **Security Group**: \`${SG:-(existing or none)}\`"
            echo "- **Key Pair**: \`${KP}\`"
            echo "- **Teardown at end**: \`${TEARDOWN}\`"
            echo ""
            if [[ -n "$PIP" ]]; then
              echo "> 테스트: http://$PIP/"
            else
              echo "> 퍼블릭 IP가 없으면 Subnet/SG 또는 퍼블릭 IP 할당 설정을 점검하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          ok "Summary written"

      - name: Optional Teardown (delete resources)
        if: always() && env.TEARDOWN == 'true'
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ steps.mode.outputs.mode }}"
          if [[ "$MODE" == "dry" ]]; then
            ok "Dry-Run: 삭제 스킵(가정상 성공)"
            exit 0
          fi

          IID="${{ steps.ec2.outputs.instance_id }}"
          SG="${{ steps.sg.outputs.sg_id }}"
          KP="${{ steps.key.outputs.key_name }}"

          if [[ -n "$IID" ]]; then
            safe_run "terminate" aws ec2 terminate-instances --instance-ids "$IID"
            safe_run "wait-terminated" aws ec2 wait instance-terminated --instance-ids "$IID"
          fi

          # SG는 인스턴스 분리 후 제거
          if [[ -n "$SG" ]]; then
            safe_run "delete-sg" aws ec2 delete-security-group --group-id "$SG"
          fi

          # 키페어는 액세스 위험 최소화를 위해 삭제 권장 (원하면 주석 처리)
          if [[ -n "$KP" ]]; then
            safe_run "delete-kp" aws ec2 delete-key-pair --key-name "$KP"
          fi

          ok "Teardown attempted (safe-continue)"

      - name: Collect & Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-test-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/echo_logs/**
            .github/echo_out/**
          if-no-files-found: warn

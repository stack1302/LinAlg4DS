# .github/workflows/vibe-claude-test-server.yml
name: "🟢 Vibe + Claude Code + Test Server — No-Skip v3 (Runner Fallback + Cleanup Fix + Files/Perms)"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "무엇을 구현/수정할지"
        required: true
        default: "FastAPI healthcheck 추가 및 README 업데이트"
      allow_tools:
        description: "허용 도구(콤마)"
        required: false
        default: "Edit,Bash(git *),Search,Bash(python *),Bash(npm *)"
      mcp_enable:
        type: boolean
        default: false
      branch_name:
        required: false
        default: ""
      auto_commit:
        type: boolean
        default: true
      auto_pr:
        type: boolean
        default: true
      run_tests:
        type: boolean
        default: false
      output_format:
        required: false
        default: "stream-json"
      cleanup_days:
        required: false
        default: "7"
      test_port:
        required: false
        default: "8089"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: vibe-claude-test-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ARTIFACT_DIR: .github/echo_artifacts
  DOWNLOAD_DIR: .github/echo_downloads
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"

jobs:
  preflight:
    name: "Runner Preflight (24.04 + 22.04)"
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, ubuntu-22.04] }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Env echo
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: $(uname -a)"
          df -h || true
          node -v || true
          python3 --version || true

  vibe:
    name: "Vibe + Claude Code + Test Server (safe-continue)"
    needs: [preflight]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        if: always()
        uses: actions/checkout@v4

      - name: Echo helpers (Safe-Continue v3)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}" "${DOWNLOAD_DIR}" .claude
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeo pipefail
          TS(){ date "+%Y-%m-%d %H:%M:%S%z"; }
          OK(){   echo "${ECHO_OK} [$(TS)] $*"; }
          WARN(){ echo "${ECHO_WARN} [$(TS)] $*" >&2; }
          FAIL(){ echo "${ECHO_FAIL} [$(TS)] $*" >&2; }
          # 실패도 기록하고 항상 0 반환(진행 보장)
          safe_run(){
            local name="$1"; shift
            ( "$@" ) >>"${LOG_DIR}/${name}.log" 2>&1
            local ec=$?
            if [ $ec -eq 0 ]; then
              OK "$name: OK"
              echo "::notice title=${name}::OK"
              echo "- ${name}: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              FAIL "$name: FAILED (exit=${ec})"
              echo "::warning title=${name}::FAILED (exit=${ec}) — see ${LOG_DIR}/${name}.log"
              echo "- ${name}: FAILED (exit=${ec})" >> "$GITHUB_STEP_SUMMARY"
            fi
            return 0
          }
          SH
          chmod +x /tmp/echo_helpers.sh
          source /tmp/echo_helpers.sh
          OK "helpers ready"

      - name: 권한/디렉토리 준비 + 오래된 산출물 정리(컨텍스트 고정)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "perm.prepare" bash -lc '
            chmod -R a+rwX . || true
            git config --global user.name "vibe-bot"
            git config --global user.email "vibe-bot@users.noreply.github.com"
          '
          safe_run "cleanup.old" bash -lc '
            D=${{ github.event.inputs.cleanup_days }}
            find "${LOG_DIR}" -type f -mtime +${D} -print -delete 2>/dev/null || true
            find "${ARTIFACT_DIR}" -type f -mtime +${D} -print -delete 2>/dev/null || true
          '

      # [NEW] Claude Code 워크스페이스 부트스트랩 (필수 디렉토리/파일/권한)
      - name: Claude Workspace Bootstrap (dirs/files/perms)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh

          safe_run "dirs.create" bash -lc '
            mkdir -p \
              .claude \
              .claude/prompt_templates \
              .claude/sessions \
              .github/permissions \
              .github/hooks \
              .github/echo_logs \
              .github/echo_artifacts \
              .github/echo_downloads
          '

          # 기본 컨피그/프롬프트
          safe_run "claude.config.write" bash -lc '
            cat > .claude/config.json <<JSON
            {
              "projectName": "${{ github.repository }}",
              "defaultOutputFormat": "${{ github.event.inputs.output_format }}",
              "autosaveSessions": true,
              "telemetry": false
            }
            JSON
          '
          safe_run "prompt.template.write" bash -lc '
            cat > .claude/prompt_templates/vibe.md <<TXT
            # Vibe Coding — Project Guide
            - 목적: 작은 단위 변경, 테스트 통과, README/CHANGELOG 갱신
            - 제약: 대규모 무단 리팩토링 금지, 라이선스/컨벤션 준수
            - 산출물: 수정 파일 목록 + 실행 방법 + 다음 액션
            TXT
          '

          # 권한/허용 리스트
          safe_run "perms.allow.write" bash -lc '
            cat > .github/permissions/allowed_tools.json <<JSON
            {
              "allowedTools": [
                "Edit",
                "Search",
                "Bash(git *)",
                "Bash(python *)",
                "Bash(npm *)"
              ],
              "denyShellPatterns": [
                "rm -rf /",
                ":(){ :|:& };:",
                "mkfs*",
                "dd if=* of=/dev/*",
                "chmod 777 -R /",
                "chown -R * /*"
              ]
            }
            JSON
          '
          safe_run "perms.commands.write" bash -lc '
            cat > .github/permissions/allowed_commands.sh <<BASH
            #!/usr/bin/env bash
            # 단순 커맨드 가드 (위험 커맨드 탐지 시 2 반환)
            set -Eeuo pipefail
            BAD_PATTERNS=("rm -rf /" ":(){ :|:& };:" "mkfs" "dd if=" "chmod 777 -R /" "chown -R " "/dev/sd")
            INPUT="\$*"
            for p in "\${BAD_PATTERNS[@]}"; do
              if grep -qi -- "\$p" <<< "\$INPUT"; then
                echo "[GUARD] blocked: \$p"
                exit 2
              fi
            done
            exit 0
            BASH
            chmod +x .github/permissions/allowed_commands.sh
          '
          safe_run "perms.readme.write" bash -lc '
            cat > .github/permissions/README.md <<MD
            # Permissions Policy for Claude Code
            - 허용 도구는 \`allowed_tools.json\`의 \`allowedTools\`를 따름
            - 위험 커맨드는 \`denyShellPatterns\` / \`allowed_commands.sh\` 로 가드
            - 워크플로우 입력 \`allow_tools\`와의 교집합을 사용 권장
            MD
          '

          # 에디터/깃 속성
          safe_run "repo.dotfiles.write" bash -lc '
            cat > .editorconfig <<EC
            root = true
            [*]
            charset = utf-8
            end_of_line = lf
            indent_style = space
            indent_size = 2
            insert_final_newline = true
            trim_trailing_whitespace = true
            EC

            cat > .gitattributes <<GA
            * text=auto eol=lf
            GA

            # .gitignore는 append (존재하면 유지)
            {
              echo ".github/echo_logs/"
              echo ".github/echo_artifacts/"
              echo ".github/echo_downloads/"
              echo ".claude/sessions/"
              echo "node_modules/"
              echo ".venv/"
              echo "__pycache__/"
            } | tee -a .gitignore >/dev/null
          '

          # 실행 권한 일괄 정리
          safe_run "chmod.exec" bash -lc '
            chmod -R a+rX .github || true
            find .github -type f -name "*.sh" -exec chmod +x {} \; || true
          '

      - name: Node 설치
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code 설치 & 진단
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "claude.install" bash -lc 'npm install -g @anthropic-ai/claude-code'
          safe_run "claude.version" bash -lc 'claude --version'
          safe_run "claude.doctor"  bash -lc 'claude doctor || true'

      - name: (옵션) MCP 설정
        if: always() && ${{ github.event.inputs.mcp_enable == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "mcp.config" bash -lc '
            cat > .mcp.json <<JSON
            { "clients": { "default": { "transport": { "type":"stdio" } } },
              "servers": {
                "github":   {"command":"npx","args":["-y","@modelcontextprotocol/server-github"]},
                "puppeteer":{"command":"npx","args":["-y","@modelcontextprotocol/server-puppeteer"]}
              } }
            JSON
            cat .mcp.json
          '

      - name: 작업 브랜치 준비
        if: always()
        id: branch
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          BN="${{ github.event.inputs.branch_name }}"
          if [ -z "$BN" ]; then BN="vibe/auto-$(date +%Y%m%d-%H%M%S)"; fi
          echo "BRANCH_NAME=$BN" | tee -a $GITHUB_ENV
          safe_run "git.branch" bash -lc 'git checkout -b "$BRANCH_NAME"'

      # ---- 테스트 서버: 백그라운드 기동 + 헬스체크 (항상 진행, 실패해도 통과) ----
      - name: Test Server – 파일 준비
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          mkdir -p .github/test_server
          safe_run "test-srv.write" bash -lc '
            cat > .github/test_server/server.py <<PY
            import http.server, socketserver, os
            PORT = int(os.getenv("TEST_PORT","8089"))
            class Handler(http.server.SimpleHTTPRequestHandler):
                def do_GET(self):
                    if self.path in ("/","/healthz"):
                        self.send_response(200); self.end_headers()
                        self.wfile.write(b"OK: test-server alive")
                    else:
                        self.send_response(404); self.end_headers()
            with socketserver.TCPServer(("", PORT), Handler) as httpd:
                httpd.serve_forever()
            PY
          '

      - name: Test Server – 기동
        if: always()
        shell: bash
        env:
          TEST_PORT: ${{ github.event.inputs.test_port }}
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "test-srv.start" bash -lc '
            nohup python3 .github/test_server/server.py >"${LOG_DIR}/test-server.out" 2>&1 &
            echo $! > "${ARTIFACT_DIR}/test-server.pid"
            sleep 1
          '

      - name: Test Server – Healthcheck
        if: always()
        shell: bash
        env:
          TEST_PORT: ${{ github.event.inputs.test_port }}
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "test-srv.health" bash -lc '
            for i in {1..10}; do
              if curl -fsS "http://127.0.0.1:${TEST_PORT}/healthz" | grep -q "OK"; then exit 0; fi
              sleep 1
            done
            exit 2
          '

      - name: OIDC 컨텍스트 덤프(마스킹)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "oidc.context" bash -lc '
            {
              echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
              echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
            } | sed "s/${{ secrets.GITHUB_TOKEN }}/***masked***/g" | tee "${LOG_DIR}/oidc_context.txt"
          '

      - name: Claude Headless (Vibe 프롬프트)
        if: always()
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh

          # [NEW] 워크플로우 입력 allow_tools ↔ 리포 allowlist 교차 검사(로그용)
          safe_run "perms.cross-check" bash -lc '
            echo "INPUT allow_tools: ${{ github.event.inputs.allow_tools }}" | tee "${LOG_DIR}/allow_tools.input.txt"
            jq -r ".allowedTools[]" .github/permissions/allowed_tools.json 2>/dev/null \
              | tee "${LOG_DIR}/allow_tools.repo.txt" || true
          '

          PROMPT_FILE="${ARTIFACT_DIR}/prompt.txt"
          cat > "$PROMPT_FILE" <<'TXT'
          당신은 "바이브 코딩" 에이전트입니다.
          목표:
          1) 요청 작업을 구현(코드/설정/문서)
          2) 변경은 최소 단위로 분리
          3) 테스트/빌드 통과 확인(있을 때)
          4) 완료 후 .github/echo_logs/summary.md 에 OK/FAIL 포함 요약 저장
          제약: 대규모 무단 리팩토링 금지, 레포 컨벤션/라이선스 준수, 스크립트는 idempotent
          입력 Task:
          {{TASK}}
          TXT
          sed -i "s|{{TASK}}|${{ github.event.inputs.task }}|g" "$PROMPT_FILE"

          ALLOW="${{ github.event.inputs.allow_tools }}"
          OUT_FMT="${{ github.event.inputs.output_format }}"
          EXTRA=""
          if [ -f ".mcp.json" ]; then EXTRA="--mcp-debug"; fi

          # [NEW] 간이 커맨드 가드(허용되지 않은 위험 커맨드 탐지 시 경고만 남김, 중단 X)
          safe_run "guard.commands" bash -lc '.github/permissions/allowed_commands.sh "$ALLOW" || true'

          safe_run "claude.run" bash -lc '
            claude -p "$(cat "'"$PROMPT_FILE"'")" \
              --output-format "'"$OUT_FMT"'" \
              --allowedTools "'"$ALLOW"'" \
              '"$EXTRA"' | tee "'"$LOG_DIR"'/claude_output.jsonl"
          '

          {
            echo "# Claude Headless Output (tail)"
            tail -n 200 "$LOG_DIR/claude_output.jsonl" || true
          } > "$LOG_DIR/summary.md"

      - name: (옵션) 테스트 실행
        if: always() && ${{ github.event.inputs.run_tests == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "test.node" bash -lc '
            if [ -f package.json ]; then npm ci || npm i || true; npm test || true; fi
          '
          safe_run "test.py" bash -lc '
            if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
              python3 -m pip install -U pip || true
              pip install -r requirements.txt || true
              pytest -q || true
            fi
          '
          safe_run "test.maven" bash -lc '
            if compgen -G "**/pom.xml" > /dev/null; then
              mvn -B -q -DskipTests=false test || true
            fi
          '

      - name: 변경사항 커밋/푸시
        if: always() && ${{ github.event.inputs.auto_commit == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "git.add"    bash -lc 'git add -A || true'
          safe_run "git.commit" bash -lc '
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "vibe: apply changes via Claude Code headless" || true
          '
          safe_run "git.push"   bash -lc 'git push origin "$BRANCH_NAME" || true'

      - name: PR 생성
        if: always() && ${{ github.event.inputs.auto_pr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: "vibe: ${{ github.event.inputs.task }}"
          body: |
            자동 생성: Claude Code 헤드리스 바이브 코딩 결과
            - 허용 도구: `${{ github.event.inputs.allow_tools }}`
            - MCP: `${{ github.event.inputs.mcp_enable }}`
            - 테스트 서버/헬스체크: 적용
            - 파일/디렉토리/권한 정책 자동 부트스트랩 포함
          branch: ${{ env.BRANCH_NAME }}
          base: ${{ github.ref_name }}

      - name: 테스트 서버 종료(있으면)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          safe_run "test-srv.stop" bash -lc '
            if [ -f "${ARTIFACT_DIR}/test-server.pid" ]; then
              kill $(cat "${ARTIFACT_DIR}/test-server.pid") || true
            fi
          '

      - name: 아티팩트 업로드(로그/요약/컨텍스트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-logs
          path: |
            ${{ env.LOG_DIR }}/
            ${{ env.ARTIFACT_DIR }}/

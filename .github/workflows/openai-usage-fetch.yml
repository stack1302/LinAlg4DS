# .github/workflows/openai-usage-mega.yml
name: "📊 OpenAI Usage MEGA (≤10 inputs, Bulk Files/Queries/Perms/DB + Echo/Continue)"

on:
  workflow_dispatch:
    inputs:
      date_mode:
        type: choice
        description: "기간 모드"
        options: ["manual", "random"]
        required: true
        default: "manual"
      date_span:
        description: "기간 스펙 (manual/random 형식)"
        required: false
        default: ""
      interval:
        description: "집계 간격 (1m|1h|1d)"
        required: false
        default: "1d"
      query_cfg:
        description: "쿼리 구성 문자열"
        required: false
        default: "categories=completions,images,audio,embeddings,moderations,vector_stores,code_interpreter_sessions"
      bulk_cfg:
        description: "대량 생성 구성 (디렉토리/파일)"
        required: false
        default: "dirs_root=.github/echo_dirs,dirs_count=200;files_root=.github/echo_files,files_count=500,files_ext=.txt"
      download_manifest:
        description: "다운로드 URL 목록 (줄바꿈 구분)"
        required: false
        default: ""
      parallel:
        description: "동시 다운로드(aria2) 연결 수"
        required: false
        default: "8"
      demo_mode:
        type: boolean
        description: "API 키 없어도 샘플 Usage JSON 생성"
        required: false
        default: true
      db_cfg:
        description: "DB 대량 생성 구성 (SQLite)"
        required: false
        default: "db_root=.github/echo_dbs,db_count=3,tables_per_db=2,rows_per_table=20"
      perm_cfg:
        description: "권한/인증 파일 대량 생성 구성"
        required: false
        default: "perm_root=.github/echo_perms,users=10,chmod=640,acl_manifest=true,htpasswd=true"

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  OUT_DIR: .github/usage_out
  DL_DIR: .github/echo_downloads
  GEN_DIR: .github/echo_gen
  DB_DIR: .github/echo_dbs
  PERM_DIR: .github/echo_perms
  SQL_DIR: .github/echo_sql
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"
  USAGE_BASE: "https://api.openai.com/v1/organization/usage"

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prep echo helpers (continue-safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${OUT_DIR}" "${DL_DIR}" "${GEN_DIR}" "${DB_DIR}" "${PERM_DIR}" "${SQL_DIR}"
          ERR_LOG="${LOG_DIR}/errors-$(date +%Y%m%d%H%M%S).log"
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${LOG_DIR:=.github/echo_logs}"
          : "${OUT_DIR:=.github/usage_out}"
          : "${DL_DIR:=.github/echo_downloads}"
          : "${GEN_DIR:=.github/echo_gen}"
          : "${DB_DIR:=.github/echo_dbs}"
          : "${PERM_DIR:=.github/echo_perms}"
          : "${SQL_DIR:=.github/echo_sql}"
          : "${ECHO_OK:=OK}" ; : "${ECHO_WARN:=WARN}" ; : "${ECHO_FAIL:=FAIL}"
          ERR_LOG="${LOG_DIR}/errors-current.log"
          echoe(){ printf '%s %s\n' "${ECHO_OK}" "$*"; }
          warn(){  printf '%s %s\n' "${ECHO_WARN}" "$*"; }
          fail(){  printf '%s %s\n' "${ECHO_FAIL}" "$*"; }
          run(){   printf '▶ %s\n' "$*"; eval "$@"; }
          try_run(){
            printf '▶ %s\n' "$*"
            set +e; eval "$@"; rc=$?; set -e
            if [ $rc -ne 0 ]; then
              fail "rc=${rc} :: $*"
              { printf '[%s] rc=%s %s\n' "$(date +%F' '%T)" "$rc" "$*"; } >> "${ERR_LOG}"
            else
              echoe "ok"
            fi
            return 0
          }
          export -f echoe warn fail run try_run
          printf '' > "${ERR_LOG}"
          SH
          chmod +x /tmp/echo_helpers.sh
          ln -sf "$(basename "$ERR_LOG")" "${LOG_DIR}/errors-current.log" || true
          source /tmp/echo_helpers.sh
          echoe "Helpers ready: ${LOG_DIR}/errors-current.log"

      - name: Sanity + Tools (continue-safe)
        continue-on-error: true
        shell: bash
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          source /tmp/echo_helpers.sh
          if [ "${HAS_KEY}" != "true" ]; then
            fail "OPENAI_API_KEY secret 미설정 (데모 모드로 샘플 생성 가능)"
          else
            echoe "OPENAI_API_KEY 확인"
          fi
          [ -n "${{ secrets.OPENAI_ORG_ID }}" ] && echoe "OPENAI_ORG_ID 감지" || warn "OPENAI_ORG_ID 미설정"
          try_run sudo apt-get update -y
          try_run sudo apt-get install -y jq aria2 coreutils sqlite3 apache2-utils

      - name: Resolve time window (manual/random → KST & UTC)
        id: when
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ github.event.inputs.date_mode }}"
          SPAN="${{ github.event.inputs.date_span }}"
          INTERVAL="${{ github.event.inputs.interval }}"
          to_iso_kst(){ date -d "$1" +'%Y-%m-%d %H:%M:%S'; }
          if [ "$MODE" = "manual" ]; then
            if printf '%s' "$SPAN" | grep -q '\.\.'; then
              START_KST_RAW="$(printf '%s' "$SPAN" | awk -F'\\.\\.' '{print $1}')"
              END_KST_RAW="$(printf '%s' "$SPAN" | awk -F'\\.\\.' '{print $2}')"
              if [ -n "$START_KST_RAW" ] && [ -n "$END_KST_RAW" ]; then
                START_KST="$(to_iso_kst "$START_KST_RAW")"
                END_KST="$(to_iso_kst "$END_KST_RAW")"
              else
                warn "manual 형식 불완전 → 기본기간 사용"
              fi
            fi
            if [ -z "${START_KST:-}" ] || [ -z "${END_KST:-}" ]; then
              warn "manual 미지정 → 어제 00:00:00..오늘 23:59:59 (KST)"
              START_KST="$(date -d 'yesterday 00:00:00' +'%Y-%m-%d %H:%M:%S')"
              END_KST="$(date -d 'today 23:59:59' +'%Y-%m-%d %H:%M:%S')"
            fi
          else
            DAYS_MIN=1; DAYS_MAX=7; WITHIN=365
            if printf '%s' "$SPAN" | grep -q 'days='; then
              DAYS_RANGE="$(printf '%s' "$SPAN" | tr ',' '\n' | awk -F= '$1=="days"{print $2}')"
              if printf '%s' "$DAYS_RANGE" | grep -q '\.\.'; then
                DAYS_MIN="$(printf '%s' "$DAYS_RANGE" | awk -F'\\.\\.' '{print $1}')"
                DAYS_MAX="$(printf '%s' "$DAYS_RANGE" | awk -F'\\.\\.' '{print $2}')"
              fi
            fi
            if printf '%s' "$SPAN" | grep -q 'within='; then
              WITHIN="$(printf '%s' "$SPAN" | tr ',' '\n' | awk -F= '$1=="within"{print $2}')"
            fi
            rand(){ shuf -i "$1"-"$2" -n 1; }
            LEN=$(rand "${DAYS_MIN:-1}" "${DAYS_MAX:-7}")
            OFF=$(rand 0 "${WITHIN:-365}")
            END_KST="$(date -d "$OFF days ago 23:59:59" +'%Y-%m-%d %H:%M:%S')"
            START_KST="$(date -d "$OFF days ago -$((LEN-1)) days 00:00:00" +'%Y-%m-%d %H:%M:%S')"
            echoe "Random window: len=${LEN}d within=${WITHIN}d offset=${OFF}d"
          fi
          START_UTC="$(TZ=UTC date -d "$START_KST +0900" +'%Y-%m-%dT%H:%M:%SZ')"
          END_UTC="$(TZ=UTC date -d "$END_KST +0900" +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "start_kst=$START_KST"
            echo "end_kst=$END_KST"
            echo "start_utc=$START_UTC"
            echo "end_utc=$END_UTC"
          } >> "$GITHUB_OUTPUT"
          echoe "KST ${START_KST} ~ ${END_KST} → UTC ${START_UTC} ~ ${END_UTC} (interval=${INTERVAL})"

      - name: Parse query_cfg (categories/filters/extra)
        id: q
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          CFG="${{ github.event.inputs.query_cfg }}"
          parse_val(){ printf '%s' "$CFG" | tr ';' '\n' | awk -F= -v k="$1" '$1==k{ $1=""; sub(/^=/,""); print; }'; }
          CATEGORIES="$(parse_val categories || true)"
          MODELS="$(parse_val models || true)"
          PROJECTS="$(parse_val projects || true)"
          USERS="$(parse_val users || true)"
          EXTRA="$(parse_val extra || true)"
          : "${CATEGORIES:=completions,images,audio,embeddings,moderations,vector_stores,code_interpreter_sessions}"
          {
            echo "categories=$CATEGORIES"
            echo "models=$MODELS"
            echo "projects=$PROJECTS"
            echo "users=$USERS"
            echo "extra=$EXTRA"
          } >> "$GITHUB_OUTPUT"
          echoe "Categories: $CATEGORIES"
          [ -n "$MODELS" ] && echoe "Models: $MODELS" || warn "Models: (all)"
          [ -n "$PROJECTS" ] && echoe "Projects: $PROJECTS" || warn "Projects: (all)"
          [ -n "$USERS" ] && echoe "Users: $USERS" || warn "Users: (all)"
          [ -n "$EXTRA" ] && echoe "Extra: $EXTRA" || true

      - name: Bulk generate (dirs + files, continue-safe)
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          CFG="${{ github.event.inputs.bulk_cfg }}"
          get(){ printf '%s' "$CFG" | tr ';' '\n' | awk -F= -v k="$1" '$1==k{ $1=""; sub(/^=/,""); print; }'; }
          DROOT="$(get dirs_root || true)"; : "${DROOT:=.github/echo_dirs}"
          DCOUNT="$(get dirs_count || true)"; : "${DCOUNT:=200}"
          FROOT="$(get files_root || true)"; : "${FROOT:=.github/echo_files}"
          FCOUNT="$(get files_count || true)"; : "${FCOUNT:=500}"
          FEXT="$(get files_ext || true)"; : "${FEXT:=.txt}"
          echoe "DIRS: root=${DROOT}, count=${DCOUNT}"
          try_run mkdir -p "$DROOT"
          for i in $(seq -w 1 "$DCOUNT"); do try_run mkdir -p "${DROOT}/dir_${i}"; echo "${DROOT}/dir_${i}" >> "${GEN_DIR}/dirs.list"; done
          echoe "FILES: root=${FROOT}, count=${FCOUNT}, ext=${FEXT}"
          try_run mkdir -p "$FROOT"
          for i in $(seq -w 1 "$FCOUNT"); do f="${FROOT}/file_${i}${FEXT}"; printf 'idx=%s time=%s\n' "$i" "$(date -Iseconds)" > "$f" || true; echo "$f" >> "${GEN_DIR}/files.list"; done

      - name: Bulk download (aria2, continue-safe)
        continue-on-error: true
        shell: bash
        env:
          PAR: ${{ github.event.inputs.parallel }}
        run: |
          source /tmp/echo_helpers.sh
          MAN="${{ github.event.inputs.download_manifest }}"
          if [ -z "$MAN" ]; then warn "download_manifest 비어있음 → 스킵"; exit 0; fi
          LIST="${DL_DIR}/urls.txt"
          printf '%s\n' "$MAN" | sed '/^\s*$/d' > "$LIST"
          echoe "다운로드 URL 수: $(wc -l < "$LIST") (병렬:${PAR:-8})"
          try_run aria2c -x4 -s4 -j "${PAR:-8}" -i "$LIST" -d "$DL_DIR"

      - name: Fetch OpenAI usage (continue-safe + backoff)
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
          INTERVAL: ${{ github.event.inputs.interval }}
        run: |
          source /tmp/echo_helpers.sh
          START_UTC="${{ steps.when.outputs.start_utc }}"
          END_UTC="${{ steps.when.outputs.end_utc }}"
          CATEGORIES="${{ steps.q.outputs.categories }}"
          MODELS="${{ steps.q.outputs.models }}"
          PROJECTS="${{ steps.q.outputs.projects }}"
          USERS="${{ steps.q.outputs.users }}"
          EXTRA="${{ steps.q.outputs.extra }}"
          mkdir -p "${OUT_DIR}"
          IFS=',' read -ra CATS <<< "$CATEGORIES"
          : > "${OUT_DIR}/_index.jsonl"
          QS=( --data-urlencode "start_time=${START_UTC}" --data-urlencode "end_time=${END_UTC}" --data-urlencode "interval=${INTERVAL}" )
          [ -n "$MODELS" ]   && QS+=( --data-urlencode "models=${MODELS}" )
          [ -n "$PROJECTS" ] && QS+=( --data-urlencode "project_ids=${PROJECTS}" )
          [ -n "$USERS" ]    && QS+=( --data-urlencode "user_ids=${USERS}" )
          EXTRA_QS=(); if [ -n "$EXTRA" ]; then IFS='&' read -ra KV <<< "$EXTRA"; for x in "${KV[@]}"; do EXTRA_QS+=( --data-urlencode "$x" ); done; fi
          for cat in "${CATS[@]}"; do
            cat_trim="$(echo "$cat" | xargs)"; [ -z "$cat_trim" ] && continue
            url="${USAGE_BASE}/${cat_trim}"
            out_json="${OUT_DIR}/${cat_trim}.json"
            ok=0; for attempt in 1 2 3; do
              set +e
              if [ -n "${OPENAI_ORG_ID:-}" ]; then HDR_ORG=(-H "OpenAI-Organization: ${OPENAI_ORG_ID}"); else HDR_ORG=(); fi
              HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$out_json.tmp" -G "$url" -H "Authorization: Bearer ${OPENAI_API_KEY:-dummy}" "${HDR_ORG[@]}" "${QS[@]}" "${EXTRA_QS[@]}")
              rc=$?; set -e
              if [ $rc -eq 0 ] && [ "${HTTP_CODE:-000}" -lt 400 ]; then mv "$out_json.tmp" "$out_json"; ok=1; break; fi
              warn "cat=${cat_trim} 실패(rc=$rc http=${HTTP_CODE:-000}) 재시도(${attempt}/3)"; sleep $((attempt*2))
            done
            if [ $ok -eq 1 ]; then
              if jq -e . >/dev/null 2>&1 < "$out_json"; then echoe "JSON OK: ${out_json}"; printf '%s\t%s\n' "$cat_trim" "$out_json" >> "${OUT_DIR}/_index.jsonl"; else
                warn "JSON 파싱 실패: ${out_json} → .raw 보존"; mv "$out_json" "${out_json}.raw" || true; printf '%s\t%s\n' "$cat_trim" "${out_json}.raw" >> "${OUT_DIR}/_index.jsonl"; fi
            else
              fail "fetch 최종 실패(cat=${cat_trim})"; mv "$out_json.tmp" "$out_json.err" 2>/dev/null || true; printf '%s\t%s\n' "$cat_trim" "$out_json.err" >> "${OUT_DIR}/_index.jsonl"
            fi
          done

      - name: DEMO fallback (no key or all failed → synthesize)
        if: ${{ inputs.demo_mode }}
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          ok_cnt=$(awk '{print $2}' "${OUT_DIR}/_index.jsonl" | grep -E '\.json$' | wc -l || true)
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ] && [ "$ok_cnt" -gt 0 ]; then echoe "실제 데이터가 존재 → 데모 스킵"; exit 0; fi
          warn "DEMO MODE: 샘플 Usage JSON 생성"
          DAY=$(date -u +%Y-%m-%dT00:00:00Z)
          gen_one(){ catg="$1"; out="${OUT_DIR}/${catg}.json"; jq -n --arg t "$DAY" '{
            "data":[
              {"timestamp":$t,"model":"o4-mini","n_requests":12,"input_tokens":3400,"output_tokens":2100,"cost_usd":0.85},
              {"timestamp":$t,"model":"gpt-4o","n_requests":5,"input_tokens":900,"output_tokens":700,"cost_usd":0.42}
            ] }' > "$out"; printf '%s\t%s\n' "$catg" "$out" >> "${OUT_DIR}/_index.jsonl"; }
          for c in completions images audio embeddings moderations; do gen_one "$c"; done
          echoe "샘플 파일 생성 완료"

      - name: Build CSV summary (best-effort, continue-safe)
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          CSV="${OUT_DIR}/usage_summary.csv"
          echo "category,timestamp,model,requests,input_tokens,output_tokens,total_tokens,cost_usd" > "$CSV" || true
          while IFS=$'\t' read -r cat fpath; do
            [ -z "$cat" ] && continue
            [ ! -s "$fpath" ] && { warn "빈 파일: $fpath"; continue; }
            set +e
            jq -r --arg C "$cat" '
              (.data // [])[] |
              [
                $C,
                (.timestamp // .time // .bucket_start // ""),
                (.model // ""),
                (.n_requests // .requests // ""),
                (.input_tokens // .prompt_tokens // ""),
                (.output_tokens // .completion_tokens // ""),
                (if .total_tokens then .total_tokens else ((.input_tokens // .prompt_tokens // 0) + (.output_tokens // .completion_tokens // 0)) end),
                (.cost_usd // .cost // "")
              ] | @csv
            ' "$fpath" >> "$CSV"
            rc=$?; set -e; [ $rc -ne 0 ] && fail "CSV 변환 실패: $fpath" || true
          done < "${OUT_DIR}/_index.jsonl"
          echoe "CSV summary ready → ${CSV}"
          ls -al "${OUT_DIR}" || true

      # =========================
      # 🔥 DB & SQL 대량 생성 섹션
      # =========================
      - name: Parse DB config
        id: dbq
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          CFG="${{ github.event.inputs.db_cfg }}"
          get(){ printf '%s' "$CFG" | tr ',' '\n' | awk -F= -v k="$1" '$1==k{ $1=""; sub(/^=/,""); print; }'; }
          DB_ROOT="$(get db_root || true)"; : "${DB_ROOT:=.github/echo_dbs}"
          DB_COUNT="$(get db_count || true)"; : "${DB_COUNT:=3}"
          TBL_PER_DB="$(get tables_per_db || true)"; : "${TBL_PER_DB:=2}"
          ROWS_PER_TBL="$(get rows_per_table || true)"; : "${ROWS_PER_TBL:=20}"
          echo "db_root=$DB_ROOT" >> "$GITHUB_OUTPUT"
          echo "db_count=$DB_COUNT" >> "$GITHUB_OUTPUT"
          echo "tables_per_db=$TBL_PER_DB" >> "$GITHUB_OUTPUT"
          echo "rows_per_table=$ROWS_PER_TBL" >> "$GITHUB_OUTPUT"
          echoe "DB CFG → root=$DB_ROOT, dbs=$DB_COUNT, tables=$TBL_PER_DB, rows=$ROWS_PER_TBL"

      - name: Bulk create SQLite DBs with seed data (continue-safe)
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          mkdir -p "${DB_DIR}"
          DB_ROOT="${{ steps.dbq.outputs.db_root }}"
          [ -n "$DB_ROOT" ] || DB_ROOT="${DB_DIR}"
          DB_COUNT="${{ steps.dbq.outputs.db_count }}"
          TBL="${{ steps.dbq.outputs.tables_per_db }}"
          ROWS="${{ steps.dbq.outputs.rows_per_table }}"
          try_run mkdir -p "$DB_ROOT"
          for d in $(seq -w 1 "${DB_COUNT:-3}"); do
            DBP="${DB_ROOT}/demo_${d}.sqlite"
            echoe "Create DB: $DBP"
            for t in $(seq -w 1 "${TBL:-2}"); do
              TBLN="tbl_${t}"
              try_run sqlite3 "$DBP" "CREATE TABLE IF NOT EXISTS ${TBLN}(id INTEGER PRIMARY KEY, name TEXT, created_at TEXT);"
              for r in $(seq 1 "${ROWS:-20}"); do
                NAME="name_${t}_${r}"; NOW="$(date -Iseconds)"
                try_run sqlite3 "$DBP" "INSERT INTO ${TBLN}(name, created_at) VALUES('${NAME}', '${NOW}');"
              done
            done
            try_run sqlite3 "$DBP" "CREATE VIEW IF NOT EXISTS v_counts AS SELECT name, COUNT(*) AS cnt FROM tbl_01 GROUP BY name;"
            echo "$DBP" >> "${GEN_DIR}/dbs.list"
          done
          echoe "DBs created: $(wc -l < "${GEN_DIR}/dbs.list" 2>/dev/null || echo 0)"

      - name: Generate massive SQL queries (continue-safe)
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          mkdir -p "${SQL_DIR}"
          DB_ROOT="${{ steps.dbq.outputs.db_root }}"; [ -n "$DB_ROOT" ] || DB_ROOT="${DB_DIR}"
          TBL="${{ steps.dbq.outputs.tables_per_db }}"; : "${TBL:=2}"
          idx=0
          while read -r DBP; do
            [ -f "$DBP" ] || continue
            base="$(basename "$DBP" .sqlite)"
            for t in $(seq -w 1 "$TBL"); do
              TBLN="tbl_${t}"
              q1="${SQL_DIR}/${base}_${TBLN}_select.sql"
              q2="${SQL_DIR}/${base}_${TBLN}_count.sql"
              q3="${SQL_DIR}/${base}_${TBLN}_recent.sql"
              printf 'SELECT * FROM %s LIMIT 50;\n' "$TBLN" > "$q1"
              printf 'SELECT COUNT(*) AS cnt FROM %s;\n' "$TBLN" > "$q2"
              printf "SELECT * FROM %s WHERE created_at >= datetime('now','-1 day');\n" "$TBLN" > "$q3"
              echo "$q1" >> "${GEN_DIR}/sql.list"; echo "$q2" >> "${GEN_DIR}/sql.list"; echo "$q3" >> "${GEN_DIR}/sql.list"
              idx=$((idx+3))
            done
          done < "${GEN_DIR}/dbs.list"
          echoe "Generated SQL files: $idx"

      - name: (Optional) Execute sample SQL against DBs (continue-safe)
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          OUT="${SQL_DIR}/query_results.txt"
          : > "$OUT"
          while read -r DBP; do
            [ -f "$DBP" ] || continue
            printf '\n-- %s --\n' "$DBP" >> "$OUT"
            Q="$(ls "${SQL_DIR}/$(basename "$DBP" .sqlite)"*_select.sql 2>/dev/null | head -n1)"
            [ -n "$Q" ] && try_run bash -lc "sqlite3 -header -csv '$DBP' < '$Q' >> '$OUT'"
          done < "${GEN_DIR}/dbs.list"
          echoe "Sample SQL execution done → $OUT"

      # =========================
      # 🔐 권한/인증 파일 대량 생성 섹션
      # =========================
      - name: Parse permission config
        id: pcfg
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          CFG="${{ github.event.inputs.perm_cfg }}"
          get(){ printf '%s' "$CFG" | tr ',' '\n' | awk -F= -v k="$1" '$1==k{ $1=""; sub(/^=/,""); print; }'; }
          PROOT="$(get perm_root || true)"; : "${PROOT:=.github/echo_perms}"
          USERS="$(get users || true)"; : "${USERS:=10}"
          CHMOD_MODE="$(get chmod || true)"; : "${CHMOD_MODE:=640}"
          ACL_MANIFEST="$(get acl_manifest || true)"; : "${ACL_MANIFEST:=true}"
          HTPASSWD_ON="$(get htpasswd || true)"; : "${HTPASSWD_ON:=true}"
          {
            echo "perm_root=$PROOT"
            echo "users=$USERS"
            echo "chmod_mode=$CHMOD_MODE"
            echo "acl_manifest=$ACL_MANIFEST"
            echo "htpasswd=$HTPASSWD_ON"
          } >> "$GITHUB_OUTPUT"
          echoe "PERM CFG → root=$PROOT, users=$USERS, chmod=$CHMOD_MODE, acl_manifest=$ACL_MANIFEST, htpasswd=$HTPASSWD_ON"

      - name: Bulk permission & auth files (continue-safe)
        continue-on-error: true
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          PROOT="${{ steps.pcfg.outputs.perm_root }}"; : "${PROOT:=.github/echo_perms}"
          USERS="${{ steps.pcfg.outputs.users }}"; : "${USERS:=10}"
          MODE="${{ steps.pcfg.outputs.chmod_mode }}"; : "${MODE:=640}"
          ACL_ON="${{ steps.pcfg.outputs.acl_manifest }}"; : "${ACL_ON:=true}"
          HTP_ON="${{ steps.pcfg.outputs.htpasswd }}"; : "${HTP_ON:=true}"

          try_run mkdir -p "$PROOT/users" "$PROOT/policies" "$PROOT/acls"

          for i in $(seq -w 1 "$USERS"); do
            u="user_${i}"
            echo "username=${u}" > "$PROOT/users/${u}.conf"
            head -c 16 /dev/urandom | base64 > "$PROOT/users/${u}.token" || echo "token_${u}" > "$PROOT/users/${u}.token"

            # ✅ heredoc 대신 jq 로 안전하게 JSON 생성
            TS="$(date -Iseconds)"
            jq -n --arg user "$u" --arg ts "$TS" \
              '{user:$user, roles:["reader"], scopes:["usage.read"], created_at:$ts}' \
              > "$PROOT/policies/${u}.json"

            try_run chmod "${MODE}" "$PROOT/users/${u}.conf" "$PROOT/users/${u}.token" "$PROOT/policies/${u}.json"
          done

          if [ "$ACL_ON" = "true" ]; then
            MAN="$PROOT/acls/acl_manifest.json"
            echoe "Create ACL manifest: $MAN"
            {
              echo '{ "version": 1, "items": ['
              first=1
              for i in $(seq -w 1 "$USERS"); do
                u="user_${i}"
                [ $first -eq 1 ] || echo ','
                printf '  { "user":"%s", "resources":["usage","downloads","db"], "permissions":["read"] }' "$u"
                first=0
              done
              echo ']}'
            } > "$MAN"
            try_run chmod "${MODE}" "$MAN"
          fi

          if [ "$HTP_ON" = "true" ]; then
            HTP="$PROOT/.htpasswd"
            echoe "Create htpasswd: $HTP"
            first=1
            for i in $(seq -w 1 "$USERS"); do
              u="user_${i}"
              p="$(head -c 8 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 10)"
              if [ $first -eq 1 ]; then
                try_run htpasswd -b -c "$HTP" "$u" "$p"
                first=0
              else
                try_run htpasswd -b "$HTP" "$u" "$p"
              fi
              echo "${u}:${p}" >> "$PROOT/users/credentials.list"
            done
            try_run chmod "${MODE}" "$HTP" "$PROOT/users/credentials.list"
          fi

          echoe "Permission/auth files ready under $PROOT"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-usage-mega-${{ github.run_id }}
          path: |
            .github/usage_out/**
            .github/echo_logs/**
            .github/echo_downloads/**
            .github/echo_gen/**
            .github/echo_dbs/**
            .github/echo_perms/**
            .github/echo_sql/**
          if-no-files-found: warn
          retention-days: 7

      - name: Job summary (always)
        if: always()
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          echo "## OpenAI Usage MEGA Summary (Bulk + Perms + DB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 모드: ${{ github.event.inputs.date_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- 기간 (KST): ${{ steps.when.outputs.start_kst }} ~ ${{ steps.when.outputs.end_kst }}" >> $GITHUB_STEP_SUMMARY
          echo "- 기간 (UTC): ${{ steps.when.outputs.start_utc }} ~ ${{ steps.when.outputs.end_utc }}" >> $GITHUB_STEP_SUMMARY
          echo "- 간격: ${{ github.event.inputs.interval }}" >> $GITHUB_STEP_SUMMARY
          echo "- 카테고리: ${{ steps.q.outputs.categories }}" >> $GITHUB_STEP_SUMMARY
          echo "- DB root: ${{ steps.dbq.outputs.db_root }} | DBs: ${{ steps.dbq.outputs.db_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Perm root: ${{ steps.pcfg.outputs.perm_root }} | Users: ${{ steps.pcfg.outputs.users }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s "${OUT_DIR}/usage_summary.csv" ]; then
            echo "### Usage CSV (Top 20 rows)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -n 21 "${OUT_DIR}/usage_summary.csv" | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          else
            echo "Usage CSV 생성 실패 또는 데이터 없음" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "${SQL_DIR}/query_results.txt" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Sample SQL Execution (head)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -n 30 "${SQL_DIR}/query_results.txt" | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -s "${LOG_DIR}/errors-current.log" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 오류 로그 (최근 실행 200줄)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            sed 's/^/    /' "${LOG_DIR}/errors-current.log" | head -n 200 >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_전체 로그/원본은 Artifacts 참고_" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "오류 없음 🎉" >> $GITHUB_STEP_SUMMARY
          fi

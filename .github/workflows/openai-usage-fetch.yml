# .github/workflows/openai-usage-fetch.yml
name: "📊 OpenAI Usage Fetcher + CSV (Echo/Robust + Continue)"

on:
  workflow_dispatch:
    inputs:
      start_kst:
        description: "조회 시작 (KST) 예: 2025-10-13 00:00:00"
        required: false
        default: ""
      end_kst:
        description: "조회 종료 (KST) 예: 2025-10-14 23:59:59"
        required: false
        default: ""
      interval:
        description: "집계 간격 (1m|1h|1d)"
        required: false
        default: "1d"
      categories_csv:
        description: "카테고리 CSV (예: completions,images,audio,embeddings,moderations)"
        required: false
        default: "completions,images,audio,embeddings,moderations"
      models_csv:
        description: "특정 모델만(콤마구분, 비우면 전체)"
        required: false
        default: ""
      project_ids_csv:
        description: "특정 프로젝트만(콤마구분, 비우면 전체)"
        required: false
        default: ""
      user_ids_csv:
        description: "특정 사용자만(콤마구분, 비우면 전체)"
        required: false
        default: ""
      extra_query:
        description: "추가 쿼리 파라미터 (key=value&key2=value2)"
        required: false
        default: ""

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  OUT_DIR: .github/usage_out
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"
  USAGE_BASE: "https://api.openai.com/v1/organization/usage"

jobs:
  fetch-usage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prep echo helpers (with continue-safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${OUT_DIR}"
          ERR_LOG="${LOG_DIR}/errors-$(date +%Y%m%d%H%M%S).log"
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${LOG_DIR:=.github/echo_logs}"
          : "${OUT_DIR:=.github/usage_out}"
          : "${ECHO_OK:=OK}" ; : "${ECHO_WARN:=WARN}" ; : "${ECHO_FAIL:=FAIL}"
          ERR_LOG="${LOG_DIR}/errors-current.log"

          echoe(){ printf '%s %s\n' "${ECHO_OK}" "$*"; }
          warn(){  printf '%s %s\n' "${ECHO_WARN}" "$*"; }
          fail(){  printf '%s %s\n' "${ECHO_FAIL}" "$*"; }
          run(){   printf '▶ %s\n' "$*"; eval "$@"; }

          # try_run: 실패해도 종료하지 않고 에러 로그에 누적
          try_run(){
            printf '▶ %s\n' "$*"
            set +e
            eval "$@"
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              fail "rc=${rc} :: $*"
              { printf '[%s] rc=%s %s\n' "$(date +%F' '%T)" "$rc" "$*"; } >> "${ERR_LOG}"
            else
              echoe "ok"
            fi
            return 0
          }

          # try_curl: HTTP 코드와 rc 동시 체크(실패해도 계속)
          try_curl(){
            url="$1"; shift
            printf '▶ curl %s\n' "$url"
            set +e
            HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$@" "$url")
            rc=$?
            set -e
            if [ $rc -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
              fail "curl rc=${rc} http=${HTTP_CODE} url=${url}"
              { printf '[%s] curl rc=%s http=%s %s\n' "$(date +%F' '%T)" "$rc" "$HTTP_CODE" "$url"; } >> "${ERR_LOG}"
            else
              echoe "curl ok (http=${HTTP_CODE})"
            fi
            return 0
          }

          export -f echoe warn fail run try_run try_curl
          printf '' > "${ERR_LOG}"
          SH
          chmod +x /tmp/echo_helpers.sh
          # 현재 실행에서 사용할 에러 파일명을 고정 링크로 유지
          ln -sf "$(basename "$ERR_LOG")" "${LOG_DIR}/errors-current.log" || true
          source /tmp/echo_helpers.sh
          echoe "Helpers ready: errors → ${LOG_DIR}/errors-current.log"

      - name: Sanity check secrets (continue-safe)
        shell: bash
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          source /tmp/echo_helpers.sh
          if [ "${HAS_KEY}" != "true" ]; then
            fail "OPENAI_API_KEY secret이 필요합니다. (계속 진행은 하지만 API 호출은 실패할 수 있음)"
            # 계속 진행
          else
            echoe "OPENAI_API_KEY 확인"
          fi
          if [ -n "${{ secrets.OPENAI_ORG_ID }}" ]; then
            echoe "OPENAI_ORG_ID 감지됨(선택값)"
          else
            warn "OPENAI_ORG_ID 미설정"
          fi

      - name: Install jq (continue-safe)
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          try_run sudo apt-get update -y
          try_run sudo apt-get install -y jq

      - name: Resolve time window (KST -> UTC ISO8601)
        id: when
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          set -Eeuo pipefail
          START_KST="${{ github.event.inputs.start_kst }}"
          END_KST="${{ github.event.inputs.end_kst }}"
          if [ -z "$START_KST" ] || [ -z "$END_KST" ]; then
            warn "입력 시간 미지정 → 기본: 어제 00:00:00 ~ 오늘 23:59:59 (KST)"
            START_KST="$(date -d 'yesterday 00:00:00' +'%Y-%m-%d %H:%M:%S')"
            END_KST="$(date -d 'today 23:59:59' +'%Y-%m-%d %H:%M:%S')"
          fi
          echo "start_kst=$START_KST" >> $GITHUB_OUTPUT
          echo "end_kst=$END_KST" >> $GITHUB_OUTPUT
          START_UTC="$(TZ=UTC date -d "$START_KST +0900" +'%Y-%m-%dT%H:%M:%SZ')"
          END_UTC="$(TZ=UTC date -d "$END_KST +0900" +'%Y-%m-%dT%H:%M:%SZ')"
          echo "start_utc=$START_UTC" >> $GITHUB_OUTPUT
          echo "end_utc=$END_UTC" >> $GITHUB_OUTPUT
          echoe "KST ${START_KST} ~ ${END_KST} → UTC ${START_UTC} ~ ${END_UTC}"

      - name: Fetch usage (multi-category, continue-safe)
        id: fetch
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
          INTERVAL: ${{ github.event.inputs.interval }}
          CATEGORIES_CSV: ${{ github.event.inputs.categories_csv }}
          MODELS_CSV: ${{ github.event.inputs.models_csv }}
          PROJECTS_CSV: ${{ github.event.inputs.project_ids_csv }}
          USERS_CSV: ${{ github.event.inputs.user_ids_csv }}
          EXTRA_QUERY: ${{ github.event.inputs.extra_query }}
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          mkdir -p "${OUT_DIR}"
          START_UTC="${{ steps.when.outputs.start_utc }}"
          END_UTC="${{ steps.when.outputs.end_utc }}"
          : "${CATEGORIES_CSV:=completions,images,audio,embeddings,moderations}"

          # 공통 QS(표시는 하되, 개별 --data-urlencode로 넘김)
          QS="start_time=${START_UTC}&end_time=${END_UTC}&interval=${INTERVAL}"
          [ -n "$MODELS_CSV" ]   && QS="${QS}&models=${MODELS_CSV}"
          [ -n "$PROJECTS_CSV" ] && QS="${QS}&project_ids=${PROJECTS_CSV}"
          [ -n "$USERS_CSV" ]    && QS="${QS}&user_ids=${USERS_CSV}"
          [ -n "$EXTRA_QUERY" ]  && QS="${QS}&${EXTRA_QUERY}"
          echoe "QueryString: $QS"

          IFS=',' read -ra CATS <<< "$CATEGORIES_CSV"
          : > "${OUT_DIR}/_index.jsonl"
          for cat in "${CATS[@]}"; do
            cat_trim="$(echo "$cat" | xargs)"
            [ -z "$cat_trim" ] && continue
            url="${USAGE_BASE}/${cat_trim}"
            out_json="${OUT_DIR}/${cat_trim}.json"

            # curl은 실패해도 다음 카테고리로 넘어감
            set +e
            if [ -n "${OPENAI_ORG_ID:-}" ]; then
              HDR_ORG=(-H "OpenAI-Organization: ${OPENAI_ORG_ID}")
            else
              HDR_ORG=()
            fi
            HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$out_json.tmp" -G "$url" \
              -H "Authorization: Bearer ${OPENAI_API_KEY:-dummy}" \
              "${HDR_ORG[@]}" \
              --data-urlencode "start_time=${START_UTC}" \
              --data-urlencode "end_time=${END_UTC}" \
              --data-urlencode "interval=${INTERVAL}" \
              --data-urlencode "models=${MODELS_CSV}" \
              --data-urlencode "project_ids=${PROJECTS_CSV}" \
              --data-urlencode "user_ids=${USERS_CSV}")
            rc=$?
            set -e

            if [ $rc -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
              fail "fetch 실패(cat=${cat_trim}) rc=$rc http=$HTTP_CODE"
              mv "$out_json.tmp" "$out_json.err" 2>/dev/null || true
              printf '%s\t%s\n' "$cat_trim" "$out_json.err" >> "${OUT_DIR}/_index.jsonl"
              continue
            fi
            mv "$out_json.tmp" "$out_json"

            # JSON 검증(실패해도 계속)
            if jq -e . >/dev/null 2>&1 < "$out_json"; then
              echoe "JSON OK: ${out_json}"
              printf '%s\t%s\n' "$cat_trim" "$out_json" >> "${OUT_DIR}/_index.jsonl"
            else
              warn "JSON 파싱 실패: ${out_json} → .raw로 보존"
              mv "$out_json" "${out_json}.raw" || true
              printf '%s\t%s\n' "$cat_trim" "${out_json}.raw" >> "${OUT_DIR}/_index.jsonl"
            fi
          done

      - name: Build CSV summary (best-effort, continue-safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          CSV="${OUT_DIR}/usage_summary.csv"
          echo "category,timestamp,model,requests,input_tokens,output_tokens,total_tokens,cost_usd" > "$CSV" || true

          while IFS=$'\t' read -r cat fpath; do
            [ -z "$cat" ] && continue
            [ ! -s "$fpath" ] && { warn "빈 파일: $fpath"; continue; }
            # 변환 실패해도 다음 행/파일로 계속
            set +e
            jq -r --arg C "$cat" '
              (.data // [])[] |
              [
                $C,
                (.timestamp // .time // .bucket_start // ""),
                (.model // ""),
                (.n_requests // .requests // ""),
                (.input_tokens // .prompt_tokens // ""),
                (.output_tokens // .completion_tokens // ""),
                (
                  if (.total_tokens) then .total_tokens
                  else ((.input_tokens // .prompt_tokens // 0) + (.output_tokens // .completion_tokens // 0))
                  end
                ),
                (.cost_usd // .cost // "")
              ] | @csv
            ' "$fpath" >> "$CSV"
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              fail "CSV 변환 실패: $fpath"
            fi
          done < "${OUT_DIR}/_index.jsonl"

          ls -al "${OUT_DIR}" || true
          echoe "CSV summary (best-effort) → ${CSV}"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-usage-${{ github.run_id }}
          path: |
            .github/usage_out/**
            .github/echo_logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Job summary (always, with error dump)
        if: always()
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          echo "## OpenAI Usage Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 기간 (KST): ${{ steps.when.outputs.start_kst }} ~ ${{ steps.when.outputs.end_kst }}" >> $GITHUB_STEP_SUMMARY
          echo "- 기간 (UTC): ${{ steps.when.outputs.start_utc }} ~ ${{ steps.when.outputs.end_utc }}" >> $GITHUB_STEP_SUMMARY
          echo "- 간격: ${{ github.event.inputs.interval }}" >> $GITHUB_STEP_SUMMARY
          echo "- 카테고리: ${{ github.event.inputs.categories_csv }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s "${OUT_DIR}/usage_summary.csv" ]; then
            echo "### CSV 샘플(상위 20행)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -n 21 "${OUT_DIR}/usage_summary.csv" | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          else
            echo "CSV 생성 실패 또는 데이터 없음" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -s "${LOG_DIR}/errors-current.log" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 오류 로그 (최근 실행)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            sed 's/^/    /' "${LOG_DIR}/errors-current.log" | head -n 200 >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_전체 오류 전문은 Artifacts의 logs 참조_" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "오류 없음 🎉" >> $GITHUB_STEP_SUMMARY
          fi

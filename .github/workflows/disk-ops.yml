# .github/workflows/disk-ops.yml
name: "💽 Disk Ops — Linux / Windows / macOS — No-Skip (≤10 inputs)"

on:
  workflow_dispatch:
    inputs:
      runner:        # 1
        description: "OS (ubuntu-24.04 | windows-latest | macos-latest | all)"
        type: choice
        options: [ubuntu-24.04, windows-latest, macos-latest, all]
        default: all
      mode:          # 2
        description: "동작 (linux_loop | linux_device | windows_vhdx | macos_dmg)"
        type: choice
        options: [linux_loop, linux_device, windows_vhdx, macos_dmg]
        default: linux_loop
      size_gb:       # 3
        description: "디스크/이미지 용량(GB)"
        default: "10"
      mount_path:    # 4
        description: "마운트 경로(Linux/macOS); Windows는 무시"
        default: "/mnt/data"
      device:        # 5
        description: "(linux_device 전용) 블록 디바이스 (예: /dev/sdb)"
        default: ""
      drive_letter:  # 6
        description: "(Windows 전용) 드라이브 문자 (예: V)"
        default: "V"
      fs:            # 7
        description: "파일시스템 (linux: ext4/xfs, win: NTFS, mac: APFS/JHFS+)"
        default: "ext4"
      label:         # 8
        description: "볼륨 라벨"
        default: "DATA"
      fstab:         # 9
        description: "(Linux 전용) /etc/fstab 자동등록"
        type: boolean
        default: true
      iso_cfg:       # 10
        description: 'ISO 생성 설정(비우면 생성 안함) 예: name=MYISO,src=/mnt/data (Linux/macOS 지원)'
        default: ""

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ART_DIR: .github/echo_artifacts
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"

# --- Linux Job ---
jobs:
  linux:
    if: ${{ inputs.runner == 'ubuntu-24.04' || inputs.runner == 'all' }}
    name: "Linux — ${ { inputs.mode } }"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Prep dirs
        shell: bash
        run: mkdir -p "${LOG_DIR}" "${ART_DIR}"

      - name: Helpers
        shell: bash
        run: |
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Euo pipefail
          TS(){ date "+%Y-%m-%d %H:%M:%S%z"; }
          ok(){ echo "${ECHO_OK} [$(TS)] $*"; }
          warn(){ echo "${ECHO_WARN} [$(TS)] $*" >&2; }
          run_sh_req(){ # <name> <retries> "<cmd>"
            local n="$1" r="$2" c="$3" a=0 s=1
            echo "▶ ${n} :: ${c} (retries=${r})"
            while true; do s=0; bash -lc "${c}" >>"${LOG_DIR}/linux.log" 2>&1 || s=$?
              if [ $s -eq 0 ]; then ok "${n} OK"; return 0; fi
              a=$((a+1)); if [ $a -le $r ]; then warn "${n} FAIL(${s}) retry ${a}/${r}"; sleep 2; else warn "${n} FAIL(${s}) continue"; return 0; fi
            done
          }
          run_chain(){ # <name> "<A || B || true>"
            local n="$1" ch="$2"; echo "▶ ${n} (chain)"
            bash -lc "${ch}" >>"${LOG_DIR}/linux.log" 2>&1 || true; ok "${n} OK"
          }
          kv(){ local k="$1" s="$2"; IFS=',' read -ra P <<< "$s"; for p in "${P[@]}"; do p="${p#"${p%%[![:space:]]*}"}"; p="${p%"${p##*[![:space:]]}"}"; [[ "$p" == "$k="* ]] && echo "${p#*=}" && return 0; done; return 1; }
          SH
          chmod +x /tmp/echo_helpers.sh
          echo "helpers ready"

      - name: Disk Ops (Linux)
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          MODE="${{ inputs.mode }}"
          IMG="/var/disk.img"; SIZE="${{ inputs.size_gb }}G"
          MP="${{ inputs.mount_path }}"; FS="${{ inputs.fs }}"
          LABEL="${{ inputs.label }}"; FSTAB="${{ inputs.fstab }}"
          DEV="${{ inputs.device }}"

          # 공통 패키지 + ISO 도구(있으면 설치)
          run_sh_req "apt.update" 2 "sudo apt-get update -y"
          run_sh_req "apt.install.core" 2 "sudo apt-get install -y parted util-linux xfsprogs udev"
          run_chain  "apt.install.iso"  "sudo apt-get install -y xorriso || sudo apt-get install -y genisoimage || sudo apt-get install -y cdrtools || true"

          if [ "$MODE" = "linux_loop" ]; then
            run_chain "img.create" "sudo fallocate -l '${SIZE}' '${IMG}' || sudo dd if=/dev/zero of='${IMG}' bs=1M count=$(( ${{ inputs.size_gb }} * 1024 )) || true"
            run_sh_req "loop.attach" 2 "sudo losetup -fP '${IMG}'"
            LOOP=$(losetup -a | awk -F: '/disk.img/ {print $1}' | head -n1)
            [ -n "${LOOP:-}" ] || LOOP="/dev/loop0"
            TGT="${LOOP}"
            PART="${LOOP}p1"
          else
            TGT="${DEV}"
            PART="${DEV}1"
          fi

          # 파티션/포맷/마운트
          run_sh_req "gpt.label" 1 "sudo parted -s '${TGT}' mklabel gpt"
          run_sh_req "gpt.part"  1 "sudo parted -s '${TGT}' mkpart primary ${FS} 0% 100%"
          run_chain  "part.probe" "sudo partprobe '${TGT}' || sudo udevadm settle || true"
          if [ "${FS}" = "xfs" ]; then
            run_sh_req "mkfs.xfs" 1 "sudo mkfs.xfs -f -L '${LABEL}' '${PART}'"
          else
            run_sh_req "mkfs.ext4" 2 "sudo mkfs.ext4 -F -L '${LABEL}' '${PART}'"
          fi
          run_sh_req "mkdir.mountpoint" 1 "sudo mkdir -p '${MP}'"
          run_sh_req "mount" 2 "sudo mount '${PART}' '${MP}'"

          # fstab (UUID 우선, 실패시 LABEL)
          UUID=""; for i in {1..5}; do UUID=$(blkid -s UUID -o value "${PART}" 2>/dev/null || true); [ -n "$UUID" ] && break || sleep 1; done
          if [ "${FSTAB}" = "true" ]; then
            LINE=$([ -n "$UUID" ] && echo "UUID=${UUID}   ${MP}   ${FS}   defaults,nofail   0 2" || echo "LABEL=${LABEL}  ${MP}   ${FS}   defaults,nofail   0 2")
            echo "${LINE}" | sudo tee -a /etc/fstab >/dev/null || true
          fi
          echo "mounted ${MP} (${PART})"

          # 권한 이양(소유자/ACL/퍼미션)
          USERN="$(id -un)"; GROUPN="$(id -gn)"
          run_chain "fix.perms" "sudo chown -R '${USERN}:${GROUPN}' '${MP}' || (command -v setfacl >/dev/null && sudo setfacl -R -m u:${USERN}:rwx -m g:${GROUPN}:rwx '${MP}') || sudo chmod -R a+rwx '${MP}' || true"

          # 대량 생성(일반 → sudo 대체)
          run_sh_req  "mass.dirs" 1 "cd '${MP}' && mkdir -p {logs,data,backups,tmp,scripts,configs,reports,bins,jobs} && for i in \$(seq 1 50); do mkdir -p data/shard_\$i; done && for i in \$(seq 1 20); do mkdir -p logs/day_\$i; done"
          run_sh_req  "mass.dirs.sudo" 0 "sudo bash -lc \"cd '${MP}' && mkdir -p {logs,data,backups,tmp,scripts,configs,reports,bins,jobs} && for i in \$(seq 1 50); do mkdir -p data/shard_\$i; done && for i in \$(seq 1 20); do mkdir -p logs/day_\$i; done && chown -R '${USERN}:${GROUPN}' .\""
          run_sh_req  "mass.files" 1 "cd '${MP}' && mkdir -p reports backups scripts configs && for i in \$(seq 1 200); do echo \"file-\$i,\$(date -Iseconds)\" >> reports/index.csv; done && truncate -s 64K backups/seed.bin && printf '#!/usr/bin/env bash\nset -Eeuo pipefail\necho ok\n' > scripts/healthcheck.sh && chmod +x scripts/healthcheck.sh && echo 'KEY=VALUE' > configs/app.env"
          run_sh_req  "checksums" 1 "cd '${MP}' && find . -type f -maxdepth 2 -print0 | xargs -0 sha256sum > reports/SHA256SUMS.txt || true"

          # ISO (요청 시)
          if [ -n "${{ inputs.iso_cfg }}" ]; then
            NAME=$(kv name "${{ inputs.iso_cfg }}" || echo "DISK_IMG")
            SRC=$(kv src  "${{ inputs.iso_cfg }}" || echo "${MP}")
            ISO="${{ github.workspace }}/${NAME}.iso"
            run_chain "iso.create" "xorriso -as mkisofs -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || genisoimage -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || mkisofs -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || true"
            [ -f "${ISO}" ] && mv "${ISO}" "${ART_DIR}/" || true
          fi

          run_sh_req "health.mount" 0 "[ -d '${MP}' ] && mountpoint -q '${MP}'"
          run_sh_req "health.write" 0 "echo ok > '${MP}/.ok' && sync || sudo bash -lc \"echo ok > '${MP}/.ok' && sync\""

      - name: Upload artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            .github/echo_logs/linux.log
            .github/echo_artifacts/*.iso
          if-no-files-found: warn

  # --- Windows Job ---
  windows:
    if: ${{ inputs.runner == 'windows-latest' || inputs.runner == 'all' }}
    name: "Windows — VHDX"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Disk Ops (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $VRoot = Join-Path $env:GITHUB_WORKSPACE "vdisks"
          New-Item -ItemType Directory -Force -Path $VRoot | Out-Null
          $Size = [int]${{ inputs.size_gb }} * 1GB
          $Vhdx = Join-Path $VRoot "data.vhdx"
          $DL = "${{ inputs.drive_letter }}"
          $Label = "${{ inputs.label }}"

          Write-Host "▶ Create VHDX $Vhdx ($(${{ inputs.size_gb }}) GB)"
          try { New-VHD -Path $Vhdx -SizeBytes $Size -Dynamic -ErrorAction Continue } catch { $_ | Out-String | Write-Warning }

          Write-Host "▶ Mount VHDX"
          $disk = $null
          try { $disk = Mount-VHD -Path $Vhdx -PassThru | Get-Disk } catch { $_ | Out-String | Write-Warning }
          if ($disk) {
            try { Initialize-Disk -Number $disk.Number -PartitionStyle GPT -ErrorAction Continue } catch { $_ | Out-String | Write-Warning }
            try { New-Partition -DiskNumber $disk.Number -UseMaximumSize -DriveLetter $DL -ErrorAction Continue | Out-Null } catch { $_ | Out-String | Write-Warning }
            try { Format-Volume -DriveLetter $DL -FileSystem NTFS -NewFileSystemLabel $Label -Confirm:$false -ErrorAction Continue | Out-Null } catch { $_ | Out-String | Write-Warning }

            foreach ($d in @("logs","data","backups","scripts","configs","reports")) { New-Item -ItemType Directory -Force -Path "$($DL):\$d" | Out-Null }
            "KEY=VALUE" | Out-File -Encoding utf8 -FilePath "$($DL):\configs\app.env"
            "file,ts"   | Out-File -Encoding utf8 -FilePath "$($DL):\reports\index.csv"
          } else {
            Write-Warning "VHDX mount failed — continue"
          }

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: vdisks
          if-no-files-found: warn

  # --- macOS Job ---
  macos:
    if: ${{ inputs.runner == 'macos-latest' || inputs.runner == 'all' }}
    name: "macOS — DMG"
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Disk Ops (macOS)
        shell: bash
        run: |
          set -Eeuo pipefail
          TZ=Asia/Seoul
          LOG="${LOG_DIR}/mac.log"; mkdir -p "${LOG_DIR}" "${ART_DIR}"
          DMG="${GITHUB_WORKSPACE}/vdata.dmg"
          SIZE="${{ inputs.size_gb }}"
          FS="${{ inputs.fs }}"; [ "${FS}" = "APFS" ] || [ "${FS}" = "JHFS+" ] || FS="APFS"
          LABEL="${{ inputs.label }}"
          MP="${{ inputs.mount_path }}"

          echo "▶ create DMG" | tee -a "${LOG}"
          hdiutil create -size "${SIZE}g" -fs "${FS}" -volname "${LABEL}" "${DMG}" >>"${LOG}" 2>&1 || true
          echo "▶ attach DMG" | tee -a "${LOG}"
          hdiutil attach "${DMG}" >>"${LOG}" 2>&1 || true
          MOUNT="/Volumes/${LABEL}"
          if [ -d "${MOUNT}" ]; then
            mkdir -p "${MOUNT}/"{logs,data,backups,scripts,configs,reports} >>"${LOG}" 2>&1 || true
            echo "KEY=VALUE" > "${MOUNT}/configs/app.env"
            echo "file,ts" > "${MOUNT}/reports/index.csv"
          fi

          # ISO (요청 시)
          if [ -n "${{ inputs.iso_cfg }}" ]; then
            NAME="$(echo "${{ inputs.iso_cfg }}" | awk -F'name=' '{print $2}' | awk -F',' '{print $1}')" ; [ -n "${NAME}" ] || NAME="DISK_IMG"
            SRC="$(echo  "${{ inputs.iso_cfg }}" | awk -F'src='  '{print $2}' | awk -F',' '{print $1}')" ; [ -n "${SRC}" ] || SRC="${MOUNT}"
            ISO="${GITHUB_WORKSPACE}/${NAME}.iso"
            echo "▶ makehybrid ISO" | tee -a "${LOG}"
            hdiutil makehybrid -o "${ISO}" "${SRC}" -iso -joliet -default-volume-name "${NAME}" >>"${LOG}" 2>&1 || true
            [ -f "${ISO}" ] && mv "${ISO}" "${ART_DIR}/" || true
          fi

      - name: Upload artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            .github/echo_logs/mac.log
            .github/echo_artifacts/*.iso
          if-no-files-found: warn

name: "💽 Disk Ops — Disk + ISO + Mass Setup — No-Skip (≤10 inputs)"

on:
  workflow_dispatch:
    inputs:
      runner:        # 1
        description: "OS (ubuntu-24.04 | windows-latest | macos-latest)"
        type: choice
        options: [ubuntu-24.04, windows-latest, macos-latest]
        default: ubuntu-24.04
      mode:          # 2
        description: "동작 (linux_loop | linux_device | windows_vhdx | macos_dmg)"
        type: choice
        options: [linux_loop, linux_device, windows_vhdx, macos_dmg]
        default: linux_loop
      size_gb:       # 3
        description: "디스크/이미지 용량(GB)"
        default: "10"
      mount_path:    # 4
        description: "마운트 경로(Linux/macOS); Windows는 무시"
        default: "/mnt/data"
      device:        # 5
        description: "(linux_device 전용) 블록 디바이스 (예: /dev/sdb)"
        default: ""
      drive_letter:  # 6
        description: "(Windows 전용) 드라이브 문자 (예: V)"
        default: "V"
      fs:            # 7
        description: "파일시스템 (linux: ext4/xfs, win: NTFS, mac: APFS/JHFS+)"
        default: "ext4"
      label:         # 8
        description: "볼륨 라벨"
        default: "DATA"
      fstab:         # 9
        description: "(Linux 전용) /etc/fstab 자동등록"
        type: boolean
        default: true
      iso_cfg:       # 10
        description: 'ISO 생성 설정 (비우면 생성 안함). 예: name=MYISO,src=/mnt/data'
        default: ""

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ART_DIR: .github/echo_artifacts
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"

jobs:
  disk-ops:
    name: "Disk + ISO Ops (${{ inputs.mode }}) — No-Skip"
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prep dirs
        shell: bash
        run: |
          mkdir -p "${LOG_DIR}" "${ART_DIR}"

      - name: Echo helpers (fixed status capture)
        shell: bash
        run: |
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Euo pipefail
          TS(){ date "+%Y-%m-%d %H:%M:%S%z"; }
          ok(){ echo "${ECHO_OK} [$(TS)] $*"; }
          warn(){ echo "${ECHO_WARN} [$(TS)] $*" >&2; }

          # 문자열 단일 커맨드를 실행하고 종료코드 수집(실패해도 계속)
          run_sh_req(){ # run_sh_req <name> <retries> "<command>"
            local name="$1"; local retries="$2"; local cmd="$3"
            local attempt=0; local status=1
            echo "▶ ${name} :: ${cmd} (retries=${retries})"
            while true; do
              status=0
              bash -lc "${cmd}" >>"${LOG_DIR}/disk-ops.log" 2>&1 || status=$?
              if [ ${status} -eq 0 ]; then
                ok "${name} OK"; return 0
              fi
              attempt=$((attempt+1))
              if [ ${attempt} -le ${retries} ]; then
                warn "${name} FAILED (exit=${status}) — retry ${attempt}/${retries}"
                sleep 2
              else
                warn "${name} FAILED (exit=${status}) — continue (no-skip)"
                return 0
              fi
            done
          }

          # A || B || C || true 체인 (항상 0)
          run_chain(){ # run_chain <name> "<cmd1 || cmd2 || true>"
            local name="$1"; local chain="$2"
            echo "▶ ${name} (chain)"
            local status=0
            bash -lc "${chain}" >>"${LOG_DIR}/disk-ops.log" 2>&1 || status=$?
            if [ ${status} -eq 0 ]; then ok "${name} OK"; else warn "${name} chain non-zero(${status}) — forced continue"; fi
          }

          kv(){ # key=value 파서
            local key="$1" str="$2"
            IFS=',' read -ra PAIRS <<< "$str"
            for p in "${PAIRS[@]}"; do
              p="${p#"${p%%[![:space:]]*}"}"; p="${p%"${p##*[![:space:]]}"}"
              [[ "$p" == "$key="* ]] && echo "${p#*=}" && return 0
            done
            return 1
          }
          SH
          chmod +x /tmp/echo_helpers.sh
          echo "${ECHO_OK} helpers ready"

      # ---------- Linux: loop image ----------
      - name: Linux — loop image (create/partition/format/mount + fix-perms + mass + ISO)
        if: ${{ startsWith(inputs.runner, 'ubuntu') && inputs.mode == 'linux_loop' }}
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          IMG="/var/disk.img"
          SIZE="${{ inputs.size_gb }}G"
          MP="${{ inputs.mount_path }}"
          FS="${{ inputs.fs }}"
          LABEL="${{ inputs.label }}"
          FSTAB="${{ inputs.fstab }}"

          run_sh_req "apt.update" 2 "sudo apt-get update -y"
          run_sh_req "apt.install.core" 2 "sudo apt-get install -y parted util-linux xfsprogs udev"
          run_chain "apt.install.iso" "sudo apt-get install -y xorriso || sudo apt-get install -y genisoimage || sudo apt-get install -y cdrtools || true"

          run_chain "img.create" "sudo fallocate -l '${SIZE}' '${IMG}' || sudo dd if=/dev/zero of='${IMG}' bs=1M count=$(( ${{ inputs.size_gb }} * 1024 )) || true"
          run_sh_req "loop.attach" 2 "sudo losetup -fP '${IMG}'"

          LOOP=$(losetup -a | awk -F: '/disk.img/ {print $1}' | head -n1)
          if [ -z "${LOOP:-}" ]; then
            run_sh_req "loop.attach.retry" 1 "sudo losetup -fP '${IMG}'"
            LOOP=$(losetup -a | awk -F: '/disk.img/ {print $1}' | head -n1)
          fi

          run_sh_req "gpt.label" 1 "sudo parted -s '${LOOP}' mklabel gpt"
          run_sh_req "gpt.part"  1 "sudo parted -s '${LOOP}' mkpart primary ${FS} 0% 100%"
          run_chain "part.probe" "sudo partprobe '${LOOP}' || sudo udevadm settle || true"

          PART="${LOOP}p1"
          if [ "${FS}" = "xfs" ]; then
            run_sh_req "mkfs.xfs" 1 "sudo mkfs.xfs -f -L '${LABEL}' '${PART}'"
          else
            run_sh_req "mkfs.ext4" 2 "sudo mkfs.ext4 -F -L '${LABEL}' '${PART}'"
          fi

          run_sh_req "mkdir.mountpoint" 1 "sudo mkdir -p '${MP}'"
          run_sh_req "mount" 2 "sudo mount '${PART}' '${MP}'"

          # fstab 등록(가능하면 UUID, 실패 시 LABEL)
          UUID=""
          for i in {1..5}; do
            UUID=$(blkid -s UUID -o value "${PART}" 2>/dev/null || true)
            [ -z "$UUID" ] && UUID=$(lsblk -no UUID "${PART}" 2>/dev/null || true)
            [ -n "$UUID" ] && break || sleep 1
          done
          if [ "${FSTAB}" = "true" ]; then
            if [ -n "$UUID" ]; then
              echo "UUID=${UUID}   ${MP}   ${FS}   defaults,nofail   0 2" | sudo tee -a /etc/fstab >/dev/null || true
            else
              echo "LABEL=${LABEL}  ${MP}   ${FS}   defaults,nofail   0 2" | sudo tee -a /etc/fstab >/dev/null || true
            fi
          fi
          ok "Mounted at ${MP} (part=${PART})"

          # --- 중요: 권한 이양(3단계 대체 루틴) ---
          # 1) 소유자 runner로 변경 → 2) ACL(있으면) 부여 → 3) 최후수단 퍼미션 개방
          USERN="$(id -un)"; GROUPN="$(id -gn)"
          run_chain "fix.perms" "\
            sudo chown -R '${USERN}:${GROUPN}' '${MP}' || \
            (command -v setfacl >/dev/null 2>&1 && sudo setfacl -R -m u:${USERN}:rwx -m g:${GROUPN}:rwx '${MP}') || \
            sudo chmod -R a+rwx '${MP}' || true"

          # --- 대량 생성(일반 실행 → 실패 시 sudo로 재시도) ---
          run_sh_req "mass.dirs" 1 "cd '${MP}' && mkdir -p {logs,data,backups,tmp,scripts,configs,reports,bins,jobs} && for i in \$(seq 1 50); do mkdir -p data/shard_\$i; done && for i in \$(seq 1 20); do mkdir -p logs/day_\$i; done"
          run_sh_req "mass.dirs.sudo" 0 "sudo bash -lc \"cd '${MP}' && mkdir -p {logs,data,backups,tmp,scripts,configs,reports,bins,jobs} && for i in \$(seq 1 50); do mkdir -p data/shard_\$i; done && for i in \$(seq 1 20); do mkdir -p logs/day_\$i; done && chown -R '${USERN}:${GROUPN}' .\""

          run_sh_req "mass.files" 1 "cd '${MP}' && for i in \$(seq 1 200); do echo \"file-\$i,\$(date -Iseconds)\" >> reports/index.csv; done && truncate -s 64K backups/seed.bin && printf '#!/usr/bin/env bash\nset -Eeuo pipefail\necho ok\n' > scripts/healthcheck.sh && chmod +x scripts/healthcheck.sh && echo 'KEY=VALUE' > configs/app.env"
          run_sh_req "mass.files.sudo" 0 "sudo bash -lc \"cd '${MP}' && mkdir -p reports backups scripts configs && for i in \$(seq 1 200); do echo 'file-'\\\$i,\\\$(date -Iseconds) >> reports/index.csv; done && truncate -s 64K backups/seed.bin && printf '#!/usr/bin/env bash\nset -Eeuo pipefail\necho ok\n' > scripts/healthcheck.sh && chmod +x scripts/healthcheck.sh && echo 'KEY=VALUE' > configs/app.env && chown -R '${USERN}:${GROUPN}' .\""

          run_sh_req "checksums" 1 "cd '${MP}' && find . -type f -maxdepth 2 -print0 | xargs -0 sha256sum > reports/SHA256SUMS.txt || true"

          # ISO 생성(옵션)
          if [ -n "${{ inputs.iso_cfg }}" ]; then
            NAME=$(kv name "${{ inputs.iso_cfg }}" || echo "DISK_IMG")
            SRC=$(kv src  "${{ inputs.iso_cfg }}" || echo "${MP}")
            ISO="${{ github.workspace }}/${NAME}.iso"
            run_chain "iso.create" "xorriso -as mkisofs -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || genisoimage -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || mkisofs -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || true"
            [ -f "${ISO}" ] && mv "${ISO}" "${ART_DIR}/" || warn "ISO not created"
          fi

          run_sh_req "health.mount" 0 "[ -d '${MP}' ] && mountpoint -q '${MP}'"
          run_sh_req "health.write" 0 "echo ok > '${MP}/.ok' && sync || sudo bash -lc \"echo ok > '${MP}/.ok' && sync\""

      # ---------- Linux: real device ----------
      - name: Linux — real device (partition/format/mount + fix-perms + mass + ISO)
        if: ${{ startsWith(inputs.runner, 'ubuntu') && inputs.mode == 'linux_device' }}
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          DEV="${{ inputs.device }}"
          MP="${{ inputs.mount_path }}"
          FS="${{ inputs.fs }}"
          LABEL="${{ inputs.label }}"
          FSTAB="${{ inputs.fstab }}"

          [ -n "${DEV}" ] || warn "device empty — 예: /dev/sdb"

          run_sh_req "apt.update" 2 "sudo apt-get update -y"
          run_sh_req "apt.install.core" 2 "sudo apt-get install -y parted util-linux xfsprogs udev"
          run_chain "apt.install.iso" "sudo apt-get install -y xorriso || sudo apt-get install -y genisoimage || sudo apt-get install -y cdrtools || true"

          run_sh_req "gpt.label" 1 "sudo parted -s '${DEV}' mklabel gpt"
          run_sh_req "gpt.part"  1 "sudo parted -s '${DEV}' mkpart primary ${FS} 0% 100%"
          PART="${DEV}1"
          run_chain "part.probe" "sudo partprobe '${DEV}' || sudo udevadm settle || true"

          if [ "${FS}" = "xfs" ]; then
            run_sh_req "mkfs.xfs" 1 "sudo mkfs.xfs -f -L '${LABEL}' '${PART}'"
          else
            run_sh_req "mkfs.ext4" 2 "sudo mkfs.ext4 -F -L '${LABEL}' '${PART}'"
          fi

          run_sh_req "mkdir.mountpoint" 1 "sudo mkdir -p '${MP}'"
          run_sh_req "mount" 2 "sudo mount '${PART}' '${MP}'"

          # fstab
          UUID=""
          for i in {1..5}; do
            UUID=$(blkid -s UUID -o value "${PART}" 2>/dev/null || true)
            [ -z "$UUID" ] && UUID=$(lsblk -no UUID "${PART}" 2>/dev/null || true)
            [ -n "$UUID" ] && break || sleep 1
          done
          if [ "${FSTAB}" = "true" ]; then
            if [ -n "$UUID" ]; then
              echo "UUID=${UUID}   ${MP}   ${FS}   defaults,nofail   0 2" | sudo tee -a /etc/fstab >/dev/null || true
            else
              echo "LABEL=${LABEL}  ${MP}   ${FS}   defaults,nofail   0 2" | sudo tee -a /etc/fstab >/dev/null || true
            fi
          fi
          ok "Mounted at ${MP} (part=${PART})"

          # 권한 이양
          USERN="$(id -un)"; GROUPN="$(id -gn)"
          run_chain "fix.perms" "\
            sudo chown -R '${USERN}:${GROUPN}' '${MP}' || \
            (command -v setfacl >/dev/null 2>&1 && sudo setfacl -R -m u:${USERN}:rwx -m g:${GROUPN}:rwx '${MP}') || \
            sudo chmod -R a+rwx '${MP}' || true"

          # 대량 생성(일반→sudo 백업)
          run_sh_req "mass.dirs" 1 "cd '${MP}' && mkdir -p {logs,data,backups,tmp,scripts,configs,reports,bins,jobs} && for i in \$(seq 1 50); do mkdir -p data/shard_\$i; done && for i in \$(seq 1 20); do mkdir -p logs/day_\$i; done"
          run_sh_req "mass.dirs.sudo" 0 "sudo bash -lc \"cd '${MP}' && mkdir -p {logs,data,backups,tmp,scripts,configs,reports,bins,jobs} && for i in \$(seq 1 50); do mkdir -p data/shard_\$i; done && for i in \$(seq 1 20); do mkdir -p logs/day_\$i; done && chown -R '${USERN}:${GROUPN}' .\""

          run_sh_req "mass.files" 1 "cd '${MP}' && for i in \$(seq 1 200); do echo \"file-\$i,\$(date -Iseconds)\" >> reports/index.csv; done && truncate -s 64K backups/seed.bin && printf '#!/usr/bin/env bash\nset -Eeuo pipefail\necho ok\n' > scripts/healthcheck.sh && chmod +x scripts/healthcheck.sh && echo 'KEY=VALUE' > configs/app.env"
          run_sh_req "mass.files.sudo" 0 "sudo bash -lc \"cd '${MP}' && mkdir -p reports backups scripts configs && for i in \$(seq 1 200); do echo 'file-'\\\$i,\\\$(date -Iseconds) >> reports/index.csv; done && truncate -s 64K backups/seed.bin && printf '#!/usr/bin/env bash\nset -Eeuo pipefail\necho ok\n' > scripts/healthcheck.sh && chmod +x scripts/healthcheck.sh && echo 'KEY=VALUE' > configs/app.env && chown -R '${USERN}:${GROUPN}' .\""

          run_sh_req "checksums" 1 "cd '${MP}' && find . -type f -maxdepth 2 -print0 | xargs -0 sha256sum > reports/SHA256SUMS.txt || true"

          # ISO
          if [ -n "${{ inputs.iso_cfg }}" ]; then
            NAME=$(kv name "${{ inputs.iso_cfg }}" || echo "DISK_IMG")
            SRC=$(kv src  "${{ inputs.iso_cfg }}" || echo "${MP}")
            ISO="${{ github.workspace }}/${NAME}.iso"
            run_chain "iso.create" "xorriso -as mkisofs -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || genisoimage -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || mkisofs -R -J -V '${NAME}' -o '${ISO}' '${SRC}' || true"
            [ -f "${ISO}" ] && mv "${ISO}" "${ART_DIR}/" || warn "ISO not created"
          fi

          run_sh_req "health.mount" 0 "[ -d '${MP}' ] && mountpoint -q '${MP}'"
          run_sh_req "health.write" 0 "echo ok > '${MP}/.ok' && sync || sudo bash -lc \"echo ok > '${MP}/.ok' && sync\""

      # ---------- Windows: VHDX ----------
      - name: Windows — VHDX (create/mount/format + mass)
        if: ${{ startsWith(inputs.runner, 'windows') && inputs.mode == 'windows_vhdx' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $VRoot = Join-Path $env:GITHUB_WORKSPACE "vdisks"
          New-Item -ItemType Directory -Force -Path $VRoot | Out-Null
          $Size = [int]${{ inputs.size_gb }} * 1GB
          $Vhdx = Join-Path $VRoot "data.vhdx"
          $DL = "${{ inputs.drive_letter }}"
          $Label = "${{ inputs.label }}"

          Write-Host "▶ Create VHDX $Vhdx ($(${{ inputs.size_gb }}) GB)"
          try { New-VHD -Path $Vhdx -SizeBytes $Size -Dynamic -ErrorAction Continue } catch { $_ | Out-String | Write-Warning }

          Write-Host "▶ Mount VHDX"
          $disk = $null
          try { $disk = Mount-VHD -Path $Vhdx -PassThru | Get-Disk } catch { $_ | Out-String | Write-Warning }
          if ($disk) {
            try { Initialize-Disk -Number $disk.Number -PartitionStyle GPT -ErrorAction Continue } catch { $_ | Out-String | Write-Warning }
            try { New-Partition -DiskNumber $disk.Number -UseMaximumSize -DriveLetter $DL -ErrorAction Continue | Out-Null } catch { $_ | Out-String | Write-Warning }
            try { Format-Volume -DriveLetter $DL -FileSystem NTFS -NewFileSystemLabel $Label -Confirm:$false -ErrorAction Continue | Out-Null } catch { $_ | Out-String | Write-Warning }

            foreach ($d in @("logs","data","backups","scripts","configs","reports")) { New-Item -ItemType Directory -Force -Path "$($DL):\$d" | Out-Null }
            "KEY=VALUE" | Out-File -Encoding utf8 -FilePath "$($DL):\configs\app.env"
            "file,ts"   | Out-File -Encoding utf8 -FilePath "$($DL):\reports\index.csv"
          } else {
            Write-Warning "VHDX mount failed — continue (no-skip)"
          }

      # ---------- macOS: DMG ----------
      - name: macOS — DMG (create/mount + mass + ISO makehybrid)
        if: ${{ startsWith(inputs.runner, 'macos') && inputs.mode == 'macos_dmg' }}
        shell: bash
        run: |
          source /tmp/echo_helpers.sh
          SIZE="${{ inputs.size_gb }}"
          FS="${{ inputs.fs }}"
          LABEL="${{ inputs.label }}"
          DMG="${{ github.workspace }}/vdata.dmg"
          [ "${FS}" = "APFS" ] || [ "${FS}" = "JHFS+" ] || FS="APFS"

          run_sh_req "dmg.create" 1 "hdiutil create -size '${SIZE}g' -fs '${FS}' -volname '${LABEL}' '${DMG}'"
          run_sh_req "dmg.attach" 1 "hdiutil attach '${DMG}'"
          MOUNT="/Volumes/${LABEL}"
          if [ -d "${MOUNT}" ]; then
            run_sh_req "mass.dirs.files" 1 "cd '${MOUNT}' && mkdir -p {logs,data,backups,scripts,configs,reports} && echo 'KEY=VALUE' > configs/app.env && echo 'file,ts' > reports/index.csv"
          else
            warn "mount not found — continue (no-skip)"
          fi

          if [ -n "${{ inputs.iso_cfg }}" ]; then
            NAME=$(kv name "${{ inputs.iso_cfg }}" || echo "DISK_IMG")
            SRC=$(kv src  "${{ inputs.iso_cfg }}" || echo "${MOUNT}")
            ISO="${{ github.workspace }}/${NAME}.iso"
            run_sh_req "iso.makehybrid" 1 "hdiutil makehybrid -o '${ISO}' '${SRC}' -iso -joliet -default-volume-name '${NAME}'"
            [ -f "${ISO}" ] && mv "${ISO}" "${ART_DIR}/" || warn "ISO not created"
          fi

      - name: Upload artifacts (logs + ISO)
        uses: actions/upload-artifact@v4
        with:
          name: disk-ops-artifacts
          path: |
            .github/echo_logs/disk-ops.log
            .github/echo_artifacts/*.iso
          if-no-files-found: warn

name: "🏦 Java Ledger Viewer (Multi-file + All-dates + Filters + Reports + Release URLs + Bulk Modify)"

on:
  workflow_dispatch:
    inputs:
      ledger_path:
        description: "단일 통장 파일 경로 (CSV/XLS/XLSX). 비우면 자동 탐색"
        required: false
        default: ""
      date_range:
        description: "조회기간 'YYYY-MM-DD..YYYY-MM-DD' (all_dates=true면 무시)"
        required: false
        default: ""
      sheet_name:
        description: "엑셀 시트명(선택, 미지정 시 첫 시트)"
        required: false
        default: ""
      excel_exts:
        description: "탐색 확장자 제한: xlsx / xls / csv 또는 콤마 복수 (예: xlsx,xls)"
        required: false
        default: ""
      search_root:
        description: "탐색 루트(콤마 복수). 기본 .github (예: .github,data)"
        required: false
        default: ".github"
      name_filters:
        description: "파일명에 반드시 포함될 키워드(콤마). 예: 통장,신한"
        required: false
        default: ""
      aggregate_all_files:
        description: "탐색된 모든 파일을 합산 처리"
        type: boolean
        required: false
        default: true
      all_dates:
        description: "모든 일자(기간 필터 없음)로 집계"
        type: boolean
        required: false
        default: true
      output_formats:
        description: "리포트 포맷: console,csv,html (콤마 복수)"
        required: false
        default: "console,csv,html"
      report_options:
        description: "JSON: {\"top_n\":10, \"category_map_json\":\"{\\\"카페\\\":[\\\"커피\\\"]}\"}"
        required: false
        default: ""

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  DL_DIR: .github/echo_downloads
  REPORT_DIR: target/reports
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"

  # ===== BULK MODIFY (입력 10개 제한 유지: 전부 ENV 제어) =====
  BULK_ENABLE: "true"                     # 대량 수정 수행 여부
  BULK_GLOBS: "README.md docs/**/*.md .github/**/*.md"
  REPLACE_FROM: "echo-file"
  REPLACE_TO:   "vibe-file"
  APPEND_LINE:  "<!-- appended-by-ledger-workflow -->"
  RENAME_PREFIX: "bulk_"
  RENAME_SUFFIX: ""
  DUPLICATE_COPIES: "0"                   # 0이면 복제 안함
  CHMOD_MODE: "644"

permissions:
  contents: write
  actions: read

concurrency:
  group: ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  view-ledger:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure base dirs + Git LFS
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${DL_DIR}" "${REPORT_DIR}" app/src/main/java/com/example app/src/main/resources data
          git lfs install
          git lfs pull || true

      - name: Echo helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ECHO_OK="${ECHO_OK:-✅}"; ECHO_WARN="${ECHO_WARN:-⚠️}"; ECHO_FAIL="${ECHO_FAIL:-❌}"
          log(){ printf '%s %s\n' "$1" "$2" | tee -a "${LOG_DIR}/echo.log"; }
          echoe(){ log "${ECHO_OK}" "$*"; }
          warne(){ log "${ECHO_WARN}" "$*"; }
          faile(){ log "${ECHO_FAIL}" "$*"; }
          run(){ printf '▶ %s\n' "$*"; eval "$@" 2>&1 | tee -a "${LOG_DIR}/echo.log"; }
          SH
          chmod +x /tmp/echo_helpers.sh
          source /tmp/echo_helpers.sh
          echoe "Echo helpers ready"

      # 🔁 새 입력을 기존 ENV로 변환 (FROM/TO, TOP_N, CATEGORY_MAP_JSON)
      - name: Derive legacy env from date_range & report_options
        shell: bash
        run: |
          set -Eeuo pipefail
          DATE_RANGE="${{ inputs.date_range }}"
          FROM=""; TO=""
          if [[ -n "$DATE_RANGE" && "$DATE_RANGE" == *..* ]]; then
            FROM="${DATE_RANGE%%..*}"; TO="${DATE_RANGE##*..}"
          fi
          echo "FROM_DATE=$FROM" >> "$GITHUB_ENV"
          echo "TO_DATE=$TO" >> "$GITHUB_ENV"
          RO='${{ inputs.report_options }}'
          TOP_N="10"; CAT_JSON=""
          if command -v jq >/dev/null 2>&1 && [[ -n "$RO" ]]; then
            TOP_N="$(jq -r '.top_n // empty' <<<"$RO" 2>/dev/null || echo '')"
            CAT_JSON="$(jq -r '.category_map_json // empty' <<<"$RO" 2>/dev/null || echo '')"
          fi
          [[ -z "$TOP_N" ]] && TOP_N="10"
          echo "TOP_N=$TOP_N" >> "$GITHUB_ENV"
          echo "CATEGORY_MAP_JSON=$CAT_JSON" >> "$GITHUB_ENV"

      # ====== 🔧 BULK MODIFY (replace/append/rename/duplicate/chmod) ======
      - name: BULK MODIFY — replace/append/rename/duplicate/chmod
        if: env.BULK_ENABLE == 'true'
        shell: bash
        env:
          GLOBS: "${{ env.BULK_GLOBS }}"
          FROM:  "${{ env.REPLACE_FROM }}"
          TO:    "${{ env.REPLACE_TO }}"
          APPEND_LINE: "${{ env.APPEND_LINE }}"
          RPRE:  "${{ env.RENAME_PREFIX }}"
          RSUF:  "${{ env.RENAME_SUFFIX }}"
          COPIES: "${{ env.DUPLICATE_COPIES }}"
          FMODE: "${{ env.CHMOD_MODE }}"
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          shopt -s nullglob globstar
          FILES=()
          for g in ${GLOBS}; do for f in $g; do [ -f "$f" ] && FILES+=("$f"); done; done
          if [ ${#FILES[@]} -eq 0 ]; then warne "대상(${GLOBS}) 파일이 없습니다."
          else
            for f in "${FILES[@]}"; do
              # 치환
              if [ -n "$FROM" ]; then run sed -i "s/${FROM//\//\\/}/${TO//\//\\/}/g" "$f"; fi
              # 줄 추가
              if [ -n "$APPEND_LINE" ]; then printf '%s\n' "$APPEND_LINE" >> "$f"; fi
              # 리네임
              dir=$(dirname "$f"); base=$(basename "$f"); name="${base%.*}"; ext="${base##*.}"; dot="."
              [ "$base" = "$ext" ] && dot=""
              new="${dir}/${RPRE}${name}${RSUF}${dot}${ext}"
              if [ -n "$RPRE" ] || [ -n "$RSUF" ]; then run mv "$f" "$new"; f="$new"; fi
              # 복제
              if [ "${COPIES:-0}" -gt 0 ]; then
                idx=1; while [ $idx -le "${COPIES}" ]; do clone="${f%.*}_copy${idx}${dot}${ext}"; run cp -f "$f" "$clone"; idx=$((idx+1)); done
              fi
            done
          fi
          # 권한 정리
          run find . -type f -not -path './.git/*' -exec chmod ${FMODE} {} +
          run find . -type d -not -path './.git/*' -exec chmod 755 {} +
          # 변경사항 로그
          git status --porcelain | tee "${LOG_DIR}/bulk_modify_changes.txt" || true

      # 1) pom.xml 없으면 생성
      - name: Bootstrap Maven project if missing
        if: hashFiles('**/pom.xml') == ''
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          echoe "pom.xml 미존재 → app/에 생성"
          run mkdir -p app/src/main/java/com/example app/src/main/resources
          cat > app/pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>bank-ledger</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.source>21</maven.compiler.source>
              <maven.compiler.target>21</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>org.apache.commons</groupId>
                <artifactId>commons-csv</artifactId>
                <version>1.11.0</version>
              </dependency>
              <dependency>
                <groupId>org.apache.poi</groupId>
                <artifactId>poi</artifactId>
                <version>5.2.5</version>
              </dependency>
              <dependency>
                <groupId>org.apache.poi</groupId>
                <artifactId>poi-ooxml</artifactId>
                <version>5.2.5</version>
              </dependency>
              <dependency>
                <groupId>com.fasterxml.jackson.core</groupId>
                <artifactId>jackson-databind</artifactId>
                <version>2.17.2</version>
              </dependency>
              <dependency>
                <groupId>org.apache.commons</groupId>
                <artifactId>commons-lang3</artifactId>
                <version>3.14.0</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration><release>21</release></configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-shade-plugin</artifactId>
                  <version>3.5.3</version>
                  <executions>
                    <execution>
                      <phase>package</phase>
                      <goals><goal>shade</goal></goals>
                      <configuration>
                        <createDependencyReducedPom>false</createDependencyReducedPom>
                        <transformers>
                          <transformer implementation="org.apache.maven.plugins.shade.resource.ManifestResourceTransformer">
                            <mainClass>com.example.BankLedger</mainClass>
                          </transformer>
                        </transformers>
                      </configuration>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          POM
          echo "POM_PATH=app/pom.xml" >> "$GITHUB_ENV"

      # 2) POM self-heal (닫힘태그 보정)
      - name: Self-heal POM shade <transformer> tag if broken
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          POM_PATH="${POM_PATH:-}"
          [[ -z "$POM_PATH" ]] && POM_PATH="$(find . -type f -name pom.xml -not -path '*/.git/*' | head -n1 || true)"
          if [[ -z "$POM_PATH" ]]; then warne "POM 미발견 → Self-heal 스킵"; exit 0; fi
          NEED_FIX="$(
            awk '
              /<transformers>/ {inT=1}
              inT && /<\/transformers>/ { if (count==0) print "MISSING"; inT=0; count=0 }
              inT && /<transformer[ >]/ { count++ }
            ' "${POM_PATH}" || true
          )"
          if [[ "${NEED_FIX:-}" == "MISSING" ]]; then
            awk '
              /<transformers>/ {print; inT=1; next}
              inT && /<\/transformers>/ {print "                    </transformer>"; print; inT=0; next}
              {print}
            ' "${POM_PATH}" > "${POM_PATH}.fixed"
            mv "${POM_PATH}.fixed" "${POM_PATH}"
            echo "✅ POM transformer 태그 자동 보정 완료"
          else
            echo "✅ POM transformer 태그 정상"
          fi

      # 3) BankLedger.java 존재 확인 + 최소 보정 (없으면 미니멀 구현 생성)
      - name: Ensure BankLedger.java exists (fallback if missing)
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          FILE="app/src/main/java/com/example/BankLedger.java"
          if [[ ! -f "$FILE" ]] || ! grep -q "class BankLedger" "$FILE"; then
            echoe "BankLedger.java 미존재 또는 비정상 → 최소 구현 생성(기능 축약)"
            mkdir -p app/src/main/java/com/example
            cat > "$FILE" <<'JAVA'
            package com.example;
            import java.nio.file.*; import java.io.*; import java.util.*;
            public class BankLedger {
              public static void main(String[] a) throws Exception {
                System.out.println("Ledger Viewer minimal fallback running…");
                System.out.println("LEDGER_PATH=" + System.getenv().getOrDefault("LEDGER_PATH",""));
                System.out.println("FROM_DATE=" + System.getenv().getOrDefault("FROM_DATE",""));
                System.out.println("TO_DATE=" + System.getenv().getOrDefault("TO_DATE",""));
                // 최소 실행 보장용, 실제 기능 구현은 기존 파일 유지 시 사용됩니다.
              }
            }
            JAVA
          else
            echo "기존 BankLedger.java 유지"
          fi

      # 4) Java 설정
      - name: Setup Java (Temurin 21 + maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 5) 빌드 & JAR 고르기 + 무결성 점검
      - name: Build & pick JAR + Sanity check
        id: pickjar
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          POM_PATH="${POM_PATH:-}"
          [[ -z "${POM_PATH}" ]] && POM_PATH="$(find . -type f -name pom.xml -not -path '*/.git/*' | head -n1 || true)"
          JAR=""
          if [[ -n "${POM_PATH}" ]]; then
            WORKDIR="$(dirname "${POM_PATH}")"
            echo "Detected pom: ${POM_PATH}"
            run mvn -B -q -DskipTests -f "${POM_PATH}" package
            for pat in "*-shaded.jar" "*jar-with-dependencies.jar" "*-all.jar" "*-shadow.jar" "*.jar"; do
              CAND="$(ls -1 "${WORKDIR}"/target/${pat} 2>/dev/null | grep -v 'original-' | head -n1 || true)"
              [[ -n "${CAND}" ]] && JAR="${CAND}" && break
            done
            [[ -z "${JAR}" ]] && { faile "실행 JAR을 찾지 못했습니다."; ls -al "${WORKDIR}/target" || true; exit 1; }
          else
            faile "pom.xml을 찾지 못했습니다."; exit 1
          fi
          echo "JAR=${JAR}" >> "$GITHUB_ENV"
          echo "jar_path=${JAR}" >> "$GITHUB_OUTPUT"
          echo "✅ Picked JAR: ${JAR}"
          # ---- 무결성 점검 (클래스/매니페스트)
          if ! (jar tf "${JAR}" | grep -q '^com/example/BankLedger.class$'); then
            faile "JAR에 com/example/BankLedger.class 없음"; jar tf "${JAR}" | head -n 200; exit 1
          fi
          echo "— Manifest —"
          (unzip -p "${JAR}" META-INF/MANIFEST.MF || true) | sed -n '1,60p'

      # 6) 실행 (매니페스트 우선, 실패 시 -cp 폴백)
      - name: Run viewer (java -jar w/ fallback)
        shell: bash
        env:
          LEDGER_PATH:  ${{ inputs.ledger_path }}
          FROM_DATE:    ${{ env.FROM_DATE }}
          TO_DATE:      ${{ env.TO_DATE }}
          SHEET_NAME:   ${{ inputs.sheet_name }}
          LEDGER_EXTS:  ${{ inputs.excel_exts }}
          LEDGER_SEARCH_ROOTS: ${{ inputs.search_root }}
          LEDGER_NAME_FILTERS: ${{ inputs.name_filters }}
          AGGREGATE_ALL_FILES: ${{ inputs.aggregate_all_files }}
          ALL_DATES:    ${{ inputs.all_dates }}
          OUTPUT_FORMATS: ${{ inputs.output_formats }}
          TOP_N:        ${{ env.TOP_N }}
          CATEGORY_MAP_JSON: ${{ env.CATEGORY_MAP_JSON }}
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          echo "LEDGER_PATH=${LEDGER_PATH:-'(빈값: 자동탐색)'}"
          echo "FROM_DATE=${FROM_DATE}   TO_DATE=${TO_DATE}   ALL_DATES=${ALL_DATES}"
          echo "SHEET_NAME=${SHEET_NAME}  LEDGER_EXTS=${LEDGER_EXTS:-'(제한 없음)'}"
          echo "SEARCH_ROOTS=${LEDGER_SEARCH_ROOTS}  NAME_FILTERS=${LEDGER_NAME_FILTERS}"
          echo "AGGREGATE_ALL_FILES=${AGGREGATE_ALL_FILES}  OUTPUT_FORMATS=${OUTPUT_FORMATS}"
          echo "TOP_N=${TOP_N}"
          test -n "${JAR:-}" || { echo "❌ JAR 환경변수가 비어 있습니다."; exit 1; }
          if unzip -p "${JAR}" META-INF/MANIFEST.MF 2>/dev/null | grep -q 'Main-Class: *com.example.BankLedger'; then
            run java -jar "${JAR}" "${LEDGER_PATH:-}" "${FROM_DATE:-}" "${TO_DATE:-}" || {
              warne "jar 실행 실패 → -cp 폴백"; run java -cp "${JAR}" com.example.BankLedger "${LEDGER_PATH:-}" "${FROM_DATE:-}" "${TO_DATE:-}"
            }
          else
            warne "매니페스트 Main-Class 미지정 → -cp 실행"
            run java -cp "${JAR}" com.example.BankLedger "${LEDGER_PATH:-}" "${FROM_DATE:-}" "${TO_DATE:-}"
          fi

      # 7) 릴리즈 + URL 요약
      - name: Create GitHub Release (attach JAR & reports)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ledger-${{ github.run_id }}"
          name: "Ledger Viewer Build ${{ github.run_id }}"
          draft: false
          prerelease: false
          files: |
            ${{ steps.pickjar.outputs.jar_path }}
            target/reports/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gh CLI (for URL summary)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y && sudo apt-get install -y gh jq

      - name: Summarize Release URLs (정식 다운로드 링크)
        id: relurls
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if ! gh release view "ledger-${GITHUB_RUN_ID}" --json url,assets > /tmp/rel.json 2>/dev/null; then
            echo "release_page_url=" >> "$GITHUB_OUTPUT"
            echo "asset_download_url=" >> "$GITHUB_OUTPUT"
            {
              echo "## ✅ Download Links (Release)"
              echo "- Release page: 생성은 되었으나 조회 실패(gh 미인증 등). 릴리즈 탭에서 확인하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PAGE_URL="$(jq -r '.url' /tmp/rel.json)"
          ASSET_URL="$(jq -r '.assets[0].url // empty' /tmp/rel.json)"
          echo "release_page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "asset_download_url=${ASSET_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "## ✅ Download Links (Release)"
            echo "- Release page: ${PAGE_URL}"
            if [ -n "${ASSET_URL}" ]; then echo "- First asset:  ${ASSET_URL}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 8) 아티팩트 업로드(로그/리포트/JAR/대량수정 로그)
      - name: Upload artifacts (logs + jars + reports + sources used)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-artifacts-${{ github.run_id }}
          path: |
            ${LOG_DIR}
            **/target/*.jar
            target/reports/**/*
            data/*.csv
            .github/**/*.xlsx
            .github/**/*.xls
            .github/**/*.csv
          if-no-files-found: ignore
          include-hidden-files: true

      # 9) 요약
      - name: Job summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "### 🧾 Reports"
            echo "- Consolidated CSV: \`target/reports/ledger_consolidated.csv\`"
            echo "- By date:          \`target/reports/summary_by_date.csv\`"
            echo "- By type:          \`target/reports/summary_by_type.csv\`"
            echo "- By memo (Top N):  \`target/reports/summary_by_memo.csv\`"
            echo "- Monthly:          \`target/reports/summary_monthly.csv\`"
            echo "- By category:      \`target/reports/summary_by_category.csv\` (옵션)"
            echo "- HTML summary:     \`target/reports/summary.html\`"
            echo "### 🔧 Bulk Modify"
            echo "- Globs:    ${{ env.BULK_GLOBS }}"
            echo "- Replace:  '${{ env.REPLACE_FROM }}' -> '${{ env.REPLACE_TO }}'"
            echo "- Append:   '${{ env.APPEND_LINE }}'"
            echo "- Rename:   prefix='${{ env.RENAME_PREFIX }}' suffix='${{ env.RENAME_SUFFIX }}' copies=${{ env.DUPLICATE_COPIES }}"
            echo "- chmod:    files=${{ env.CHMOD_MODE }}, dirs=755"
            echo "### 🔗 Release"
            echo "- Page:  ${{ steps.relurls.outputs.release_page_url }}"
            echo "- Asset: ${{ steps.relurls.outputs.asset_download_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

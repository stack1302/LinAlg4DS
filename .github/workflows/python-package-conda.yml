name: "🏦 Java Ledger Viewer (Multi-file + All-dates + Filters + Reports + Release URLs)"

on:
  workflow_dispatch:
    inputs:
      ledger_path:
        description: "단일 통장 파일 경로 (CSV/XLS/XLSX). 비우면 자동 탐색"
        required: false
        default: ""
      from_date:
        description: "조회 시작일 (YYYY-MM-DD). all_dates=true면 무시"
        required: false
        default: ""
      to_date:
        description: "조회 종료일 (YYYY-MM-DD). all_dates=true면 무시"
        required: false
        default: ""
      sheet_name:
        description: "엑셀 시트명(선택, 미지정 시 첫 시트)"
        required: false
        default: ""
      excel_exts:
        description: "탐색 확장자 제한: xlsx / xls / csv 또는 콤마 복수 (예: xlsx,xls)"
        required: false
        default: ""
      search_root:
        description: "탐색 루트(콤마 복수). 기본 .github (예: .github,data)"
        required: false
        default: ".github"
      name_filters:
        description: "파일명에 반드시 포함될 키워드(콤마). 예: 통장,신한"
        required: false
        default: ""
      aggregate_all_files:
        description: "탐색된 모든 파일을 합산 처리"
        type: boolean
        required: false
        default: true
      all_dates:
        description: "모든 일자(기간 필터 없음)로 집계"
        type: boolean
        required: false
        default: true
      output_formats:
        description: "리포트 포맷: console,csv,html (콤마 복수)"
        required: false
        default: "console,csv,html"

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  DL_DIR: .github/echo_downloads
  REPORT_DIR: target/reports
  ECHO_OK: "✅"
  ECHO_WARN: "⚠️"
  ECHO_FAIL: "❌"

permissions:
  contents: write
  actions: read

jobs:
  view-ledger:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure base dirs + Git LFS
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${DL_DIR}" "${REPORT_DIR}" app/src/main/java/com/example app/src/main/resources data
          git lfs install
          git lfs pull || true

      - name: Echo helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/echo_helpers.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ECHO_OK="${ECHO_OK:-✅}"; ECHO_WARN="${ECHO_WARN:-⚠️}"; ECHO_FAIL="${ECHO_FAIL:-❌}"
          log(){ printf '%s %s\n' "$1" "$2" | tee -a "${LOG_DIR}/echo.log"; }
          echoe(){ log "${ECHO_OK}" "$*"; }
          warne(){ log "${ECHO_WARN}" "$*"; }
          faile(){ log "${ECHO_FAIL}" "$*"; }
          run(){ printf '▶ %s\n' "$*" | tee -a "${LOG_DIR}/echo.log"; eval "$@" 2>&1 | tee -a "${LOG_DIR}/echo.log"; }
          SH
          chmod +x /tmp/echo_helpers.sh
          source /tmp/echo_helpers.sh
          echoe "Echo helpers ready"

      # 1) pom.xml 없으면 생성(정상 POM)
      - name: Bootstrap Maven project if missing
        if: hashFiles('**/pom.xml') == ''
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          echoe "pom.xml 미존재 → app/에 생성"
          run mkdir -p app/src/main/java/com/example app/src/main/resources
          cat > app/pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>bank-ledger</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.source>21</maven.compiler.source>
              <maven.compiler.target>21</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>org.apache.commons</groupId>
                <artifactId>commons-csv</artifactId>
                <version>1.11.0</version>
              </dependency>
              <dependency>
                <groupId>org.apache.poi</groupId>
                <artifactId>poi</artifactId>
                <version>5.2.5</version>
              </dependency>
              <dependency>
                <groupId>org.apache.poi</groupId>
                <artifactId>poi-ooxml</artifactId>
                <version>5.2.5</version>
              </dependency>
              <dependency>
                <groupId>org.apache.commons</groupId>
                <artifactId>commons-lang3</artifactId>
                <version>3.14.0</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration><release>21</release></configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-shade-plugin</artifactId>
                  <version>3.5.3</version>
                  <executions>
                    <execution>
                      <phase>package</phase>
                      <goals><goal>shade</goal></goals>
                      <configuration>
                        <createDependencyReducedPom>false</createDependencyReducedPom>
                        <!-- 최종 JAR은 일반 파일명에 생성될 수 있음(original-* 백업 포함) -->
                        <transformers>
                          <transformer implementation="org.apache.maven.plugins.shade.resource.ManifestResourceTransformer">
                            <mainClass>com.example.BankLedger</mainClass>
                          </transformer>
                        </transformers>
                      </configuration>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          POM
          # 자리채움(곧 패치 스텝이 본문 교체)
          echo 'package com.example; public class BankLedger{public static void main(String[]a){System.out.println("placeholder");}}' > app/src/main/java/com/example/BankLedger.java
          echo "POM_PATH=app/pom.xml" >> "$GITHUB_ENV"

      # 2) POM self-heal (닫힘태그 보정)
      - name: Self-heal POM shade <transformer> tag if broken
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          POM_PATH="${POM_PATH:-}"
          [[ -z "$POM_PATH" ]] && POM_PATH="$(find . -type f -name pom.xml -not -path '*/.git/*' | head -n1 || true)"
          if [[ -z "$POM_PATH" ]]; then warne "POM 미발견 → Self-heal 스킵"; exit 0; fi
          NEED_FIX="$(
            awk '
              /<transformers>/ {inT=1}
              inT && /<\/transformers>/ { if (count==0) print "MISSING"; inT=0; count=0 }
              inT && /<transformer[ >]/ { count++ }
            ' "${POM_PATH}" || true
          )"
          if [[ "${NEED_FIX:-}" == "MISSING" ]]; then
            awk '
              /<transformers>/ {print; inT=1; next}
              inT && /<\/transformers>/ {print "                    </transformer>"; print; inT=0; next}
              {print}
            ' "${POM_PATH}" > "${POM_PATH}.fixed"
            mv "${POM_PATH}.fixed" "${POM_PATH}"
            echo "✅ POM transformer 태그 자동 보정 완료"
          else
            echo "✅ POM transformer 태그 정상"
          fi

      # 3) 자바 본문 전면 패치 (멀티파일+전기간+필터+리포트 + Integer→int 고정)
      - name: Patch BankLedger.java (multi-file + all-dates + reports + Integer→int fix)
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > app/src/main/java/com/example/BankLedger.java <<'JAVA'
          {{JAVA_CODE}}
          JAVA

      # 4) Java 설정
      - name: Setup Java (Temurin 21 + maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 5) 빌드 & JAR 고르기(견고한 패턴 + 일반 JAR fallback)
      - name: Build & pick JAR
        id: pickjar
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          POM_PATH="${POM_PATH:-}"
          [[ -z "${POM_PATH}" ]] && POM_PATH="$(find . -type f -name pom.xml -not -path '*/.git/*' | head -n1 || true)"
          JAR=""
          if [[ -n "${POM_PATH}" ]]; then
            WORKDIR="$(dirname "${POM_PATH}")"
            echo "Detected pom: ${POM_PATH}"
            run mvn -B -q -DskipTests -f "${POM_PATH}" package
            for pat in "*-shaded.jar" "*jar-with-dependencies.jar" "*-all.jar" "*-shadow.jar"; do
              CAND="$(ls -1 "${WORKDIR}"/target/${pat} 2>/dev/null | head -n1 || true)"
              [[ -n "${CAND}" ]] && JAR="${CAND}" && break
            done
            [[ -z "${JAR}" ]] && CAND="$(ls -1 "${WORKDIR}"/target/*.jar 2>/dev/null | grep -v 'original-' | head -n1 || true)" && JAR="${CAND}"
            if [[ -z "${JAR}" ]]; then
              faile "실행 JAR을 찾지 못했습니다."
              ls -al "${WORKDIR}/target" || true
              exit 1
            fi
          else
            faile "pom.xml을 찾지 못했습니다."
            exit 1
          fi
          echo "JAR=${JAR}" >> "$GITHUB_ENV"
          echo "jar_path=${JAR}" >> "$GITHUB_OUTPUT"
          echoe "Picked JAR: ${JAR}"

      # 6) 실행 (모든 옵션 전달)
      - name: Run viewer (java -jar)
        shell: bash
        env:
          LEDGER_PATH:  ${{ inputs.ledger_path }}
          FROM_DATE:    ${{ inputs.from_date }}
          TO_DATE:      ${{ inputs.to_date }}
          SHEET_NAME:   ${{ inputs.sheet_name }}
          LEDGER_EXTS:  ${{ inputs.excel_exts }}
          LEDGER_SEARCH_ROOTS: ${{ inputs.search_root }}
          LEDGER_NAME_FILTERS: ${{ inputs.name_filters }}
          AGGREGATE_ALL_FILES: ${{ inputs.aggregate_all_files }}
          ALL_DATES:    ${{ inputs.all_dates }}
          OUTPUT_FORMATS: ${{ inputs.output_formats }}
        run: |
          set -Eeuo pipefail
          source /tmp/echo_helpers.sh
          echo "LEDGER_PATH=${LEDGER_PATH:-'(빈값: 자동탐색)'}"
          echo "FROM_DATE=${FROM_DATE}"
          echo "TO_DATE=${TO_DATE}"
          echo "SHEET_NAME=${SHEET_NAME}"
          echo "LEDGER_EXTS=${LEDGER_EXTS:-'(제한 없음)'}"
          echo "LEDGER_SEARCH_ROOTS=${LEDGER_SEARCH_ROOTS}"
          echo "LEDGER_NAME_FILTERS=${LEDGER_NAME_FILTERS}"
          echo "AGGREGATE_ALL_FILES=${AGGREGATE_ALL_FILES}"
          echo "ALL_DATES=${ALL_DATES}"
          echo "OUTPUT_FORMATS=${OUTPUT_FORMATS}"
          test -n "${JAR:-}" || { faile "JAR 환경변수가 비어 있습니다."; exit 1; }
          run java -jar "${JAR}" "${LEDGER_PATH:-}" "${FROM_DATE:-}" "${TO_DATE:-}"

      # 7) 릴리즈 생성 + 정식 다운로드 주소 추출 (JAR + 리포트)
      - name: Create GitHub Release (attach JAR & reports)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ledger-${{ github.run_id }}"
          name: "Ledger Viewer Build ${{ github.run_id }}"
          draft: false
          prerelease: false
          files: |
            ${{ steps.pickjar.outputs.jar_path }}
            target/reports/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize Release URLs (정식 다운로드 링크)
        id: relurls
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh release view "ledger-${GITHUB_RUN_ID}" --json url,assets)"
          PAGE_URL="$(echo "$JSON" | jq -r '.url')"
          ASSET_URL="$(echo "$JSON" | jq -r '.assets[0].url')"
          echo "release_page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "asset_download_url=${ASSET_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "## ✅ Download Links (Release)"
            echo "- Release page: ${PAGE_URL}"
            echo "- First asset:  ${ASSET_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 8) 아티팩트 업로드(로그/리포트/JAR 보존)
      - name: Upload artifacts (logs + jars + reports + sources used)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-artifacts-${{ github.run_id }}
          path: |
            ${LOG_DIR}
            **/target/*.jar
            target/reports/**/*
            data/*.csv
            .github/**/*.xlsx
            .github/**/*.xls
            .github/**/*.csv
          if-no-files-found: ignore

      # 9) 요약
      - name: Job summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "### 🧾 Reports"
            echo "- Consolidated CSV: \`target/reports/ledger_consolidated.csv\`"
            echo "- Summary by date:  \`target/reports/summary_by_date.csv\`"
            echo "- HTML summary:     \`target/reports/summary.html\`"
            echo "### 🔗 Release"
            echo "- Page:  ${{ steps.relurls.outputs.release_page_url }}"
            echo "- Asset: ${{ steps.relurls.outputs.asset_download_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
